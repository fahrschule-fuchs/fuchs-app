workflows:

  schueler-ios:
    name: Fahrschueler iOS
    instance_type: mac_mini_m2
    max_build_duration: 45

    integrations:
      app_store_connect: FuchsApiKey

    environment:
      vars:
        BUNDLE_ID: "de.fahrsyn.fuchs"
        IOS_DIR: "apps/schueler/ios/App"
        XCODE_PROJECT: "apps/schueler/ios/App/App.xcodeproj"
        XCODE_SCHEME: "App"
        INFO_PLIST: "apps/schueler/ios/App/App/Info.plist"
      node: 22
      xcode: latest

    artifacts:
      - build/ios/ipa/*.ipa

    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true

    scripts:
      - name: Web-Bundle bauen
        script: |
          node scripts/build-www.mjs schueler

      - name: Verschluesselungs-Erklaerung ergaenzen
        script: |
          /usr/libexec/PlistBuddy -c "Add :ITSAppUsesNonExemptEncryption bool false" "$INFO_PLIST" || true

      - name: Capacitor mit iOS abgleichen
        script: |
          cd apps/schueler
          npm ci --ignore-scripts
          npx cap sync ios

      - name: Geteiltes Schema sicherstellen
        script: |
          D="$XCODE_PROJECT/xcshareddata/xcschemes"
          mkdir -p "$D"
          B='BuildableIdentifier="primary" BlueprintIdentifier="504EC3031FED79650016851F" BuildableName="App.app" BlueprintName="App" ReferencedContainer="container:App.xcodeproj"'
          if [ ! -f "$D/App.xcscheme" ]; then
            {
              echo '<?xml version="1.0" encoding="UTF-8"?>'
              echo '<Scheme LastUpgradeVersion="1430" version="1.3">'
              echo '<BuildAction parallelizeBuildables="YES" buildImplicitDependencies="YES"><BuildActionEntries>'
              echo "<BuildActionEntry buildForTesting=\"YES\" buildForRunning=\"YES\" buildForProfiling=\"YES\" buildForArchiving=\"YES\" buildForAnalyzing=\"YES\"><BuildableReference $B></BuildableReference></BuildActionEntry>"
              echo '</BuildActionEntries></BuildAction>'
              echo '<TestAction buildConfiguration="Debug"></TestAction>'
              echo "<LaunchAction buildConfiguration=\"Debug\"><BuildableProductRunnable runnableDebuggingMode=\"0\"><BuildableReference $B></BuildableReference></BuildableProductRunnable></LaunchAction>"
              echo "<ProfileAction buildConfiguration=\"Release\"><BuildableProductRunnable runnableDebuggingMode=\"0\"><BuildableReference $B></BuildableReference></BuildableProductRunnable></ProfileAction>"
              echo '<AnalyzeAction buildConfiguration="Debug"></AnalyzeAction>'
              echo '<ArchiveAction buildConfiguration="Release" revealArchiveInOrganizer="YES"></ArchiveAction>'
              echo '</Scheme>'
            } > "$D/App.xcscheme"
          fi

      - name: Push-Berechtigung und AppDelegate vorbereiten
        script: |
          ENT="$IOS_DIR/App/App.entitlements"
          printf '%s\n' '<?xml version="1.0" encoding="UTF-8"?>' \
            '<!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">' \
            '<plist version="1.0"><dict><key>aps-environment</key><string>production</string></dict></plist>' > "$ENT"
          python3 -c "
          import os
          p = os.path.join(os.environ['IOS_DIR'], 'App', 'AppDelegate.swift')
          s = open(p).read()
          if 'didRegisterForRemoteNotifications' in s:
              print('AppDelegate schon fertig')
          else:
              b = '''
              func application(_ application: UIApplication, didRegisterForRemoteNotificationsWithDeviceToken deviceToken: Data) {
                  NotificationCenter.default.post(name: .capacitorDidRegisterForRemoteNotifications, object: deviceToken)
              }
              func application(_ application: UIApplication, didFailToRegisterForRemoteNotificationsWithError error: Error) {
                  NotificationCenter.default.post(name: .capacitorDidFailToRegisterForRemoteNotifications, object: error)
              }
          '''
              i = s.rstrip().rfind('}')
              open(p, 'w').write(s[:i] + b + chr(10) + '}' + chr(10))
              print('AppDelegate ergaenzt')
          "

      - name: Buildnummer setzen
        script: |
          cd "$IOS_DIR"
          agvtool new-version -all "$BUILD_NUMBER" || true

      - name: Altes Zertifikat und Profil entfernen
        script: |
          J="import sys,json; d=json.load(sys.stdin); d=d.get('data',d) if isinstance(d,dict) else d; print(chr(10).join(x['id'] for x in d))"
          RES=$(app-store-connect bundle-ids list --bundle-id-identifier "$BUNDLE_ID" \
            --strict-match-identifier --json | python3 -c "$J" | head -1)
          echo "Bundle-ID bei Apple: $RES"
          app-store-connect bundle-ids enable-capabilities "$RES" \
            --capability "Push Notifications" || echo "Push war schon aktiv"
          for P in $(app-store-connect bundle-ids profiles --bundle-ids "$RES" \
              --type IOS_APP_STORE --json | python3 -c "$J"); do
            echo "Profil weg: $P"; app-store-connect profiles delete "$P" --ignore-not-found || true
          done
          for C in $(app-store-connect certificates list --type DISTRIBUTION IOS_DISTRIBUTION \
              --json | python3 -c "$J"); do
            echo "Zertifikat weg: $C"; app-store-connect certificates delete "$C" --ignore-not-found || true
          done
          sleep 20

      - name: Zertifikat und Profil neu erzeugen
        script: |
          openssl genrsa -out /tmp/k.pem 2048
          app-store-connect fetch-signing-files "$BUNDLE_ID" --type IOS_APP_STORE \
            --certificate-key @file:/tmp/k.pem --create
          keychain initialize
          keychain add-certificates --certificate-password ""
          xcode-project use-profiles --project "$XCODE_PROJECT"
      - name: iPhone-App bauen
        script: |
          xcode-project build-ipa --project "$XCODE_PROJECT" --scheme "$XCODE_SCHEME" \
            --archive-xcargs "COMPILER_INDEX_STORE_ENABLE=NO CODE_SIGN_STYLE=Manual CODE_SIGN_ENTITLEMENTS=App/App.entitlements"
