workflows:

  schueler-ios:
    name: Fahrschueler iOS
    instance_type: mac_mini_m2
    max_build_duration: 45

    integrations:
      app_store_connect: FuchsApiKey

    environment:
      vars:
        BUNDLE_ID: "de.fahrsyn.fuchs"
        IOS_DIR: "apps/schueler/ios/App"
        XCODE_PROJECT: "apps/schueler/ios/App/App.xcodeproj"
        XCODE_SCHEME: "App"
        INFO_PLIST: "apps/schueler/ios/App/App/Info.plist"
      node: 22
      xcode: latest

    scripts:
      - name: Web-Bundle bauen
        script: |
          node scripts/build-www.mjs schueler

      - name: Verschluesselungs-Erklaerung ergaenzen
        script: |
          /usr/libexec/PlistBuddy -c "Add :ITSAppUsesNonExemptEncryption bool false" "$INFO_PLIST" || true

      - name: Capacitor mit iOS abgleichen
        script: |
          cd apps/schueler
          npm ci --ignore-scripts
          npx cap sync ios

      - name: Geteiltes Schema sicherstellen
        script: |
          SCHEME_DIR="$XCODE_PROJECT/xcshareddata/xcschemes"
          mkdir -p "$SCHEME_DIR"
          if [ ! -f "$SCHEME_DIR/App.xcscheme" ]; then
            cat > "$SCHEME_DIR/App.xcscheme" <<'XCSCHEME'
          <?xml version="1.0" encoding="UTF-8"?>
          <Scheme LastUpgradeVersion="1430" version="1.3">
             <BuildAction parallelizeBuildables="YES" buildImplicitDependencies="YES">
                <BuildActionEntries>
                   <BuildActionEntry buildForTesting="YES" buildForRunning="YES" buildForProfiling="YES" buildForArchiving="YES" buildForAnalyzing="YES">
                      <BuildableReference BuildableIdentifier="primary" BlueprintIdentifier="504EC3031FED79650016851F" BuildableName="App.app" BlueprintName="App" ReferencedContainer="container:App.xcodeproj"></BuildableReference>
                   </BuildActionEntry>
                </BuildActionEntries>
             </BuildAction>
             <TestAction buildConfiguration="Debug" selectedDebuggerIdentifier="Xcode.DebuggerFoundation.Debugger.LLDB" selectedLauncherIdentifier="Xcode.DebuggerFoundation.Launcher.LLDB" shouldUseLaunchSchemeArgsEnv="YES"></TestAction>
             <LaunchAction buildConfiguration="Debug" selectedDebuggerIdentifier="Xcode.DebuggerFoundation.Debugger.LLDB" selectedLauncherIdentifier="Xcode.DebuggerFoundation.Launcher.LLDB" launchStyle="0" useCustomWorkingDirectory="NO" ignoresPersistentStateOnLaunch="NO" debugDocumentVersioning="YES" debugServiceExtension="internal" allowLocationSimulation="YES">
                <BuildableProductRunnable runnableDebuggingMode="0">
                   <BuildableReference BuildableIdentifier="primary" BlueprintIdentifier="504EC3031FED79650016851F" BuildableName="App.app" BlueprintName="App" ReferencedContainer="container:App.xcodeproj"></BuildableReference>
                </BuildableProductRunnable>
             </LaunchAction>
             <ProfileAction buildConfiguration="Release" shouldUseLaunchSchemeArgsEnv="YES" savedToolIdentifier="" useCustomWorkingDirectory="NO" debugDocumentVersioning="YES">
                <BuildableProductRunnable runnableDebuggingMode="0">
                   <BuildableReference BuildableIdentifier="primary" BlueprintIdentifier="504EC3031FED79650016851F" BuildableName="App.app" BlueprintName="App" ReferencedContainer="container:App.xcodeproj"></BuildableReference>
                </BuildableProductRunnable>
             </ProfileAction>
             <AnalyzeAction buildConfiguration="Debug"></AnalyzeAction>
             <ArchiveAction buildConfiguration="Release" revealArchiveInOrganizer="YES"></ArchiveAction>
          </Scheme>
          XCSCHEME
          fi

      - name: Push-Berechtigung und AppDelegate vorbereiten
        script: |
          ENT="$IOS_DIR/App/App.entitlements"
          if [ ! -f "$ENT" ]; then
            cat > "$ENT" <<'PLIST'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>aps-environment</key>
            <string>production</string>
          </dict>
          </plist>
          PLIST
          fi
          echo "--- App.entitlements ---"
          cat "$ENT"
          python3 - <<'PYEOF'
          import os, re
          path = os.path.join(os.environ["IOS_DIR"], "App", "AppDelegate.swift")
          src = open(path, encoding="utf-8").read()
          if "didRegisterForRemoteNotificationsWithDeviceToken" in src:
              print("AppDelegate: Push-Weiterleitung bereits vorhanden")
          else:
              block = '''
              func application(_ application: UIApplication, didRegisterForRemoteNotificationsWithDeviceToken deviceToken: Data) {
                  NotificationCenter.default.post(name: .capacitorDidRegisterForRemoteNotifications, object: deviceToken)
              }

              func application(_ application: UIApplication, didFailToRegisterForRemoteNotificationsWithError error: Error) {
                  NotificationCenter.default.post(name: .capacitorDidFailToRegisterForRemoteNotifications, object: error)
              }
          '''
              idx = src.rstrip().rfind("}")
              src = src[:idx] + block + "\n}\n"
              open(path, "w", encoding="utf-8").write(src)
              print("AppDelegate: Push-Weiterleitung eingefuegt")
          PYEOF

      - name: Buildnummer setzen
        script: |
          cd "$IOS_DIR"
          agvtool new-version -all "$BUILD_NUMBER" || true

      - name: Push-Faehigkeit bei Apple sicherstellen
        script: |
          RES_ID=$(app-store-connect bundle-ids list \
            --bundle-id-identifier "$BUNDLE_ID" \
            --strict-match-identifier \
            --json | python3 -c "import sys,json; d=json.load(sys.stdin); d=d.get('data',d) if isinstance(d,dict) else d; print(d[0]['id'])" || echo "")
          echo "Bundle-ID-Kennung bei Apple: [$RES_ID]"
          if [ -z "$RES_ID" ]; then
            echo "WARNUNG: Kennung nicht gefunden - Schritt wird uebersprungen"
            exit 0
          fi

          app-store-connect bundle-ids enable-capabilities "$RES_ID" \
            --capability "Push Notifications" || echo "Push war bereits aktiv"

          echo "--- Aktive Faehigkeiten ---"
          app-store-connect bundle-ids capabilities "$RES_ID" || true

          echo "--- Alte App-Store-Profile entfernen ---"
          for PID in $(app-store-connect bundle-ids profiles \
                --bundle-ids "$RES_ID" \
                --type IOS_APP_STORE \
                --json | python3 -c "import sys,json; d=json.load(sys.stdin); d=d.get('data',d) if isinstance(d,dict) else d; print('\n'.join(p['id'] for p in d))" || echo ""); do
            echo "Loesche Profil $PID"
            app-store-connect profiles delete "$PID" --ignore-not-found
          done

          echo "--- 30 Sekunden warten, damit Apple die Faehigkeit uebernimmt ---"
          sleep 30

      - name: Zertifikat und Profil bei Apple erzeugen
        script: |
          openssl genrsa -out /tmp/fuchs_cert_key.pem 2048
          app-store-connect fetch-signing-files "$BUNDLE_ID" \
            --type IOS_APP_STORE \
            --certificate-key @file:/tmp/fuchs_cert_key.pem \
            --create
          keychain initialize
          keychain add-certificates --certificate-password ""
          xcode-project use-profiles --project "$XCODE_PROJECT"

          echo "=============================================="
          echo " PRUEFUNG: Enthaelt das Profil die Push-Berechtigung?"
          echo "=============================================="
          FOUND=0
          for DIR in "$HOME/Library/MobileDevice/Provisioning Profiles" \
                     "$HOME/Library/Developer/Xcode/UserData/Provisioning Profiles"; do
            [ -d "$DIR" ] || continue
            for PROF in "$DIR"/*.mobileprovision; do
              [ -f "$PROF" ] || continue
              FOUND=1
              security cms -D -i "$PROF" > /tmp/prof.plist 2>/dev/null || continue
              echo "----------------------------------------------"
              /usr/libexec/PlistBuddy -c "Print :Name" /tmp/prof.plist 2>/dev/null
              /usr/libexec/PlistBuddy -c "Print :CreationDate" /tmp/prof.plist 2>/dev/null
              printf "aps-environment: "
              /usr/libexec/PlistBuddy -c "Print :Entitlements:aps-environment" /tmp/prof.plist 2>/dev/null \
                || echo "FEHLT >>> Profil ohne Push"
            done
          done
          [ "$FOUND" = "1" ] || echo "Kein Profil auf der Maschine gefunden"
          echo "=============================================="

      - name: iPhone-App bauen
        script: |
          xcode-project build-ipa --project "$XCODE_PROJECT" --scheme "$XCODE_SCHEME" \
            --archive-xcargs "COMPILER_INDEX_STORE_ENABLE=NO CODE_SIGN_STYLE=Manual CODE_SIGN_ENTITLEMENTS=App/App.entitlements"

    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log

    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
