workflows:

  schueler-ios:
    name: Fahrschueler iOS
    instance_type: mac_mini_m2
    max_build_duration: 45

    integrations:
      app_store_connect: FuchsApiKey

    environment:
      vars:
        BUNDLE_ID: "de.fahrsyn.fuchs"
        IOS_DIR: "apps/schueler/ios/App"
        XCODE_PROJECT: "apps/schueler/ios/App/App.xcodeproj"
        XCODE_SCHEME: "App"
        INFO_PLIST: "apps/schueler/ios/App/App/Info.plist"
      node: 22
      xcode: latest

    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log

    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true

    scripts:
      - name: Web-Bundle bauen
        script: |
          node scripts/build-www.mjs schueler

      - name: Verschluesselungs-Erklaerung ergaenzen
        script: |
          /usr/libexec/PlistBuddy -c "Add :ITSAppUsesNonExemptEncryption bool false" "$INFO_PLIST" || true

      - name: Capacitor mit iOS abgleichen
        script: |
          cd apps/schueler
          npm ci --ignore-scripts
          npx cap sync ios

      - name: Geteiltes Schema sicherstellen
        script: |
          D="$XCODE_PROJECT/xcshareddata/xcschemes"
          mkdir -p "$D"
          B='BuildableIdentifier="primary" BlueprintIdentifier="504EC3031FED79650016851F" BuildableName="App.app" BlueprintName="App" ReferencedContainer="container:App.xcodeproj"'
          if [ ! -f "$D/App.xcscheme" ]; then
            {
              echo '<?xml version="1.0" encoding="UTF-8"?>'
              echo '<Scheme LastUpgradeVersion="1430" version="1.3">'
              echo '<BuildAction parallelizeBuildables="YES" buildImplicitDependencies="YES"><BuildActionEntries>'
              echo "<BuildActionEntry buildForTesting=\"YES\" buildForRunning=\"YES\" buildForProfiling=\"YES\" buildForArchiving=\"YES\" buildForAnalyzing=\"YES\"><BuildableReference $B></BuildableReference></BuildActionEntry>"
              echo '</BuildActionEntries></BuildAction>'
              echo '<TestAction buildConfiguration="Debug"></TestAction>'
              echo "<LaunchAction buildConfiguration=\"Debug\"><BuildableProductRunnable runnableDebuggingMode=\"0\"><BuildableReference $B></BuildableReference></BuildableProductRunnable></LaunchAction>"
              echo "<ProfileAction buildConfiguration=\"Release\"><BuildableProductRunnable runnableDebuggingMode=\"0\"><BuildableReference $B></BuildableReference></BuildableProductRunnable></ProfileAction>"
              echo '<AnalyzeAction buildConfiguration="Debug"></AnalyzeAction>'
              echo '<ArchiveAction buildConfiguration="Release" revealArchiveInOrganizer="YES"></ArchiveAction>'
              echo '</Scheme>'
            } > "$D/App.xcscheme"
          fi

      - name: Push-Berechtigung und AppDelegate vorbereiten
        script: |
          ENT="$IOS_DIR/App/App.entitlements"
          printf '%s\n' '<?xml version="1.0" encoding="UTF-8"?>' \
            '<!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">' \
            '<plist version="1.0"><dict><key>aps-environment</key><string>production</string></dict></plist>' > "$ENT"
          python3 -c "
          import os
          p = os.path.join(os.environ['IOS_DIR'], 'App', 'AppDelegate.swift')
          s = open(p).read()
          if 'didRegisterForRemoteNotifications' in s:
              print('AppDelegate schon fertig')
          else:
              b = '''
              func application(_ application: UIApplication, didRegisterForRemoteNotificationsWithDeviceToken deviceToken: Data) {
                  NotificationCenter.default.post(name: .capacitorDidRegisterForRemoteNotifications, object: deviceToken)
              }
              func application(_ application: UIApplication, didFailToRegisterForRemoteNotificationsWithError error: Error) {
                  NotificationCenter.default.post(name: .capacitorDidFailToRegisterForRemoteNotifications, object: error)
              }
          '''
              i = s.rstrip().rfind('}')
              open(p, 'w').write(s[:i] + b + chr(10) + '}' + chr(10))
              print('AppDelegate ergaenzt')
          "
          python3 -c "
          import os
          p = os.path.join(os.environ['IOS_DIR'], 'App.xcodeproj', 'project.pbxproj')
          s = open(p).read()
          if 'CODE_SIGN_ENTITLEMENTS' in s:
              print('Projekteintrag schon vorhanden')
          else:
              a = 'PRODUCT_BUNDLE_IDENTIFIER = de.fahrsyn.fuchs;'
              b = a + chr(10) + chr(9)*4 + 'CODE_SIGN_ENTITLEMENTS = App/App.entitlements;'
              print('Projekteintrag in', s.count(a), 'Konfigurationen ergaenzt')
              open(p, 'w').write(s.replace(a, b))
          "

      - name: Buildnummer setzen
        script: |
          cd "$IOS_DIR"
          agvtool new-version -all "$BUILD_NUMBER" || true

      - name: Altes Zertifikat und Profil entfernen
        script: |
          J="import sys,json; d=json.load(sys.stdin); d=d.get('data',d) if isinstance(d,dict) else d; print(chr(10).join(x['id'] for x in d))"
          RES=$(app-store-connect bundle-ids list --bundle-id-identifier "$BUNDLE_ID" \
            --strict-match-identifier --json | python3 -c "$J" | head -1)
          echo "Bundle-ID bei Apple: $RES"
          app-store-connect bundle-ids enable-capabilities "$RES" \
            --capability "Push Notifications" || echo "Push war schon aktiv"
          for P in $(app-store-connect bundle-ids profiles --bundle-ids "$RES" \
              --type IOS_APP_STORE --json | python3 -c "$J"); do
            echo "Profil weg: $P"; app-store-connect profiles delete "$P" --ignore-not-found || true
          done
          for C in $(app-store-connect certificates list --type DISTRIBUTION IOS_DISTRIBUTION \
              --json | python3 -c "$J"); do
            echo "Zertifikat weg: $C"; app-store-connect certificates delete "$C" --ignore-not-found || true
          done
          sleep 20

      - name: Zertifikat und Profil neu erzeugen
        script: |
          openssl genrsa -out /tmp/k.pem 2048
          app-store-connect fetch-signing-files "$BUNDLE_ID" --type IOS_APP_STORE \
            --certificate-key @file:/tmp/k.pem --create
          keychain initialize
          keychain add-certificates --certificate-password ""
          xcode-project use-profiles --project "$XCODE_PROJECT"

      - name: iPhone-App bauen
        script: |
          xcode-project build-ipa --project "$XCODE_PROJECT" --scheme "$XCODE_SCHEME" \
            --archive-xcargs "COMPILER_INDEX_STORE_ENABLE=NO" \
          || {
            echo "=================== FEHLERGRUND ==================="
            grep -h -A4 -E "error:|error :" /tmp/xcodebuild_logs/*.log | tail -n 60
            echo "=================== LETZTE ZEILEN ================="
            tail -n 40 /tmp/xcodebuild_logs/*.log
            exit 1
          }

  # ====================================================================
  # FAHRLEHRER-APP  ->  Android (.aab fuer den Play Store)
  # --------------------------------------------------------------------
  # Laeuft auf einer Linux-Maschine, kein Mac noetig.
  #
  # Einmalig in der Codemagic-Weboberflaeche anzulegen:
  #   Umgebungsvariablen-Gruppe "signing" mit vier Eintraegen:
  #     CM_KEYSTORE           <- fuchs-fahrlehrer-upload.keystore, als Datei
  #                              hochladen (Codemagic kodiert sie selbst)
  #     CM_KEYSTORE_PASSWORD  <- Passwort des Schluesselspeichers   [secure]
  #     CM_KEY_ALIAS          <- Alias des Schluessels
  #     CM_KEY_PASSWORD       <- Passwort des Schluessels           [secure]
  #
  # Die Versionsnummer steigt automatisch mit jedem Bau ($BUILD_NUMBER),
  # startet aber bei VERSION_OFFSET, damit sie sicher ueber der
  # veroeffentlichten Fassung liegt (die hat versionCode 1).
  #
  # Der Ordner apps/fahrlehrer/android liegt bewusst nicht im Repository -
  # Capacitor erzeugt ihn hier bei jedem Lauf neu aus capacitor.config.json.
  # Dadurch stimmt die applicationId immer und es gibt nichts, was
  # veralten kann.
  # ====================================================================
  fahrlehrer-android:
    name: Fahrlehrer Android
    instance_type: mac_mini_m2
    max_build_duration: 45

    environment:
      groups:
        - signing
      vars:
        VERSION_OFFSET: 10
        VERSION_NAME: "1.1"
      node: 22
      java: 21

    artifacts:
      - apps/fahrlehrer/android/app/build/outputs/bundle/release/*.aab

    scripts:
      - name: Web-Bundle bauen und pruefen
        script: |
          node scripts/build-www.mjs fahrlehrer
          node scripts/pruefe.mjs fahrlehrer

      - name: Android-Projekt erzeugen
        script: |
          cd apps/fahrlehrer
          npm install --no-audit --no-fund
          [ -d android ] || npx cap add android
          npx cap sync android

      - name: App-Symbol und Startbild erzeugen
        script: |
          set -e
          cd apps/fahrlehrer
          mkdir -p assets
          cp ../../quellen/fl-icon-512.png assets/icon.png
          npx capacitor-assets generate --android --assetPath assets \
            --iconBackgroundColor '#FBF8F5' --iconBackgroundColorDark '#FBF8F5' \
            --splashBackgroundColor '#FBF8F5' --splashBackgroundColorDark '#FBF8F5'
          test -f android/app/src/main/res/mipmap-xxxhdpi/ic_launcher.png \
            || { echo "ABBRUCH: App-Symbol wurde nicht erzeugt"; exit 1; }
          echo "Symbol erzeugt aus quellen/fl-icon-512.png"

      - name: Versionsnummer setzen
        script: |
          set -e
          python3 - <<'SETZEN'
          import os, re
          p = "apps/fahrlehrer/android/app/build.gradle"
          s = open(p).read()
          nummer = int(os.environ.get("VERSION_OFFSET", "10")) + int(os.environ["BUILD_NUMBER"])
          name = os.environ.get("VERSION_NAME", "1.1")
          s, n1 = re.subn(r"versionCode\s+\d+", "versionCode %d" % nummer, s, count=1)
          s, n2 = re.subn(r'versionName\s+"[^"]*"', 'versionName "%s"' % name, s, count=1)
          if n1 != 1 or n2 != 1:
              raise SystemExit("ABBRUCH: versionCode/versionName nicht gefunden (%d/%d)" % (n1, n2))
          if nummer <= 1:
              raise SystemExit("ABBRUCH: versionCode %d ist nicht hoeher als die veroeffentlichte Fassung" % nummer)
          open(p, "w").write(s)
          print("versionCode ist jetzt", nummer, "- versionName", name)
          SETZEN
          grep -E "versionCode|versionName|applicationId" apps/fahrlehrer/android/app/build.gradle

      - name: Paket bauen und signieren
        script: |
          cd apps/fahrlehrer/android
          echo $CM_KEYSTORE | base64 --decode > /tmp/fahrlehrer.keystore
          ./gradlew bundleRelease \
            -Pandroid.injected.signing.store.file=/tmp/fahrlehrer.keystore \
            -Pandroid.injected.signing.store.password="$CM_KEYSTORE_PASSWORD" \
            -Pandroid.injected.signing.key.alias="$CM_KEY_ALIAS" \
            -Pandroid.injected.signing.key.password="$CM_KEY_PASSWORD"
          rm -f /tmp/fahrlehrer.keystore

      - name: Nachsehen, was im Paket steckt
        script: |
          set -e
          python3 - <<'PRUEF'
          import zipfile, glob
          p = glob.glob("apps/fahrlehrer/android/app/build/outputs/bundle/release/*.aab")[0]
          z = zipfile.ZipFile(p)

          # 1. Steckt die neue Oberflaeche wirklich drin?
          h = z.read("base/assets/public/index.html").decode("utf-8", "ignore")
          fehlt = [w for w in ("terminMenue", "kontaktKarteHTML", "wknopf") if w not in h]
          print("Oberflaeche im Paket:", len(h), "Zeichen")
          if fehlt:
              raise SystemExit("ABBRUCH - fehlt im Paket: " + ", ".join(fehlt))

          # 2. Ist die Versionsnummer wirklich hoeher als die veroeffentlichte (1)?
          m = z.read("base/manifest/AndroidManifest.xml")
          i = m.find(b"versionCode")
          if i < 0 or m[i + 11] != 0x1a:
              raise SystemExit("ABBRUCH - versionCode nicht lesbar")
          laenge = m[i + 12]
          nummer = int(m[i + 13:i + 13 + laenge].decode())
          print("versionCode im fertigen Paket:", nummer)
          if nummer <= 1:
              raise SystemExit("ABBRUCH - versionCode %d, Google wuerde das Paket ablehnen" % nummer)

          # 3. Ist das Fuchs-Symbol drin und nicht das Standard-Symbol?
          symbole = [n for n in z.namelist() if n.endswith("mipmap-xxxhdpi-v4/ic_launcher.png")]
          if not symbole:
              raise SystemExit("ABBRUCH - kein App-Symbol im Paket")
          groesse = z.getinfo(symbole[0]).file_size
          print("App-Symbol:", groesse, "Bytes")
          if groesse < 4000:
              raise SystemExit("ABBRUCH - App-Symbol zu klein, vermutlich das Standard-Symbol")

          # 4. Ist es signiert?
          sig = [n for n in z.namelist() if n.startswith("META-INF/") and n[-4:] in (".RSA", ".DSA", ".EC")]
          if not sig:
              raise SystemExit("ABBRUCH - das Paket ist nicht signiert")
          print("Signiert mit:", sig[0])

          print("Alles in Ordnung.")
          PRUEF
