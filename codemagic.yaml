workflows:

  schueler-ios:
    name: Fahrschueler iOS
    instance_type: mac_mini_m2
    max_build_duration: 45

    integrations:
      app_store_connect: FuchsApiKey

    environment:
      vars:
        BUNDLE_ID: "de.fahrsyn.fuchs"
        # Die Fassung, unter der die App im App Store erscheint. Fuer jedes
        # Update hochzaehlen - Apple nimmt keine zweite Fassung mit derselben
        # Nummer an. Aendern laesst sich das hier oder in der
        # Codemagic-Oberflaeche unter "Environment variables".
        APP_VERSION: "1.1"
        IOS_DIR: "apps/schueler/ios/App"
        XCODE_PROJECT: "apps/schueler/ios/App/App.xcodeproj"
        XCODE_SCHEME: "App"
        INFO_PLIST: "apps/schueler/ios/App/App/Info.plist"
      node: 22
      xcode: latest

    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log

    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true

    scripts:
      - name: Web-Bundle bauen und pruefen
        script: |
          node scripts/build-www.mjs schueler
          # Nachsehen, ob wirklich die AKTUELLE Oberflaeche im Paket liegt.
          # Am 24.08. ging eine Fassung ohne Lernbereich in den Store, weil die
          # Quelle im Repo aelter war als der Server. Das faellt jetzt hier auf.
          python3 - <<'PY'
          import io, sys
          s = io.open("apps/schueler/www/index.html", encoding="utf-8").read()
          noetig = {
              "Lernbereich (Theorie lernen)": "renderLernbereich",
              "Seite Rechtliches & Quellen": "renderRecht",
              "Quellenangabe arge tp 21": "arge tp 21",
              "Boot-Skript der App-Huelle": "fuchs-native.js",
              "Anmeldecode ohne Foxy-Chat": "code-anfordern",
              "Einladungs-Link vom Vertrag": "einladung/einloesen",
          }
          fehlt = [name for name, marke in noetig.items() if marke not in s]
          print("Web-Bundle: %d Zeichen" % len(s))
          for name in noetig:
              print(("  ok   " if name not in fehlt else "  FEHLT ") + name)
          if fehlt:
              sys.exit("ABBRUCH: Im Paket fehlt: " + ", ".join(fehlt)
                       + ". Vermutlich ist quellen/index.html aelter als der Server.")
          PY

      - name: Verschluesselungs-Erklaerung ergaenzen
        script: |
          /usr/libexec/PlistBuddy -c "Add :ITSAppUsesNonExemptEncryption bool false" "$INFO_PLIST" || true

      - name: Capacitor mit iOS abgleichen
        script: |
          cd apps/schueler
          npm ci --ignore-scripts
          npx cap sync ios

      - name: Geteiltes Schema sicherstellen
        script: |
          D="$XCODE_PROJECT/xcshareddata/xcschemes"
          mkdir -p "$D"
          B='BuildableIdentifier="primary" BlueprintIdentifier="504EC3031FED79650016851F" BuildableName="App.app" BlueprintName="App" ReferencedContainer="container:App.xcodeproj"'
          if [ ! -f "$D/App.xcscheme" ]; then
            {
              echo '<?xml version="1.0" encoding="UTF-8"?>'
              echo '<Scheme LastUpgradeVersion="1430" version="1.3">'
              echo '<BuildAction parallelizeBuildables="YES" buildImplicitDependencies="YES"><BuildActionEntries>'
              echo "<BuildActionEntry buildForTesting=\"YES\" buildForRunning=\"YES\" buildForProfiling=\"YES\" buildForArchiving=\"YES\" buildForAnalyzing=\"YES\"><BuildableReference $B></BuildableReference></BuildActionEntry>"
              echo '</BuildActionEntries></BuildAction>'
              echo '<TestAction buildConfiguration="Debug"></TestAction>'
              echo "<LaunchAction buildConfiguration=\"Debug\"><BuildableProductRunnable runnableDebuggingMode=\"0\"><BuildableReference $B></BuildableReference></BuildableProductRunnable></LaunchAction>"
              echo "<ProfileAction buildConfiguration=\"Release\"><BuildableProductRunnable runnableDebuggingMode=\"0\"><BuildableReference $B></BuildableReference></BuildableProductRunnable></ProfileAction>"
              echo '<AnalyzeAction buildConfiguration="Debug"></AnalyzeAction>'
              echo '<ArchiveAction buildConfiguration="Release" revealArchiveInOrganizer="YES"></ArchiveAction>'
              echo '</Scheme>'
            } > "$D/App.xcscheme"
          fi

      - name: Push-Berechtigung und AppDelegate vorbereiten
        script: |
          ENT="$IOS_DIR/App/App.entitlements"
          printf '%s\n' '<?xml version="1.0" encoding="UTF-8"?>' \
            '<!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">' \
            '<plist version="1.0"><dict><key>aps-environment</key><string>production</string></dict></plist>' > "$ENT"
          python3 -c "
          import os
          p = os.path.join(os.environ['IOS_DIR'], 'App', 'AppDelegate.swift')
          s = open(p).read()
          if 'didRegisterForRemoteNotifications' in s:
              print('AppDelegate schon fertig')
          else:
              b = '''
              func application(_ application: UIApplication, didRegisterForRemoteNotificationsWithDeviceToken deviceToken: Data) {
                  NotificationCenter.default.post(name: .capacitorDidRegisterForRemoteNotifications, object: deviceToken)
              }
              func application(_ application: UIApplication, didFailToRegisterForRemoteNotificationsWithError error: Error) {
                  NotificationCenter.default.post(name: .capacitorDidFailToRegisterForRemoteNotifications, object: error)
              }
          '''
              i = s.rstrip().rfind('}')
              open(p, 'w').write(s[:i] + b + chr(10) + '}' + chr(10))
              print('AppDelegate ergaenzt')
          "
          python3 -c "
          import os
          p = os.path.join(os.environ['IOS_DIR'], 'App.xcodeproj', 'project.pbxproj')
          s = open(p).read()
          if 'CODE_SIGN_ENTITLEMENTS' in s:
              print('Projekteintrag schon vorhanden')
          else:
              a = 'PRODUCT_BUNDLE_IDENTIFIER = de.fahrsyn.fuchs;'
              b = a + chr(10) + chr(9)*4 + 'CODE_SIGN_ENTITLEMENTS = App/App.entitlements;'
              print('Projekteintrag in', s.count(a), 'Konfigurationen ergaenzt')
              open(p, 'w').write(s.replace(a, b))
          "

      - name: Versions- und Buildnummer setzen
        script: |
          # Die Buildnummer zaehlt Codemagic hoch; die Fassung fuer den Store
          # steht in APP_VERSION. Frueher stand sie fest im Xcode-Projekt -
          # eine zweite Einreichung mit derselben Nummer weist Apple ab.
          python3 - <<'PY'
          import os, re, sys
          pfad = os.path.join(os.environ["XCODE_PROJECT"], "project.pbxproj")
          fassung = os.environ.get("APP_VERSION", "").strip()
          if not fassung:
              sys.exit("ABBRUCH: APP_VERSION ist leer.")
          s = open(pfad, encoding="utf-8").read()
          s, n = re.subn(r"MARKETING_VERSION = [^;]+;", "MARKETING_VERSION = %s;" % fassung, s)
          if n == 0:
              sys.exit("ABBRUCH: MARKETING_VERSION nicht gefunden.")
          open(pfad, "w", encoding="utf-8").write(s)
          print("Fassung fuer den Store: %s (an %d Stellen gesetzt)" % (fassung, n))
          PY
          cd "$IOS_DIR"
          agvtool new-version -all "$BUILD_NUMBER" || true
          echo "Buildnummer: $BUILD_NUMBER"

      - name: Altes Zertifikat und Profil entfernen
        script: |
          J="import sys,json; d=json.load(sys.stdin); d=d.get('data',d) if isinstance(d,dict) else d; print(chr(10).join(x['id'] for x in d))"
          RES=$(app-store-connect bundle-ids list --bundle-id-identifier "$BUNDLE_ID" \
            --strict-match-identifier --json | python3 -c "$J" | head -1)
          echo "Bundle-ID bei Apple: $RES"
          app-store-connect bundle-ids enable-capabilities "$RES" \
            --capability "Push Notifications" || echo "Push war schon aktiv"
          for P in $(app-store-connect bundle-ids profiles --bundle-ids "$RES" \
              --type IOS_APP_STORE --json | python3 -c "$J"); do
            echo "Profil weg: $P"; app-store-connect profiles delete "$P" --ignore-not-found || true
          done
          for C in $(app-store-connect certificates list --type DISTRIBUTION IOS_DISTRIBUTION \
              --json | python3 -c "$J"); do
            echo "Zertifikat weg: $C"; app-store-connect certificates delete "$C" --ignore-not-found || true
          done
          sleep 20

      - name: Zertifikat und Profil neu erzeugen
        script: |
          openssl genrsa -out /tmp/k.pem 2048
          app-store-connect fetch-signing-files "$BUNDLE_ID" --type IOS_APP_STORE \
            --certificate-key @file:/tmp/k.pem --create
          keychain initialize
          keychain add-certificates --certificate-password ""
          xcode-project use-profiles --project "$XCODE_PROJECT"

      - name: iPhone-App bauen
        script: |
          xcode-project build-ipa --project "$XCODE_PROJECT" --scheme "$XCODE_SCHEME" \
            --archive-xcargs "COMPILER_INDEX_STORE_ENABLE=NO" \
          || {
            echo "=================== FEHLERGRUND ==================="
            grep -h -A4 -E "error:|error :" /tmp/xcodebuild_logs/*.log | tail -n 60
            echo "=================== LETZTE ZEILEN ================="
            tail -n 40 /tmp/xcodebuild_logs/*.log
            exit 1
          }

  # ====================================================================
  # FAHRSCHUELER-APP  ->  Android (.aab fuer den Play Store)
  # --------------------------------------------------------------------
  # Angelegt am 29.08.2026. Bis dahin wurde die Android-Fassung der
  # Fahrschueler-App auf einem PC von Hand gebaut - deshalb stand im Play
  # Store am 29.08. noch die Fassung vom 10.08., ohne Lernbereich, ohne
  # die neue Anmeldung und ohne "Rechtliches & Quellen". Mit diesem
  # Ablauf entsteht das Paket aus derselben Quelle wie die iOS-Fassung.
  #
  # ACHTUNG, EIGENER SCHLUESSEL:
  # Die Gruppe "signing" enthaelt den Schluessel der FAHRLEHRER-App. Mit
  # dem darf die Fahrschueler-App NICHT signiert werden - Google lehnt
  # ein Paket ab, das mit einem anderen Upload-Zertifikat signiert ist
  # als das bereits veroeffentlichte.
  #
  # Einmalig in der Codemagic-Weboberflaeche anzulegen:
  #   Umgebungsvariablen-Gruppe "signing-schueler" mit vier Eintraegen -
  #   aus DEMSELBEN Schluesselspeicher, mit dem die Fahrschueler-App
  #   bisher auf dem PC signiert wurde:
  #     CM_KEYSTORE           <- Schluesselspeicher als Datei hochladen
  #     CM_KEYSTORE_PASSWORD  <- Passwort des Speichers            [secure]
  #     CM_KEY_ALIAS          <- Alias des Schluessels
  #     CM_KEY_PASSWORD       <- Passwort des Schluessels          [secure]
  #
  # Der vorletzte Schritt druckt den Fingerabdruck des Zertifikats, mit
  # dem tatsaechlich signiert wurde. Er muss mit dem "Upload-Zertifikat"
  # in der Play Console (Release -> Setup -> App-Integritaet) exakt
  # uebereinstimmen. Lieber hier vergleichen als beim Hochladen scheitern.
  #
  # VERSION_OFFSET muss ueber dem versionCode der veroeffentlichten
  # Fassung liegen. Der steht in der Play Console unter Release ->
  # Produktion beim letzten Release in Klammern hinter der Versionsnummer.
  # 100 ist bewusst grosszuegig gewaehlt; Luecken schaden nicht.
  #
  # Der Ordner apps/schueler/android liegt bewusst nicht im Repository -
  # Capacitor erzeugt ihn bei jedem Lauf neu aus capacitor.config.json.
  # ====================================================================
  schueler-android:
    name: Fahrschueler Android
    instance_type: mac_mini_m2
    max_build_duration: 45

    environment:
      groups:
        - signing-schueler
      vars:
        VERSION_OFFSET: 100
        VERSION_NAME: "1.1"
      node: 22
      java: 21

    artifacts:
      - apps/schueler/android/app/build/outputs/bundle/release/*.aab

    scripts:
      - name: Web-Bundle bauen und pruefen
        script: |
          node scripts/build-www.mjs schueler
          # pruefe.mjs sieht sich IMMER beide Apps an und bricht ab, wenn
          # eine kein www/ hat. Deshalb wird das Fahrlehrer-Bundle hier
          # mitgebaut - es wird nur geprueft, nicht verpackt.
          node scripts/build-www.mjs fahrlehrer
          # Dieselbe Pruefung wie im iOS-Ablauf: liegt wirklich die
          # AKTUELLE Oberflaeche im Paket? Am 24.08. ging eine Fassung
          # ohne Lernbereich in den Store, weil die Quelle im Repo aelter
          # war als der Server.
          python3 - <<'PY'
          import io, sys
          s = io.open("apps/schueler/www/index.html", encoding="utf-8").read()
          noetig = {
              "Lernbereich (Theorie lernen)": "renderLernbereich",
              "Seite Rechtliches & Quellen": "renderRecht",
              "Quellenangabe arge tp 21": "arge tp 21",
              "Boot-Skript der App-Huelle": "fuchs-native.js",
              "Anmeldecode ohne Foxy-Chat": "code-anfordern",
              "Einladungs-Link vom Vertrag": "einladung/einloesen",
          }
          fehlt = [name for name, marke in noetig.items() if marke not in s]
          print("Web-Bundle: %d Zeichen" % len(s))
          for name in noetig:
              print(("  ok   " if name not in fehlt else "  FEHLT ") + name)
          if fehlt:
              sys.exit("ABBRUCH: Im Paket fehlt: " + ", ".join(fehlt)
                       + ". Vermutlich ist quellen/index.html aelter als der Server.")
          PY
          node scripts/pruefe.mjs

      - name: Android-Projekt erzeugen
        script: |
          cd apps/schueler
          npm install --no-audit --no-fund
          [ -d android ] || npx cap add android
          npx cap sync android

      - name: App-Symbol und Startbild erzeugen
        script: |
          set -e
          cd apps/schueler
          mkdir -p assets
          cp ../../quellen/icon-512.png assets/icon.png
          npx capacitor-assets generate --android --assetPath assets \
            --iconBackgroundColor '#FBF8F5' --iconBackgroundColorDark '#FBF8F5' \
            --splashBackgroundColor '#FBF8F5' --splashBackgroundColorDark '#FBF8F5'
          test -f android/app/src/main/res/mipmap-xxxhdpi/ic_launcher.png \
            || { echo "ABBRUCH: App-Symbol wurde nicht erzeugt"; exit 1; }
          echo "Symbol erzeugt aus quellen/icon-512.png"

      - name: Versionsnummer setzen
        script: |
          set -e
          python3 - <<'SETZEN'
          import os, re
          p = "apps/schueler/android/app/build.gradle"
          s = open(p).read()
          offset = int(os.environ.get("VERSION_OFFSET", "100"))
          nummer = offset + int(os.environ["BUILD_NUMBER"])
          name = os.environ.get("VERSION_NAME", "1.1")
          s, n1 = re.subn(r"versionCode\s+\d+", "versionCode %d" % nummer, s, count=1)
          s, n2 = re.subn(r'versionName\s+"[^"]*"', 'versionName "%s"' % name, s, count=1)
          if n1 != 1 or n2 != 1:
              raise SystemExit("ABBRUCH: versionCode/versionName nicht gefunden (%d/%d)" % (n1, n2))
          if nummer <= offset:
              raise SystemExit("ABBRUCH: versionCode %d liegt nicht ueber VERSION_OFFSET" % nummer)
          open(p, "w").write(s)
          print("versionCode ist jetzt", nummer, "- versionName", name)
          SETZEN
          grep -E "versionCode|versionName|applicationId" apps/schueler/android/app/build.gradle

      - name: Paket bauen und signieren
        script: |
          set -e
          cd apps/schueler/android
          echo $CM_KEYSTORE | base64 --decode > /tmp/schueler.keystore
          # Welche Schluessel liegen ueberhaupt im Speicher?
          # Ein unter Windows erzeugter PKCS12 traegt oft NICHT den Namen,
          # den man beim Erzeugen angegeben hat - dann passt CM_KEY_ALIAS
          # nicht und der Bau bricht mit "No key with alias ... found" ab.
          echo "--- Inhalt des Schluesselspeichers ---"
          keytool -list -keystore /tmp/schueler.keystore \
            -storepass "$CM_KEYSTORE_PASSWORD" 2>/dev/null \
            | grep -i "PrivateKeyEntry" || true
          echo "--------------------------------------"
          ALIAS="$CM_KEY_ALIAS"
          if ! keytool -list -keystore /tmp/schueler.keystore \
               -storepass "$CM_KEYSTORE_PASSWORD" -alias "$ALIAS" >/dev/null 2>&1; then
            ALIAS=$(keytool -list -keystore /tmp/schueler.keystore \
              -storepass "$CM_KEYSTORE_PASSWORD" 2>/dev/null \
              | grep -i "PrivateKeyEntry" | head -1 | sed 's/,.*//')
            echo "Name aus CM_KEY_ALIAS passt nicht - benutze den Namen aus dem Speicher: $ALIAS"
          fi
          if [ -z "$ALIAS" ]; then
            echo "ABBRUCH: im Schluesselspeicher steckt kein privater Schluessel"
            rm -f /tmp/schueler.keystore
            exit 1
          fi
          ./gradlew bundleRelease \
            -Pandroid.injected.signing.store.file=/tmp/schueler.keystore \
            -Pandroid.injected.signing.store.password="$CM_KEYSTORE_PASSWORD" \
            -Pandroid.injected.signing.key.alias="$ALIAS" \
            -Pandroid.injected.signing.key.password="$CM_KEY_PASSWORD"
          rm -f /tmp/schueler.keystore

      - name: Fingerabdruck des Signaturzertifikats
        script: |
          set -e
          AAB=$(ls apps/schueler/android/app/build/outputs/bundle/release/*.aab | head -1)
          DATEI=$(unzip -Z1 "$AAB" 'META-INF/*.RSA' 'META-INF/*.DSA' 'META-INF/*.EC' | head -1)
          echo "Signaturdatei im Paket: $DATEI"
          echo "=========================================================="
          echo " Dieser Fingerabdruck MUSS mit dem Upload-Zertifikat in"
          echo " der Play Console uebereinstimmen (Release -> Setup ->"
          echo " App-Integritaet -> Upload-Schluesselzertifikat)."
          echo "=========================================================="
          unzip -p "$AAB" "$DATEI" | keytool -printcert | grep -E "SHA1|SHA256|Inhaber|Owner"

      - name: Nachsehen, was im Paket steckt
        script: |
          set -e
          python3 - <<'PRUEF'
          import zipfile, glob, os
          p = glob.glob("apps/schueler/android/app/build/outputs/bundle/release/*.aab")[0]
          z = zipfile.ZipFile(p)

          # 1. Steckt die neue Oberflaeche wirklich drin?
          h = z.read("base/assets/public/index.html").decode("utf-8", "ignore")
          noetig = ("renderLernbereich", "renderRecht", "arge tp 21",
                    "code-anfordern", "einladung/einloesen")
          fehlt = [w for w in noetig if w not in h]
          print("Oberflaeche im Paket:", len(h), "Zeichen")
          if fehlt:
              raise SystemExit("ABBRUCH - fehlt im Paket: " + ", ".join(fehlt))

          # 2. Ist die Versionsnummer hoeher als die veroeffentlichte?
          m = z.read("base/manifest/AndroidManifest.xml")
          i = m.find(b"versionCode")
          if i < 0 or m[i + 11] != 0x1a:
              raise SystemExit("ABBRUCH - versionCode nicht lesbar")
          laenge = m[i + 12]
          nummer = int(m[i + 13:i + 13 + laenge].decode())
          grenze = int(os.environ.get("VERSION_OFFSET", "100"))
          print("versionCode im fertigen Paket:", nummer)
          if nummer <= grenze:
              raise SystemExit("ABBRUCH - versionCode %d ist zu niedrig" % nummer)

          # 3. Ist das Fuchs-Symbol drin und nicht das Standard-Symbol?
          symbole = [n for n in z.namelist() if n.endswith("mipmap-xxxhdpi-v4/ic_launcher.png")]
          if not symbole:
              raise SystemExit("ABBRUCH - kein App-Symbol im Paket")
          groesse = z.getinfo(symbole[0]).file_size
          print("App-Symbol:", groesse, "Bytes")
          if groesse < 4000:
              raise SystemExit("ABBRUCH - App-Symbol zu klein, vermutlich das Standard-Symbol")

          # 4. Ist es signiert?
          sig = [n for n in z.namelist() if n.startswith("META-INF/") and n[-4:] in (".RSA", ".DSA", ".EC")]
          if not sig:
              raise SystemExit("ABBRUCH - das Paket ist nicht signiert")
          print("Signiert mit:", sig[0])

          print("Alles in Ordnung.")
          PRUEF

  # ====================================================================
  # FAHRLEHRER-APP  ->  Android (.aab fuer den Play Store)
  # --------------------------------------------------------------------
  # Laeuft auf einer Linux-Maschine, kein Mac noetig.
  #
  # Einmalig in der Codemagic-Weboberflaeche anzulegen:
  #   Umgebungsvariablen-Gruppe "signing" mit vier Eintraegen:
  #     CM_KEYSTORE           <- fuchs-fahrlehrer-upload.keystore, als Datei
  #                              hochladen (Codemagic kodiert sie selbst)
  #     CM_KEYSTORE_PASSWORD  <- Passwort des Schluesselspeichers   [secure]
  #     CM_KEY_ALIAS          <- Alias des Schluessels
  #     CM_KEY_PASSWORD       <- Passwort des Schluessels           [secure]
  #
  # Die Versionsnummer steigt automatisch mit jedem Bau ($BUILD_NUMBER),
  # startet aber bei VERSION_OFFSET, damit sie sicher ueber der
  # veroeffentlichten Fassung liegt (die hat versionCode 1).
  #
  # Der Ordner apps/fahrlehrer/android liegt bewusst nicht im Repository -
  # Capacitor erzeugt ihn hier bei jedem Lauf neu aus capacitor.config.json.
  # Dadurch stimmt die applicationId immer und es gibt nichts, was
  # veralten kann.
  # ====================================================================
  fahrlehrer-android:
    name: Fahrlehrer Android
    instance_type: mac_mini_m2
    max_build_duration: 45

    environment:
      groups:
        - signing
      vars:
        VERSION_OFFSET: 10
        VERSION_NAME: "1.1"
      node: 22
      java: 21

    artifacts:
      - apps/fahrlehrer/android/app/build/outputs/bundle/release/*.aab

    scripts:
      - name: Web-Bundle bauen und pruefen
        script: |
          node scripts/build-www.mjs fahrlehrer
          node scripts/pruefe.mjs fahrlehrer

      - name: Android-Projekt erzeugen
        script: |
          cd apps/fahrlehrer
          npm install --no-audit --no-fund
          [ -d android ] || npx cap add android
          npx cap sync android

      - name: App-Symbol und Startbild erzeugen
        script: |
          set -e
          cd apps/fahrlehrer
          mkdir -p assets
          cp ../../quellen/fl-icon-512.png assets/icon.png
          npx capacitor-assets generate --android --assetPath assets \
            --iconBackgroundColor '#FBF8F5' --iconBackgroundColorDark '#FBF8F5' \
            --splashBackgroundColor '#FBF8F5' --splashBackgroundColorDark '#FBF8F5'
          test -f android/app/src/main/res/mipmap-xxxhdpi/ic_launcher.png \
            || { echo "ABBRUCH: App-Symbol wurde nicht erzeugt"; exit 1; }
          echo "Symbol erzeugt aus quellen/fl-icon-512.png"

      - name: Versionsnummer setzen
        script: |
          set -e
          python3 - <<'SETZEN'
          import os, re
          p = "apps/fahrlehrer/android/app/build.gradle"
          s = open(p).read()
          nummer = int(os.environ.get("VERSION_OFFSET", "10")) + int(os.environ["BUILD_NUMBER"])
          name = os.environ.get("VERSION_NAME", "1.1")
          s, n1 = re.subn(r"versionCode\s+\d+", "versionCode %d" % nummer, s, count=1)
          s, n2 = re.subn(r'versionName\s+"[^"]*"', 'versionName "%s"' % name, s, count=1)
          if n1 != 1 or n2 != 1:
              raise SystemExit("ABBRUCH: versionCode/versionName nicht gefunden (%d/%d)" % (n1, n2))
          if nummer <= 1:
              raise SystemExit("ABBRUCH: versionCode %d ist nicht hoeher als die veroeffentlichte Fassung" % nummer)
          open(p, "w").write(s)
          print("versionCode ist jetzt", nummer, "- versionName", name)
          SETZEN
          grep -E "versionCode|versionName|applicationId" apps/fahrlehrer/android/app/build.gradle

      - name: Paket bauen und signieren
        script: |
          cd apps/fahrlehrer/android
          echo $CM_KEYSTORE | base64 --decode > /tmp/fahrlehrer.keystore
          ./gradlew bundleRelease \
            -Pandroid.injected.signing.store.file=/tmp/fahrlehrer.keystore \
            -Pandroid.injected.signing.store.password="$CM_KEYSTORE_PASSWORD" \
            -Pandroid.injected.signing.key.alias="$CM_KEY_ALIAS" \
            -Pandroid.injected.signing.key.password="$CM_KEY_PASSWORD"
          rm -f /tmp/fahrlehrer.keystore

      - name: Nachsehen, was im Paket steckt
        script: |
          set -e
          python3 - <<'PRUEF'
          import zipfile, glob
          p = glob.glob("apps/fahrlehrer/android/app/build/outputs/bundle/release/*.aab")[0]
          z = zipfile.ZipFile(p)

          # 1. Steckt die neue Oberflaeche wirklich drin?
          h = z.read("base/assets/public/index.html").decode("utf-8", "ignore")
          fehlt = [w for w in ("terminMenue", "kontaktKarteHTML", "wknopf") if w not in h]
          print("Oberflaeche im Paket:", len(h), "Zeichen")
          if fehlt:
              raise SystemExit("ABBRUCH - fehlt im Paket: " + ", ".join(fehlt))

          # 2. Ist die Versionsnummer wirklich hoeher als die veroeffentlichte (1)?
          m = z.read("base/manifest/AndroidManifest.xml")
          i = m.find(b"versionCode")
          if i < 0 or m[i + 11] != 0x1a:
              raise SystemExit("ABBRUCH - versionCode nicht lesbar")
          laenge = m[i + 12]
          nummer = int(m[i + 13:i + 13 + laenge].decode())
          print("versionCode im fertigen Paket:", nummer)
          if nummer <= 1:
              raise SystemExit("ABBRUCH - versionCode %d, Google wuerde das Paket ablehnen" % nummer)

          # 3. Ist das Fuchs-Symbol drin und nicht das Standard-Symbol?
          symbole = [n for n in z.namelist() if n.endswith("mipmap-xxxhdpi-v4/ic_launcher.png")]
          if not symbole:
              raise SystemExit("ABBRUCH - kein App-Symbol im Paket")
          groesse = z.getinfo(symbole[0]).file_size
          print("App-Symbol:", groesse, "Bytes")
          if groesse < 4000:
              raise SystemExit("ABBRUCH - App-Symbol zu klein, vermutlich das Standard-Symbol")

          # 4. Ist es signiert?
          sig = [n for n in z.namelist() if n.startswith("META-INF/") and n[-4:] in (".RSA", ".DSA", ".EC")]
          if not sig:
              raise SystemExit("ABBRUCH - das Paket ist nicht signiert")
          print("Signiert mit:", sig[0])

          print("Alles in Ordnung.")
          PRUEF

  # ====================================================================
  # FAHRLEHRER-APP  ->  iOS (App Store / TestFlight)
  # --------------------------------------------------------------------
  # Gegenstueck zu "fahrlehrer-android". Aufgebaut wie "schueler-ios",
  # mit drei Unterschieden:
  #
  #   1. Der Ordner apps/fahrlehrer/ios liegt NICHT im Repository. Er wird
  #      bei jedem Lauf frisch aus capacitor.config.json erzeugt - genau
  #      wie beim Android-Bau. Dadurch stimmt die Bundle-ID immer und es
  #      gibt nichts, was veralten kann.
  #   2. Die Bundle-ID wird bei Apple angelegt, falls es sie noch nicht
  #      gibt. Beim Schueler-Bau existierte sie schon.
  #   3. Das App-Symbol kommt aus quellen/fl-icon-512.png.
  #
  # Voraussetzung, die NICHT automatisierbar ist: In App Store Connect
  # muss ein App-Eintrag fuer de.fahrsyn.fuchs.fahrlehrer bestehen. Apple
  # laest das nur von Hand anlegen. Ohne ihn schlaegt erst der letzte
  # Schritt fehl (Hochladen), der Bau selbst laeuft durch.
  # ====================================================================
  fahrlehrer-ios:
    name: Fahrlehrer iOS
    instance_type: mac_mini_m2
    max_build_duration: 45

    integrations:
      app_store_connect: FuchsApiKey

    environment:
      vars:
        BUNDLE_ID: "de.fahrsyn.fuchs.fahrlehrer"
        APP_DIR: "apps/fahrlehrer"
        IOS_DIR: "apps/fahrlehrer/ios/App"
        XCODE_PROJECT: "apps/fahrlehrer/ios/App/App.xcodeproj"
        XCODE_SCHEME: "App"
        INFO_PLIST: "apps/fahrlehrer/ios/App/App/Info.plist"
        VERSION_NAME: "1.0"
      node: 22
      xcode: latest

    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log

    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true

    scripts:
      - name: Web-Bundle bauen und pruefen
        script: |
          node scripts/build-www.mjs fahrlehrer
          node scripts/pruefe.mjs fahrlehrer

      - name: iOS-Projekt erzeugen
        script: |
          set -e
          cd "$APP_DIR"
          npm install --no-audit --no-fund
          [ -d ios ] || npx cap add ios
          npx cap sync ios

      - name: App-Symbol und Startbild erzeugen
        script: |
          set -e
          cd "$APP_DIR"
          mkdir -p assets
          cp ../../quellen/fl-icon-512.png assets/icon.png
          npx capacitor-assets generate --ios --assetPath assets \
            --iconBackgroundColor '#FBF8F5' --iconBackgroundColorDark '#FBF8F5' \
            --splashBackgroundColor '#FBF8F5' --splashBackgroundColorDark '#FBF8F5'
          test -s ios/App/App/Assets.xcassets/AppIcon.appiconset/AppIcon-512@2x.png \
            || { echo "ABBRUCH: App-Symbol wurde nicht erzeugt"; exit 1; }
          echo "Symbol erzeugt aus quellen/fl-icon-512.png"

      - name: Info.plist ergaenzen
        script: |
          # Verschluesselungs-Erklaerung: erspart die Rueckfrage bei jedem Upload.
          /usr/libexec/PlistBuddy -c "Add :ITSAppUsesNonExemptEncryption bool false" "$INFO_PLIST" || true
          # Zweckangaben. Apple verlangt sie, SOBALD eine App die Kamera- oder
          # Foto-Schnittstellen auch nur referenziert - und @capacitor/camera tut
          # das, ob die App sie benutzt oder nicht. Fehlen sie, weist Apple den
          # fertigen Build nach dem Hochladen ab (ITMS-90683, am 27.08. passiert).
          # Wortlaut wie in der Schueler-App, die damit durch die Pruefung ist.
          /usr/libexec/PlistBuddy -c 'Add :NSCameraUsageDescription string "Die App verwendet die Kamera, damit du Nachweise und Unterlagen zur Fahrausbildung fotografieren kannst."' "$INFO_PLIST" || true
          /usr/libexec/PlistBuddy -c 'Add :NSPhotoLibraryUsageDescription string "Die App greift auf deine Fotos zu, damit du Unterlagen zur Fahrausbildung auswaehlen und hochladen kannst."' "$INFO_PLIST" || true
          /usr/libexec/PlistBuddy -c 'Add :NSPhotoLibraryAddUsageDescription string "Die App kann Bilder in deiner Fotomediathek speichern."' "$INFO_PLIST" || true
          echo "--- Zweckangaben im Info.plist ---"
          for K in NSCameraUsageDescription NSPhotoLibraryUsageDescription NSPhotoLibraryAddUsageDescription; do
            /usr/libexec/PlistBuddy -c "Print :$K" "$INFO_PLIST" \
              || { echo "ABBRUCH: $K fehlt - Apple wuerde den Build nach dem Hochladen abweisen"; exit 1; }
          done

      - name: Geteiltes Schema sicherstellen
        script: |
          set -e
          python3 - <<'SCHEMA'
          import os, re
          proj = os.environ["XCODE_PROJECT"]
          d = os.path.join(proj, "xcshareddata", "xcschemes")
          ziel = os.path.join(d, "App.xcscheme")
          if os.path.exists(ziel):
              print("Schema war schon da")
              raise SystemExit(0)
          # Die Kennung des Bau-Ziels aus dem Projekt lesen statt sie fest
          # einzutragen - eine neue Capacitor-Fassung koennte sie aendern.
          s = open(os.path.join(proj, "project.pbxproj")).read()
          m = re.search(r"([0-9A-F]{24}) /\* App \*/ = \{\s*isa = PBXNativeTarget", s)
          if not m:
              raise SystemExit("ABBRUCH: Bau-Ziel 'App' nicht im Projekt gefunden")
          ref = ('BuildableIdentifier="primary" BlueprintIdentifier="%s" '
                 'BuildableName="App.app" BlueprintName="App" '
                 'ReferencedContainer="container:App.xcodeproj"' % m.group(1))
          os.makedirs(d, exist_ok=True)
          open(ziel, "w").write(
              '<?xml version="1.0" encoding="UTF-8"?>\n'
              '<Scheme LastUpgradeVersion="1430" version="1.3">\n'
              '<BuildAction parallelizeBuildables="YES" buildImplicitDependencies="YES"><BuildActionEntries>\n'
              '<BuildActionEntry buildForTesting="YES" buildForRunning="YES" buildForProfiling="YES" '
              'buildForArchiving="YES" buildForAnalyzing="YES"><BuildableReference ' + ref + '></BuildableReference></BuildActionEntry>\n'
              '</BuildActionEntries></BuildAction>\n'
              '<TestAction buildConfiguration="Debug"></TestAction>\n'
              '<LaunchAction buildConfiguration="Debug"><BuildableProductRunnable runnableDebuggingMode="0">'
              '<BuildableReference ' + ref + '></BuildableReference></BuildableProductRunnable></LaunchAction>\n'
              '<ProfileAction buildConfiguration="Release"><BuildableProductRunnable runnableDebuggingMode="0">'
              '<BuildableReference ' + ref + '></BuildableReference></BuildableProductRunnable></ProfileAction>\n'
              '<AnalyzeAction buildConfiguration="Debug"></AnalyzeAction>\n'
              '<ArchiveAction buildConfiguration="Release" revealArchiveInOrganizer="YES"></ArchiveAction>\n'
              '</Scheme>\n')
          print("Schema erzeugt, Bau-Ziel", m.group(1))
          SCHEMA

      - name: Push-Berechtigung und AppDelegate vorbereiten
        script: |
          set -e
          ENT="$IOS_DIR/App/App.entitlements"
          printf '%s\n' '<?xml version="1.0" encoding="UTF-8"?>' \
            '<!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">' \
            '<plist version="1.0"><dict><key>aps-environment</key><string>production</string></dict></plist>' > "$ENT"
          python3 - <<'DELEGATE'
          import os
          p = os.path.join(os.environ['IOS_DIR'], 'App', 'AppDelegate.swift')
          s = open(p).read()
          if 'didRegisterForRemoteNotifications' in s:
              print('AppDelegate schon fertig')
          else:
              b = '''
              func application(_ application: UIApplication, didRegisterForRemoteNotificationsWithDeviceToken deviceToken: Data) {
                  NotificationCenter.default.post(name: .capacitorDidRegisterForRemoteNotifications, object: deviceToken)
              }
              func application(_ application: UIApplication, didFailToRegisterForRemoteNotificationsWithError error: Error) {
                  NotificationCenter.default.post(name: .capacitorDidFailToRegisterForRemoteNotifications, object: error)
              }
          '''
              i = s.rstrip().rfind('}')
              open(p, 'w').write(s[:i] + b + chr(10) + '}' + chr(10))
              print('AppDelegate ergaenzt')
          DELEGATE
          python3 - <<'PROJEKT'
          import os
          p = os.path.join(os.environ['IOS_DIR'], 'App.xcodeproj', 'project.pbxproj')
          s = open(p).read()
          if 'CODE_SIGN_ENTITLEMENTS' in s:
              print('Projekteintrag schon vorhanden')
          else:
              a = 'PRODUCT_BUNDLE_IDENTIFIER = %s;' % os.environ['BUNDLE_ID']
              if a not in s:
                  raise SystemExit('ABBRUCH: Bundle-ID nicht im Projekt gefunden: ' + a)
              b = a + chr(10) + chr(9)*4 + 'CODE_SIGN_ENTITLEMENTS = App/App.entitlements;'
              print('Projekteintrag in', s.count(a), 'Konfigurationen ergaenzt')
              open(p, 'w').write(s.replace(a, b))
          PROJEKT

      - name: Versionsnummer setzen
        script: |
          cd "$IOS_DIR"
          agvtool new-marketing-version "$VERSION_NAME" || true
          agvtool new-version -all "$BUILD_NUMBER" || true

      - name: Bundle-ID bei Apple sicherstellen
        script: |
          set -e
          J="import sys,json; d=json.load(sys.stdin); d=d.get('data',d) if isinstance(d,dict) else d; print(chr(10).join(x['id'] for x in d))"
          RES=$(app-store-connect bundle-ids list --bundle-id-identifier "$BUNDLE_ID" \
            --strict-match-identifier --json | python3 -c "$J" | head -1)
          if [ -z "$RES" ]; then
            echo "Bundle-ID gibt es bei Apple noch nicht - wird angelegt."
            app-store-connect bundle-ids create "$BUNDLE_ID" --name "FUCHS Fahrlehrer" --platform IOS
            RES=$(app-store-connect bundle-ids list --bundle-id-identifier "$BUNDLE_ID" \
              --strict-match-identifier --json | python3 -c "$J" | head -1)
            [ -n "$RES" ] || { echo "ABBRUCH: Bundle-ID liess sich nicht anlegen"; exit 1; }
          fi
          echo "Bundle-ID bei Apple: $RES"
          app-store-connect bundle-ids enable-capabilities "$RES" \
            --capability "Push Notifications" || echo "Push war schon aktiv"
          echo "$RES" > /tmp/bundle_id_ref

      - name: Altes Profil und Zertifikat entfernen
        script: |
          J="import sys,json; d=json.load(sys.stdin); d=d.get('data',d) if isinstance(d,dict) else d; print(chr(10).join(x['id'] for x in d))"
          RES=$(cat /tmp/bundle_id_ref)
          for P in $(app-store-connect bundle-ids profiles --bundle-ids "$RES" \
              --type IOS_APP_STORE --json | python3 -c "$J"); do
            echo "Profil weg: $P"; app-store-connect profiles delete "$P" --ignore-not-found || true
          done
          for C in $(app-store-connect certificates list --type DISTRIBUTION IOS_DISTRIBUTION \
              --json | python3 -c "$J"); do
            echo "Zertifikat weg: $C"; app-store-connect certificates delete "$C" --ignore-not-found || true
          done
          sleep 20

      - name: Zertifikat und Profil neu erzeugen
        script: |
          openssl genrsa -out /tmp/k.pem 2048
          app-store-connect fetch-signing-files "$BUNDLE_ID" --type IOS_APP_STORE \
            --certificate-key @file:/tmp/k.pem --create
          keychain initialize
          keychain add-certificates --certificate-password ""
          xcode-project use-profiles --project "$XCODE_PROJECT"

      - name: iPhone-App bauen
        script: |
          xcode-project build-ipa --project "$XCODE_PROJECT" --scheme "$XCODE_SCHEME" \
            --archive-xcargs "COMPILER_INDEX_STORE_ENABLE=NO" \
          || {
            echo "=================== FEHLERGRUND ==================="
            grep -h -A4 -E "error:|error :" /tmp/xcodebuild_logs/*.log | tail -n 60
            echo "=================== LETZTE ZEILEN ================="
            tail -n 40 /tmp/xcodebuild_logs/*.log
            exit 1
          }

      - name: Nachsehen, was in der App steckt
        script: |
          set -e
          python3 - <<'PRUEF'
          import glob, zipfile
          p = glob.glob("build/ios/ipa/*.ipa")
          if not p:
              raise SystemExit("ABBRUCH - keine .ipa gebaut")
          z = zipfile.ZipFile(p[0])
          treffer = [n for n in z.namelist() if n.endswith("public/index.html")]
          if not treffer:
              raise SystemExit("ABBRUCH - keine Oberflaeche in der App")
          h = z.read(treffer[0]).decode("utf-8", "ignore")
          fehlt = [w for w in ("terminMenue", "kontaktKarteHTML", "wknopf") if w not in h]
          print("Oberflaeche in der App:", len(h), "Zeichen")
          if fehlt:
              raise SystemExit("ABBRUCH - fehlt in der App: " + ", ".join(fehlt))
          print("Alles in Ordnung.")
          PRUEF
