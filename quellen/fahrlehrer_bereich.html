<!DOCTYPE html><html lang="de"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Fahrlehrer Fuchs App</title>
<link rel="manifest" href="/app/fahrlehrer.webmanifest">
<link rel="icon" type="image/png" href="/app/fl-icon-192.png">
<link rel="shortcut icon" type="image/png" href="/app/fl-icon-192.png">
<link rel="apple-touch-icon" href="/app/fl-apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Fahrlehrer Fuchs App">
<meta name="theme-color" content="#F67B32">
<style>
 :root{--orange:#F67B32; --orange-soft:#FEF0E6; --dark:#1A1A1A; --gray:#6A6A6A;
   --bg:#FBF8F5; --line:#EDE6DF; --green:#2E9E5B;}
 *{box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color:transparent;}
 html,body{height:100%;}
 body{font-family:'Avenir Next','Segoe UI',system-ui,sans-serif; background:var(--bg);
   display:flex; justify-content:center; color:var(--dark);}
 .phone{width:100%; max-width:520px; height:100dvh; background:var(--bg); display:flex; flex-direction:column;}
 .topbar{height:calc(6px + env(safe-area-inset-top)); background:var(--orange); flex-shrink:0;}
 header{display:flex; align-items:center; gap:10px; padding:10px 20px; background:#fff;
   border-bottom:1px solid var(--line); flex-shrink:0;}
 header img{height:34px; width:auto; display:block;}
 .kopfrechts{margin-left:auto; text-align:right; font-size:11.5px; color:var(--gray); line-height:1.35;}
 .kopfrechts .eb{font-size:10px; font-weight:700; letter-spacing:.1em; text-transform:uppercase; color:var(--orange);}
 .kopfrechts b{color:var(--dark); font-size:12.5px;}
 .kopfrechts a{color:var(--gray); text-decoration:underline;}
 .abmeldebtn{display:inline-block; margin-top:4px; background:#fff; border:1.5px solid var(--line); border-radius:999px;
   padding:4px 12px; font-size:12px; font-weight:700; color:var(--dark); text-decoration:none; cursor:pointer;}
 .abmeldebtn:active{background:var(--bg);}
 main{flex:1; overflow-y:auto; padding:20px; display:flex; flex-direction:column; gap:14px; -webkit-overflow-scrolling:touch;}
 main>*{flex-shrink:0;}
 .eyebrow{font-size:11px; font-weight:700; letter-spacing:.12em; text-transform:uppercase; color:var(--orange);}
 h1{font-size:24px; font-weight:800; color:var(--dark);}
 h2sec{}
 .secttitel{font-size:18px; font-weight:800; color:var(--dark); margin-top:2px;}
 .hint{background:var(--orange-soft); border-radius:12px; padding:10px 14px; font-size:12.5px; color:var(--dark); line-height:1.45;}
 .meta{font-size:13px; color:var(--gray);}
 .card{background:#fff; border:1px solid var(--line); border-radius:16px; padding:16px;}
 .card.klick{cursor:pointer;}
 .card.zeile{display:flex; align-items:center; gap:12px;}
 .nr{width:44px; height:44px; border-radius:12px; flex-shrink:0; background:var(--line);
   display:flex; align-items:center; justify-content:center; font-size:20px;}
 .nr.done{background:var(--orange);}
 .card .info{flex:1; min-width:0;}
 .card .titel{font-size:15px; font-weight:700; color:var(--dark);}
 .card .sub{font-size:12px; color:var(--gray); margin-top:2px;}
 .card .play{font-size:22px; color:var(--orange); font-weight:800;}
 .zeit{font-weight:800; font-size:14px; min-width:96px; color:var(--dark);}
 .klbadge{font-size:11px; font-weight:800; color:var(--orange); background:var(--orange-soft); border-radius:8px; padding:3px 9px; flex-shrink:0;}
 .flname{font-size:12px; color:var(--orange); font-weight:600; margin-top:2px;}
 .kaltag{font-size:11px; font-weight:800; letter-spacing:.06em; color:var(--orange); text-transform:uppercase; margin-top:6px;}
 .app-select,.app-input{width:100%; border:1.5px solid var(--line); border-radius:12px; padding:13px 15px;
   font-size:15px; outline:none; font-family:inherit; background:#fff; color:var(--dark);}
 .app-input{text-align:center;}
 .btn-primary{background:var(--orange); color:#fff; border:none; border-radius:12px; padding:14px 20px;
   font-size:15px; font-weight:700; cursor:pointer; font-family:inherit; width:100%;}
 .btn-ghost{background:transparent; color:var(--gray); border:1.5px solid var(--line); border-radius:12px;
   padding:9px 15px; font-size:13px; font-weight:700; cursor:pointer; align-self:flex-start; font-family:inherit;}
 /* Login */
 .login{margin:5vh auto 0; max-width:330px; width:100%; display:flex; flex-direction:column; align-items:center; gap:13px; text-align:center;}
 .login img{height:82px;}
 .login h1{font-size:21px;}
 .fehler{color:#D64545; font-size:13px; min-height:16px;}
 /* Kompetenzkarte */
 .sekt{margin-top:8px;}
 .sekthead{width:100%; display:flex; align-items:center; justify-content:space-between; gap:10px;
   color:#fff; padding:12px 14px; border:none; border-radius:12px; margin:8px 0 8px; font-weight:800;
   font-size:14px; font-family:inherit; cursor:pointer; text-align:left;}
 .sekthead:active{filter:brightness(.95);}
 .sekttitel-t{flex:1;}
 .sekthead-r{display:flex; align-items:center; gap:9px; flex-shrink:0;}
 .sektzahl{font-size:11.5px; font-weight:800; background:rgba(255,255,255,.28); border-radius:999px; padding:2px 9px;}
 .chev{font-size:12px; opacity:.9;}
 .item{background:#fff; border:1px solid var(--line); border-radius:14px; padding:12px 14px; margin-bottom:8px;}
 .lab{font-weight:700; font-size:14px;}
 .det{color:var(--gray); font-size:12px; margin-top:1px;}
 .stufen{display:flex; gap:7px; margin-top:9px; flex-wrap:wrap;}
 .stufen button{border:1.5px solid var(--line); background:#fff; border-radius:999px; padding:9px 14px;
   font-size:12.5px; font-weight:700; cursor:pointer; color:var(--gray); font-family:inherit;}
 .stufen button.an{color:#fff; border-color:transparent;}
 .kompf{background:var(--orange-soft); border:1px solid #F6C9A6; border-radius:12px; padding:10px 13px;
   font-size:12.5px; color:#8A5A2B; line-height:1.4;}
 .leer{background:#fff; border:1px dashed var(--line); border-radius:14px; padding:26px 18px; text-align:center; color:var(--gray); font-size:13.5px; line-height:1.5;}
 .status{position:fixed; bottom:22px; left:50%; transform:translateX(-50%); background:var(--dark); color:#fff;
   padding:10px 18px; border-radius:999px; font-size:13px; opacity:0; transition:opacity .3s; pointer-events:none; z-index:50;}
</style></head>
<body>
<div class="phone">
  <div class="topbar"></div>
  <header>
    <img src="/app/fuchs-logo-komplett.png" alt="FUCHS – Deine Fahrschule">
    <div class="kopfrechts" id="kopfrechts"></div>
  </header>
  <main id="main"></main>
</div>
<div class="status" id="status"></div>
<script>
let FL=null, PIN=null, FLNAME="", katalog=null, kataloge={}, stand={}, aktNummer="", aktKlasse="B", schuelerListe=[], eigeneListe=false, IS_MASTER=false, aktFahrstunden=null, offeneSekt=new Set(), aktZuletzt=null;
const main=()=>document.getElementById("main");

function toast(t){const s=document.getElementById("status");s.textContent=t;s.style.opacity=1;clearTimeout(s._t);s._t=setTimeout(()=>s.style.opacity=0,1500);}
function esc(s){const d=document.createElement("div");d.textContent=s==null?"":s;return d.innerHTML;}
function normNr(n){let z=(n||"").replace(/\D/g,"");if(z.startsWith("00"))z=z.slice(2);else if(z.startsWith("0"))z="49"+z.slice(1);return z;}
// API immer absolut unter /app/ ansprechen – damit die App unter /fl (eigener
// PWA-Pfad) genauso läuft wie unter /app/fl.
const API="/app/";
async function jget(u){try{const r=await fetch(API+u);return r.ok?r.json():null;}catch(e){return null;}}
async function jpost(u,b){try{const r=await fetch(API+u,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(b)});return r.ok?r.json():null;}catch(e){return null;}}
function setKopf(){
  const k=document.getElementById("kopfrechts");
  if(!FL){k.innerHTML="";return;}
  k.innerHTML=`<div class="eb">${IS_MASTER?"Masterzugang":"Fahrlehrer"}</div><b>${esc(FLNAME)}</b><br><a href="#" class="abmeldebtn" onclick="abmelden();return false">Abmelden</a>`;
}

// ---------------- Login ----------------
async function init(){
  setKopf();
  let opts="";
  try{const d=await jget("ausbildung/fahrlehrer");opts=((d&&d.fahrlehrer)||[]).map(f=>`<option value="${esc(f.fl)}">${esc(f.name)}</option>`).join("");}catch(e){}
  main().innerHTML=`
   <div class="login">
     <img src="/app/fuchs-icon.png" alt="Fuchs">
     <div class="eyebrow">Fahrlehrer-Bereich</div>
     <h1>Anmelden</h1>
     <div class="meta" style="line-height:1.5">Wähle deinen Namen und gib deine PIN ein.<br>Die PIN steht auf deiner internen Login-Liste.</div>
     <select id="flSel" class="app-select"><option value="">— Fahrlehrer wählen —</option>${opts}</select>
     <input id="flPin" class="app-input" inputmode="numeric" maxlength="6" placeholder="PIN" style="letter-spacing:.2em">
     <button class="btn-primary" id="flBtn">Anmelden</button>
     <div class="fehler" id="flErr"></div>
   </div>`;
  document.getElementById("flBtn").onclick=login;
  document.getElementById("flPin").onkeydown=e=>{if(e.key==="Enter")login();};
}
async function login(){
  const fl=document.getElementById("flSel").value, pin=document.getElementById("flPin").value.trim();
  const err=document.getElementById("flErr");
  if(!fl){err.textContent="Bitte Fahrlehrer wählen.";return;}
  if(!pin){err.textContent="Bitte PIN eingeben.";return;}
  err.textContent="";
  const d=await jpost("ausbildung/fahrlehrer-login",{fl,pin});
  if(!d||!d.ok){err.textContent="Name oder PIN stimmt nicht.";return;}
  FL=fl;PIN=pin;FLNAME=d.name||"";IS_MASTER=!!d.master;schuelerListe=[];aktNummer="";katalog=null;stand={};
  setKopf();
  await ladeSchuelerListe();
  viewSchueler();
  // Puffer im Browser-Verlauf: Zurück bleibt im Hauptmenü, statt die Seite zu verlassen.
  try{history.pushState({fahrlehrer:1,view:"haupt"},"");}catch(e){}
}
function abmelden(){FL=null;PIN=null;FLNAME="";IS_MASTER=false;katalog=null;stand={};aktNummer="";init();}
// In einen Unterbereich wechseln (mit Verlaufs-Eintrag, damit Zurück ins Hauptmenü führt).
function navSub(view){
  try{history.pushState({fahrlehrer:1,view},"");}catch(e){}
  if(view==="kalender")viewKalender();
  else if(view==="konto")viewKonto();
  else if(view==="buchen")viewBuchen();
}
// Handy-/Browser-Zurück: solange angemeldet, immer zurück ins Hauptmenü (kein Rausfliegen).
window.addEventListener("popstate",function(){
  if(!FL)return;                       // nicht angemeldet -> normal (verlässt die Seite)
  try{history.pushState({fahrlehrer:1,view:"haupt"},"");}catch(e){}
  viewSchueler();
});

// ---------------- Schüler & Ausbildungsstand ----------------
async function ladeSchuelerListe(){
  const d=await jpost("ausbildung/schueler",{fl:FL,pin:PIN});
  schuelerListe=(d&&d.schueler)||[];
  eigeneListe=!!(d&&d.eigene);
}
function matchSchueler(s,q){
  q=(q||"").trim().toLowerCase();if(!q)return true;
  if((s.name||"").toLowerCase().includes(q))return true;
  const geb=(s.geb||"");
  if(geb.toLowerCase().includes(q))return true;
  const qd=q.replace(/\D/g,""),gd=geb.replace(/\D/g,"");
  if(qd&&gd&&gd.includes(qd))return true;
  return false;
}
function schuelerOptions(q){
  const liste=schuelerListe.filter(s=>matchSchueler(s,q));
  const kopf=`<option value="">${liste.length?("— Schüler wählen ("+liste.length+") —"):"— kein Treffer —"}</option>`;
  return kopf+liste.map(s=>`<option value="${esc(s.nummer)}">${esc(s.name)}${s.geb?" · "+esc(s.geb):" ("+esc((s.nummer||"").slice(-4))+")"}</option>`).join("");
}
function viewSchueler(){
  const hint=IS_MASTER
    ? "Leitungs-Zugang: Zugriff auf alle Schüler. Schüler wählen oder Handynummer eingeben – Stufe antippen speichert sofort."
    : (eigeneListe
      ? "Deine Schüler aus den Fahrstunden der letzten 12 Monate. Wähle einen – die passende Karte (Pkw/Motorrad) lädt automatisch."
      : "Wähle einen Schüler oder gib eine Handynummer ein. Stufe antippen = sofort gespeichert, der Schüler sieht es direkt in seiner App.");
  main().innerHTML=`
    <div><div class="eyebrow">Fahrlehrer-Bereich</div><h1>Hallo, ${esc(FLNAME.split(" ")[0]||FLNAME)}</h1></div>
    <div class="card klick zeile" onclick="navSub('kalender')">
      <div class="nr done">📅</div>
      <div class="info"><div class="titel">Terminplaner</div><div class="sub">${IS_MASTER?"Fahrstunden aller Fahrlehrer":"Deine kommenden Fahrstunden"}</div></div>
      <div class="play">›</div>
    </div>
    <div class="card klick zeile" onclick="navSub('konto')">
      <div class="nr" style="background:#E9F6EE">💶</div>
      <div class="info"><div class="titel">Schülerkonto</div><div class="sub">Guthaben oder offenen Betrag ansehen</div></div>
      <div class="play">›</div>
    </div>
    ${IS_MASTER?"":`<div class="card klick zeile" onclick="navSub('buchen')">
      <div class="nr" style="background:#FBEAD9">✍️</div>
      <div class="info"><div class="titel">Fahrstunde eintragen</div><div class="sub">mit Unterschrift des Schülers</div></div>
      <div class="play">›</div>
    </div>`}
    <div><div class="eyebrow">Ausbildung</div><div class="secttitel">Schüler &amp; Ausbildungsstand</div></div>
    <div class="hint">${hint}</div>
    <input id="suche" class="app-input" style="text-align:left" placeholder="🔍 Suche: Vorname, Nachname oder Geburtstag">
    <select id="schueler" class="app-select">${schuelerOptions("")}</select>
    <div id="karte"></div>`;
  const sel=document.getElementById("schueler");
  if(aktNummer)sel.value=aktNummer;
  document.getElementById("suche").oninput=e=>{sel.innerHTML=schuelerOptions(e.target.value);if(aktNummer)sel.value=aktNummer;};
  sel.onchange=e=>{if(e.target.value){ladeStand(e.target.value);}};
  if(aktNummer&&katalog)zeichne();
}
async function ladeKatalog(kl){if(!kataloge[kl]){const d=await jget("ausbildung/katalog?klasse="+kl);if(!d)return null;kataloge[kl]=d.katalog;}return kataloge[kl];}
async function ladeStand(nummer){
  aktNummer=nummer;aktFahrstunden=null;
  const k=document.getElementById("karte");if(k)k.innerHTML='<div class="meta">Lädt …</div>';
  const [d0,fs]=await Promise.all([
    jpost("ausbildung/stand",{fl:FL,pin:PIN,nummer}),
    jpost("fahrlehrer/fahrstunden",{fl:FL,pin:PIN,nummer})
  ]);
  const d=d0||{};
  aktFahrstunden=(fs&&fs.fahrstunden)||null;
  aktKlasse=d.klasse||"B";stand=d.stand||{};
  aktZuletzt=(d.zuletzt_von)?{von:d.zuletzt_von,text:d.zuletzt_text||""}:null;
  offeneSekt=new Set();   // neue Schülerkarte startet zugeklappt
  katalog=await ladeKatalog(aktKlasse);
  if(!katalog){if(k)k.innerHTML=fahrstundenHtml()+'<div class="card">Für diesen Schüler gilt Klasse <b>'+esc(aktKlasse)+'</b> – dafür ist noch keine Ausbildungskarte hinterlegt.</div>';return;}
  zeichne();
}
function toggleSekt(i){if(offeneSekt.has(i))offeneSekt.delete(i);else offeneSekt.add(i);zeichne();}
function alleSekt(auf){offeneSekt=new Set();if(auf&&katalog){katalog.sektionen.forEach((s,i)=>offeneSekt.add(i));}zeichne();}
function fahrstundenHtml(){
  const f=aktFahrstunden;
  if(!f||!f.gefunden)return"";
  const arten=(f.nach_art||[]).map(a=>`${esc(a.art)} <b>${a.anzahl}</b>`).join(" · ");
  const letzte=(f.letzte&&f.letzte.length)?f.letzte[f.letzte.length-1]:"";
  const fehl=f.fehlstunden?`<span style="color:#D64545"> · ${f.fehlstunden} Fehlstunde${f.fehlstunden>1?"n":""}</span>`:"";
  return `<div class="card" style="margin-bottom:12px">
    <div class="zeile">
      <div class="nr done">🚗</div>
      <div class="info"><div class="titel">Gefahrene Fahrstunden</div><div class="sub">insgesamt <b>${f.gesamt}</b> Stunde${f.gesamt===1?"":"n"}${fehl}</div></div>
    </div>
    ${arten?`<div style="margin-top:11px;font-size:13px;line-height:1.7">${arten}</div>`:""}
    ${letzte?`<div class="meta" style="margin-top:6px;font-size:12px">zuletzt: ${esc(letzte)}</div>`:""}
  </div>`;
}
async function setWert(key,wert){
  stand[key]=wert>0?wert:undefined;if(wert<=0)delete stand[key];zeichne();
  const r=await jpost("ausbildung/set",{fl:FL,pin:PIN,nummer:aktNummer,klasse:aktKlasse,key,wert});
  toast(r&&r.ok?"gespeichert ✓":"Fehler beim Speichern");
  // Erste Bewertung zu einer Fahrstunde -> Stunde als "Karte gepflegt" markieren (grüner Haken)
  if(r&&r.ok&&AKT_KARTE_STUNDE&&!KARTE_MARKIERT){
    KARTE_MARKIERT=true;
    jpost("fahrlehrer/karte-gepflegt",{fl:FL,pin:PIN,stunde_id:AKT_KARTE_STUNDE});
  }
}
function zeichne(){
  const el=document.getElementById("karte");if(!el)return;
  if(!katalog||!aktNummer){el.innerHTML="";return;}
  const stufen=katalog.stufen;
  let h=fahrstundenHtml();
  h+=`<div class="secttitel" style="font-size:16px;margin-top:8px">${esc(katalog.titel||('Klasse '+aktKlasse))}</div>`;
  if(aktZuletzt)h+=`<div class="meta" style="margin:2px 0 6px">zuletzt bewertet von ${esc(aktZuletzt.von)}${aktZuletzt.text?(" · "+esc(aktZuletzt.text)):""}</div>`;
  if(katalog.hinweis_fahrlehrer)h+=`<div class="kompf" style="margin-bottom:8px">⚠️ ${esc(katalog.hinweis_fahrlehrer)}</div>`;
  const anzAuf=offeneSekt.size, anzGes=katalog.sektionen.length;
  h+=`<div style="display:flex;justify-content:flex-end;margin-bottom:2px"><button class="btn-ghost" style="padding:6px 12px;font-size:12px" onclick="alleSekt(${anzAuf<anzGes?'true':'false'})">${anzAuf<anzGes?"Alle aufklappen":"Alle zuklappen"}</button></div>`;
  katalog.sektionen.forEach((s,i)=>{
    const total=s.items.length;
    const bewertet=s.items.filter(it=>(stand[it.key]||0)>0).length;
    const offen=offeneSekt.has(i);
    const badge=`<span class="sektzahl">${bewertet}/${total}</span>`;
    h+=`<div class="sekt">
      <button class="sekthead" style="background:${s.farbe}" onclick="toggleSekt(${i})">
        <span class="sekttitel-t">${esc(s.titel)}</span>
        <span class="sekthead-r">${badge}<span class="chev">${offen?"▾":"▸"}</span></span>
      </button>`;
    if(offen){
      for(const it of s.items){
        const cur=stand[it.key]||0;
        h+=`<div class="item"><div class="lab">${esc(it.label)}</div>`+(it.detail?`<div class="det">${esc(it.detail)}</div>`:"")+`<div class="stufen">`;
        for(const st of stufen){const an=cur===st.wert;h+=`<button class="${an?'an':''}" style="${an?'background:'+st.farbe:''}" onclick="setWert('${it.key}',${st.wert})">${esc(st.name)}</button>`;}
        h+=`</div></div>`;
      }
    }
    h+=`</div>`;
  });
  el.innerHTML=h;
}

// ---------------- Schülerkonto (Guthaben / offener Betrag) ----------------
function viewKonto(){
  main().innerHTML=`
    <button class="btn-ghost" onclick="history.back()">← Zurück</button>
    <div><div class="eyebrow">Fahrlehrer-Bereich</div><h1>💶 Schülerkonto</h1></div>
    <div class="hint">Schüler suchen oder Handynummer eingeben – der Kontostand wird live aus dem Fahrschulmanager gelesen (nur zur Ansicht).</div>
    <input id="kontoSuche" class="app-input" style="text-align:left" placeholder="🔍 Suche: Vorname, Nachname oder Geburtstag">
    <select id="kontoSel" class="app-select">${schuelerOptions("")}</select>
    <div id="kontoKarte"></div>`;
  const sel=document.getElementById("kontoSel");
  document.getElementById("kontoSuche").oninput=e=>{sel.innerHTML=schuelerOptions(e.target.value);};
  sel.onchange=e=>{if(e.target.value){ladeKonto(e.target.value);}};
}
async function ladeKonto(nummer){
  const el=document.getElementById("kontoKarte");if(el)el.innerHTML='<div class="meta">Lädt …</div>';
  const d=await jpost("fahrlehrer/konto",{fl:FL,pin:PIN,nummer});
  if(!el)return;
  const k=d&&d.konto;
  if(!k||!k.gefunden){el.innerHTML='<div class="leer">'+(k&&k.mehrdeutig?"Zu dieser Nummer gibt es mehrere Karteien – bitte im Fahrschulmanager nachsehen.":"Kein Schülerkonto zu dieser Nummer gefunden.")+'</div>';return;}
  const farbe=k.status==="guthaben"?"var(--green)":(k.status==="offen"?"#D64545":"var(--gray)");
  const vorz=k.status==="offen"?"−":(k.status==="guthaben"?"+":"");
  el.innerHTML=`
    <div class="card">
      <div class="titel" style="font-size:16px">${esc(k.name)}</div>
      <div class="sub">Kartei ${esc(k.schuelernummer)}${k.klasse?" · Klasse "+esc(k.klasse):""}</div>
      <div style="text-align:center;margin:16px 0 8px">
        <div class="eyebrow" style="color:${farbe}">${esc(k.status_text)}</div>

function sigInit(c){
  sigCanvas=c; sigCtx=c.getContext("2d"); sigLeer=true;
  sigCtx.lineWidth=2.6; sigCtx.lineCap="round"; sigCtx.lineJoin="round"; sigCtx.strokeStyle="#1A1A1A";
  let malt=false;
  const pos=e=>{const r=c.getBoundingClientRect();const t=e.touches&&e.touches[0]?e.touches[0]:e;
    return {x:(t.clientX-r.left)*(c.width/r.width), y:(t.clientY-r.top)*(c.height/r.height)};};
  const start=e=>{e.preventDefault();malt=true;const p=pos(e);sigCtx.beginPath();sigCtx.moveTo(p.x,p.y);};
  const move=e=>{if(!malt)return;e.preventDefault();const p=pos(e);sigCtx.lineTo(p.x,p.y);sigCtx.stroke();sigLeer=false;};
  const end=()=>{malt=false;};
  c.addEventListener("mousedown",start);c.addEventListener("mousemove",move);window.addEventListener("mouseup",end);
  c.addEventListener("touchstart",start,{passive:false});c.addEventListener("touchmove",move,{passive:false});c.addEventListener("touchend",end);
}
function sigLoeschen(){if(sigCtx&&sigCanvas){sigCtx.clearRect(0,0,sigCanvas.width,sigCanvas.height);sigLeer=true;}}

function pruefErg(e){const p=(e.pruefung_ergebnis||"");return p==="bestanden"||p==="nicht_bestanden"?p:"";}
function zeichneFuchsTermine(t){
  const liste=document.getElementById("kalliste");if(!liste)return;
  FUCHS_TERMINE={};
  if(!t.length){liste.innerHTML='<div class="leer">Keine Termine im Zeitraum gefunden.<br>Sobald in FUCHS Fahrstunden eingetragen sind, erscheinen sie hier.</div>';return;}
  let h="",letzterTag="";
  // Oben ein roter Banner, falls gefahrene Prüfungen ohne Ergebnis offen sind (Zwang)
  const offen=t.filter(e=>e.art==="praktische_pruefung"&&(e.signiert||e.status==="durchgefuehrt")&&!pruefErg(e));
  if(offen.length){

      h+=`<button onclick="pruefungErgebnis(${e.id})" style="display:block;width:100%;text-align:left;background:#fff;border:1.5px solid #E9A6A6;border-radius:10px;padding:9px 12px;margin-top:6px;font-family:inherit;font-size:13.5px;font-weight:700;color:#B02B2B;cursor:pointer">${esc(e.schueler||"Schüler")} · ${esc(e.datum)} → Ergebnis eintragen</button>`;
    }
    h+=`</div>`;
  }
  for(const e of t){
    FUCHS_TERMINE[e.id]=e;
    if(e.datum!==letzterTag){h+=`<div class="kaltag">${esc(e.datum)}</div>`;letzterTag=e.datum;}
    const zeit=e.uhrzeit?(esc(e.uhrzeit)+(e.bis?("–"+esc(e.bis)):"")):"—";
    const fertig=e.signiert||e.status==="durchgefuehrt";
    const aus=e.status==="ausgefallen";
    const istPruef=e.art==="praktische_pruefung";
    const erg=pruefErg(e);
    let badge=`<div class="klbadge">${esc(e.klasse||"›")}</div>`;
    if(fertig)badge='<div class="klbadge" style="background:#E7F5EC;color:#1B7A43">✓ gefahren</div>';
    else if(aus)badge='<div class="klbadge" style="background:#FBECEC;color:#C23">ausgefallen</div>';
    let attr='class="card zeile"', sub=esc(e.art_text), moveBtn='';
    if(istPruef&&!fertig&&!aus)sub='🎓 '+esc(e.art_text);
    if(fertig&&istPruef){
      // Gefahrene Prüfung: Ergebnis hat Vorrang vor der Ausbildungskarte
      if(erg==="bestanden"){
        badge='<div class="klbadge" style="background:#DCF3E4;color:#1B7A43;font-weight:800">🏆 bestanden</div>';
        sub='🎓 '+esc(e.art_text)+' · <b style="color:#1B7A43">bestanden</b>';
        if(e.nummer)attr=`class="card zeile klick" onclick="karteVonStunde(${e.id})"`;
      }else if(erg==="nicht_bestanden"){
        badge='<div class="klbadge" style="background:#FBECEC;color:#C23;font-weight:800">✗ nicht bestanden</div>';
        sub='🎓 '+esc(e.art_text)+' · <b style="color:#C23">nicht bestanden</b>';
        if(e.nummer)attr=`class="card zeile klick" onclick="karteVonStunde(${e.id})"`;
      }else{
        // ZWANG: Ergebnis fehlt -> antippen führt zwingend zur Ergebnis-Eingabe
        badge='<div class="klbadge" style="background:#FDE1E1;color:#B02B2B;font-weight:800">⚠️ Ergebnis!</div>';
        attr=`class="card zeile klick" onclick="pruefungErgebnis(${e.id})"`;
        sub='🎓 '+esc(e.art_text)+' · <b style="color:#B02B2B">Prüfungsergebnis eintragen</b>';
      }

        badge='<div class="klbadge" style="background:#DCF3E4;color:#1B7A43;font-weight:800">✓ Karte gepflegt</div>';

  }
  liste.innerHTML=h;
}

  const s=FUCHS_TERMINE[id];if(!s)return;
  const err=document.getElementById("pFehler");if(err)err.textContent="";
  const bB=document.getElementById("pBest"),bN=document.getElementById("pNicht");
  if(bB)bB.disabled=true;if(bN)bN.disabled=true;
  const d=await jpost("fahrlehrer/pruefung-ergebnis",{fl:FL,pin:PIN,stunde_id:s.id,schueler_id:s.schueler_id,datum:s.datum_iso,ergebnis});
  if(d&&d.ok){
    s.pruefung_ergebnis=ergebnis;
    toast(ergebnis==="bestanden"?"🏆 Bestanden gespeichert":"Nicht bestanden gespeichert");
    viewKalender();
  }else{
    if(bB)bB.disabled=false;if(bN)bN.disabled=false;
    if(err)err.textContent=(d&&d.fehler)||"Speichern fehlgeschlagen.";
  }
}
function karteVonStunde(id){const s=FUCHS_TERMINE[id];if(s&&s.nummer)viewKarte(s.nummer,s.schueler,s.id);}
// Fokussierte Ausbildungskarte für genau einen Schüler
async function viewKarte(nummer,name,stundeId){
  aktNummer=nummer;katalog=null;AKT_KARTE_STUNDE=stundeId||null;KARTE_MARKIERT=false;
  main().innerHTML=`
    <button class="btn-ghost" onclick="viewKalender()">← Zurück</button>
    <div><div class="eyebrow">Ausbildungskarte</div><h1>📋 ${esc(name||"Schüler")}</h1></div>
    <div class="hint">Trage nach der Fahrstunde den aktuellen Ausbildungsstand ein – Stufe antippen speichert sofort, der Schüler sieht es direkt in seiner App.</div>
    <div id="karte"><div class="meta">Lädt …</div></div>`;
  await ladeStand(nummer);
  if(katalog)alleSekt(true);   // Abschnitte offen -> sofort bewertbar
}
// Fallback ohne Handynummer: Ausbildungsbereich mit vorbelegter Suche öffnen
function viewKarteSuche(name){
  viewSchueler();
  const s=document.getElementById("suche"),sel=document.getElementById("schueler");
  if(s&&sel&&name){s.value=name;sel.innerHTML=schuelerOptions(name);}
  toast("Bitte den Schüler in der Liste wählen.");
}
async function viewKalenderMaster(){
  // Fahrlehrer-Liste holen (Master selbst rausfiltern)
  let opts="";
  try{const d=await jget("ausbildung/fahrlehrer");
    opts=((d&&d.fahrlehrer)||[]).filter(f=>!f.master&&f.fl!==FL)
      .map(f=>`<option value="${esc(f.fl)}">${esc(f.name)}</option>`).join("");}catch(e){}
  main().innerHTML=`
    <button class="btn-ghost" onclick="history.back()">← Zurück</button>
    <div><div class="eyebrow">Masterzugang</div><h1>📅 Terminplaner</h1></div>
    <div class="hint">Wähle einen Fahrlehrer – du siehst dann nur dessen kommende Fahrstunden (live aus dem Fahrschulmanager, nur zur Ansicht).</div>
    <select id="flKalSel" class="app-select"><option value="">— Fahrlehrer wählen —</option>${opts}</select>
    <div id="kalliste"></div>`;
  document.getElementById("flKalSel").onchange=e=>ladeFLKalender(e.target.value);
}
async function ladeFLKalender(zielFl){
  const liste=document.getElementById("kalliste");if(!liste)return;
  if(!zielFl){liste.innerHTML="";return;}
  liste.innerHTML='<div class="meta">Lädt …</div>';
  const d=await jpost("fahrlehrer/kalender",{fl:FL,pin:PIN,ziel_fl:zielFl});
  zeichneTermine((d&&d.termine)||[]);
}
function zeichneTermine(t){
  const liste=document.getElementById("kalliste");if(!liste)return;
  if(!t.length){liste.innerHTML='<div class="leer">Keine kommenden Fahrstunden gefunden.<br>Sobald im Fahrschulmanager Termine eingetragen sind, erscheinen sie hier.</div>';return;}
  let h="",letzterTag="";
  for(const e of t){
    if(e.datum!==letzterTag){h+=`<div class="kaltag">${esc(e.datum)}</div>`;letzterTag=e.datum;}
    const zeit=e.uhrzeit?(esc(e.uhrzeit)+(e.bis?("–"+esc(e.bis)):"")):"—";
    const fl=e.fahrlehrer?`<div class="flname">${esc(e.fahrlehrer)}</div>`:"";
    h+=`<div class="card zeile"><div class="zeit">${zeit}</div><div class="info"><div class="titel">${esc(e.schueler)}</div><div class="sub">${esc(e.art_text)}</div>${fl}</div>${e.klasse?`<div class="klbadge">${esc(e.klasse)}</div>`:""}</div>`;
  }
  liste.innerHTML=h;
}

init();
</script><script>
/* Fahrlehrer-App: Web-Push (Benachrichtigungen). Nutzt die Kürzel+PIN-Anmeldung (Globale FL/PIN). */
(function () {
  var VAPID = "BJYc8H02c4QqwL883jsXq-LMmnP6zr30rNoepYqtxEMBTmHK2pa6kBdxoq5iowdETozJHXmim487uj7o4m8_7YQ";
  var support = ('serviceWorker' in navigator) && ('PushManager' in window) && ('Notification' in window);
  var reg = null;
  function b64u(s){var pad="=".repeat((4-s.length%4)%4);var b=(s+pad).replace(/-/g,"+").replace(/_/g,"/");var raw=atob(b),arr=new Uint8Array(raw.length);for(var i=0;i<raw.length;i++)arr[i]=raw.charCodeAt(i);return arr;}
  function angemeldet(){ try { return (typeof FL!=='undefined'&&FL)?{fl:FL,pin:(typeof PIN!=='undefined'?PIN:'')}:null; } catch(e){ return null; } }
  function istStandalone(){ try{return (window.matchMedia&&window.matchMedia('(display-mode: standalone)').matches)||window.navigator.standalone===true;}catch(e){return false;} }
  async function initSW(){ if(!support||reg)return reg; try{reg=await navigator.serviceWorker.register('sw.js');}catch(e){} return reg; }
  async function abo(){ try{return reg?await reg.pushManager.getSubscription():null;}catch(e){return null;} }
  function entferne(id){var e=document.getElementById(id);if(e)e.remove();}
  async function anmelden(interaktiv){
    var a=angemeldet();
    if(!a){ if(interaktiv)alert("Bitte zuerst in der App anmelden."); return false; }
    if(!support){ if(interaktiv)alert("Für Benachrichtigungen die App über das Home-Symbol öffnen."); return false; }
    await initSW();
    if(interaktiv && Notification.permission!=="granted"){ var p=await Notification.requestPermission(); if(p!=="granted"){alert("Benachrichtigungen nicht erlaubt.");return false;} }
    if(Notification.permission!=="granted")return false;
    try{
      var s=await abo();
      if(!s)s=await reg.pushManager.subscribe({userVisibleOnly:true,applicationServerKey:b64u(VAPID)});
      await fetch("/app/fl/push/subscribe",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({fl:a.fl,pin:a.pin,subscription:s})});
      return true;
    }catch(e){ if(interaktiv)alert("Konnte Benachrichtigungen nicht aktivieren."); return false; }
  }
  function knopf(){
    entferne("flPushHint");
    if(document.getElementById("flPushBtn"))return;
    var b=document.createElement("button");
    b.id="flPushBtn"; b.textContent="🔔 Benachrichtigungen aktivieren";
    b.style.cssText="position:fixed;left:12px;right:12px;bottom:14px;max-width:520px;margin:0 auto;z-index:9999;padding:12px 16px;border:none;border-radius:14px;background:#E8600B;color:#fff;font-size:15px;font-weight:600;box-shadow:0 6px 18px rgba(0,0,0,.22);cursor:pointer;display:block;";
    b.onclick=function(){anmelden(true).then(function(ok){if(ok)b.remove();});};
    document.body.appendChild(b);
  }
  function hinweis(t){
    entferne("flPushBtn");
    var h=document.getElementById("flPushHint");
    if(!h){h=document.createElement("div");h.id="flPushHint";h.style.cssText="position:fixed;left:12px;right:12px;bottom:14px;max-width:520px;margin:0 auto;z-index:9999;padding:10px 14px;border-radius:12px;background:#FFF3E9;border:1px solid #F3C79E;color:#8A4B10;font-size:13px;text-align:center;box-shadow:0 4px 14px rgba(0,0,0,.12);";document.body.appendChild(h);}
    h.textContent=t;
  }
  async function pruefe(){
    var a=angemeldet();
    if(!a){ entferne("flPushBtn"); entferne("flPushHint"); return; }
    if(!support){ hinweis(istStandalone()?"🔔 Dein System unterstützt keine Web-Benachrichtigungen.":"🔔 Für Benachrichtigungen: App über das Fuchs-Symbol auf dem Home-Bildschirm öffnen."); return; }
    await initSW();
    var hat=!!(await abo());
    if(Notification.permission==="granted"&&hat){ entferne("flPushBtn"); entferne("flPushHint"); return; }
    if(Notification.permission==="granted"&&!hat){ if(await anmelden(false)){ entferne("flPushBtn"); entferne("flPushHint"); return; } }
    knopf();
  }
  window.addEventListener("load",function(){ initSW().then(pruefe); setInterval(pruefe,4000); });
})();
</script>
