  if(pZeit)pZeit.addEventListener("input",()=>pZeigen(""));
  const nachfuehren=()=>{
    const blocker=W_BLOCKER.some(a=>a[0]===pArt.value);
    pFeld.style.display=blocker?"none":"block";
    pFz.style.display=blocker?"none":"block";
    if(pHin)pHin.textContent=blocker
      ? "Die Zeit wird im Plan geblockt – ohne Schüler, ohne Berechnung. Das Büro sieht den Eintrag sofort."
      : "Der Termin wird nur eingeplant. Gebucht und berechnet wird er später wie gewohnt mit der Unterschrift.";
    // Die Vorgabe greift weiter - aber nicht mehr im Stillen. Wechselt die
    // Fahrtart und springt die Dauer dabei um, leuchtet das Feld kurz auf
    // und daneben steht, woher die neue Zahl kommt.
    if(!beruehrt){
      const neu=dauerVorgabeW(pArt.value);
      const anders=String(pDauer.value)!==String(neu);
      pDauer.value=neu;
      if(anders)dauerBlinken("pDauer");
      pZeigen(anders?("Vorgabe für "+dArtText(pArt)):"");
    }else pZeigen("");
  };
  pArt.addEventListener("change",nachfuehren);
  nachfuehren();
  document.getElementById("pSpeichern").onclick=()=>planenSpeichern(false);
}
let P_GRUPPE=[];
const istB96=k=>/B96/i.test(String(k||""));
// Teilnehmerfeld der Gruppenschulung. Bewusst eine schlichte Auswahlliste:
// die App wird im Auto bedient, dort zaehlt ein grosser Treffer, kein Suchfeld.
function pGruppeZeigen(){
  const kasten=document.getElementById("pGruppe");
  if(!kasten)return;
  const id=String((document.getElementById("pSchueler")||{}).value||"");
  const haupt=W_SCHUELER.find(s=>String(s.id)===id);
  if(!haupt||!istB96(haupt.klasse)){P_GRUPPE=[];kasten.innerHTML="";return;}
  P_GRUPPE=P_GRUPPE.filter(x=>String(x)!==id);
  const frei=W_SCHUELER.filter(s=>istB96(s.klasse)&&String(s.id)!==id
    &&P_GRUPPE.indexOf(String(s.id))<0);
  const gewaehlt=P_GRUPPE.map(gid=>W_SCHUELER.find(s=>String(s.id)===String(gid))).filter(Boolean);
  kasten.innerHTML=`
    <div class="card" style="cursor:default;display:block">
      <div class="eyebrow">\u{1F465} Gruppenschulung B96</div>
      <div class="sub" style="margin:4px 0 9px">Die praktischen \u00dcbungen d\u00fcrfen in der Gruppe
        stattfinden (Anlage 7a FeV) \u2013 h\u00f6chstens <b>vier Teilnehmer</b> je Schulungsfahrzeug.
        Das Fahren im Stra\u00dfenverkehr wird einzeln gebucht.</div>
      <div class="sub" style="margin-bottom:6px">1. ${esc(haupt.name||"")}</div>
      ${gewaehlt.map((s,i)=>`<div class="sub" style="margin-bottom:6px">${i+2}. ${esc(s.name||"")}
        <button class="btn-ghost" style="padding:2px 9px;margin-left:6px"
          onclick="pGruppeWeg('${s.id}')">entfernen</button></div>`).join("")}
      ${P_GRUPPE.length<3
        ? `<select id="pGrpWahl" class="app-select" style="margin-top:4px"
             onchange="pGruppeDazu(this.value)">
             <option value="">\u2795 weitere/n B96-Teilnehmer/in dazunehmen (${frei.length})</option>
             ${frei.slice(0,300).map(s=>`<option value="${s.id}">${esc(s.name||"")}</option>`).join("")}
           </select>`
        : `<div class="meta">Vier Teilnehmer erreicht \u2013 mehr erlaubt Anlage 7a je Fahrzeug nicht.</div>`}
    </div>`;
}
function pGruppeDazu(id){ if(!id)return; if(P_GRUPPE.indexOf(String(id))<0)P_GRUPPE.push(String(id)); pGruppeZeigen(); }
function pGruppeWeg(id){ P_GRUPPE=P_GRUPPE.filter(x=>String(x)!==String(id)); pGruppeZeigen(); }

let B_SCHUELER=[];
let W_ARTEN=[["uebung","Übungsstunde"]];
let W_BLOCKER=[["theorie","Theorieunterricht"],["taetigkeit","Tätigkeit (Firma)"],
  ["privat","Privat"],["krank","Krankheit"],["urlaub","Urlaub"],["feiertag","Feiertag"]];

async function planenSpeichern(trotzdem){
  const err=document.getElementById("pErr");err.textContent="";
  const art=document.getElementById("pArt").value;
  const blocker=W_BLOCKER.some(a=>a[0]===art);
  const schueler_id=blocker?"":document.getElementById("pSchueler").value;
  if(!blocker&&!schueler_id){err.textContent="Bitte einen Schüler wählen.";return;}
  if(!blocker){
    const kFehlt=skFehlt("pKlasse",skSchueler(W_SCHUELER,schueler_id));
    if(kFehlt){err.textContent=kFehlt;return;}
  }
  const btn=document.getElementById("pSpeichern");btn.disabled=true;btn.textContent="Speichert …";
  const datum=document.getElementById("pDatum").value;
  // Gruppenschulung B96: eigene Route, ein Termin fuer alle Teilnehmer.
  if(!blocker&&P_GRUPPE.length){
    const g=await jpost("fahrlehrer/termin-neu-gruppe",{fl:FL,
      schueler_ids:[String(schueler_id)].concat(P_GRUPPE),
      datum, beginn:document.getElementById("pZeit").value,
      art, dauer:document.getElementById("pDauer").value,
      fahrzeug_id:(document.getElementById("pFz").value||null),
      bemerkung:document.getElementById("pBem").value, trotzdem});
    btn.disabled=false;btn.textContent="🗓 Termin einplanen";
    if(g&&g.ok){toast("Gruppenschulung mit "+(g.anzahl||0)+" Teilnehmern eingeplant \u2713");
      P_GRUPPE=[];viewWoche(wMontag(datum));return;}
    if(g&&g.konflikt&&!trotzdem){
      err.innerHTML=esc(g.fehler||"Zeitlicher Konflikt.")+
        `<br><button class="btn-ghost" style="margin-top:8px" onclick="planenSpeichern(true)">Trotzdem einplanen</button>`;
      return;}
    err.textContent=(g&&g.fehler)||FEHLERTEXT||"Einplanen fehlgeschlagen.";return;
  }
  const d=await jpost("fahrlehrer/termin-neu",{fl:FL,schueler_id,klasse:SK_WAHL["pKlasse"]||"",
    datum, beginn:document.getElementById("pZeit").value,
    art, dauer:document.getElementById("pDauer").value,
    fahrzeug_id:blocker?null:(document.getElementById("pFz").value||null),
    bemerkung:document.getElementById("pBem").value, trotzdem});
  btn.disabled=false;btn.textContent="🗓 Termin einplanen";
  if(d&&d.ok){
    const sch=W_SCHUELER.find(x=>String(x.id)===String(schueler_id))||{};
    const artText=(W_ARTEN.find(a=>a[0]===art)||[art,art])[1];
    GEPLANT_ZULETZT={schueler:sch.name||"",nummer:sch.telefon||"",klasse:sch.klasse||"",
      datum_iso:datum,datum:datum,uhrzeit:document.getElementById("pZeit").value,
      dauer:document.getElementById("pDauer").value,art_text:artText,bis:"",
      bemerkung:document.getElementById("pBem").value};
    // Ohne Schueler oder ohne Handy gibt es nichts zu schicken - dann wie bisher.
    if(blocker||!istHandy(sch.telefon)){toast("Termin eingeplant ✓");viewWoche(wMontag(datum));return;}
    geplantFertig(wMontag(datum));return;
  }
  if(d&&d.konflikt&&!trotzdem){
    err.innerHTML=esc(d.fehler||"Zeitlicher Konflikt.")+
      `<br><button class="btn-ghost" style="margin-top:8px" onclick="planenSpeichern(true)">Trotzdem einplanen</button>`;
    return;
  }
  err.textContent=(d&&d.fehler)||FEHLERTEXT||"Einplanen fehlgeschlagen.";
}

// Nach dem Einplanen: kurz zeigen, was steht, und das Verschicken anbieten.
// Frueher sprang die App sofort in den Wochenplan zurueck - dann war der

  const t=GEPLANT_ZULETZT||{};
  const bis=terminEnde(t.uhrzeit,t.dauer);
  main().innerHTML=`
    <div><div class="eyebrow">Eingeplant</div><h1>✅ Termin steht</h1></div>
    <div class="card zeile" style="cursor:default">
      <div class="zeit">${esc(String(t.uhrzeit||"").slice(0,5))}${bis?"–"+esc(bis):""}</div>
      <div class="info"><div class="titel">${esc(terminDatumLang(t.datum_iso,t.datum))}</div>
      <div class="sub">${esc(t.art_text||"")}${t.dauer?" · "+esc(String(t.dauer))+" Min.":""}</div></div>
    </div>
    <div class="card" style="cursor:default"><div class="sub">Für <b>${esc(t.schueler||"")}</b>${
      t.klasse?" · Klasse "+esc(t.klasse):""}</div></div>
    <div class="hint">Der Schüler weiß davon noch nichts – beim Planen geht bewusst keine

    ${alleTermineKnopfHTML((t && t.nummer) || "")}
    <button class="btn-ghost" onclick="viewWoche('${zurueckW}')" style="margin-top:6px">Fertig – zurück zum Wochenplan</button>`;

function pruefErg(e){const p=(e.pruefung_ergebnis||"");return p==="bestanden"||p==="nicht_bestanden"?p:"";}

// ---------------------------------------------------------------------------
// Terminplaner: Der Fahrlehrer soll beim Oeffnen sofort beim heutigen Tag
// stehen. Vergangene Tage sind deshalb eingeklappt - bis auf die Stunden,
// die noch nicht unterschrieben sind: die gehoeren nach oben, damit nichts
// liegen bleibt.
// ---------------------------------------------------------------------------
function kalHeuteIso(){
  try{ if(typeof ICH!=="undefined" && ICH && ICH.heute) return String(ICH.heute); }catch(e){}
  const d=new Date();
  return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
}
function kalIstAlt(e){
  const iso=String((e&&e.datum_iso)||"");
  return iso ? iso < kalHeuteIso() : false;
}
function kalOffen(e){
  if(e.signiert||e.status==="durchgefuehrt"||e.status==="ausgefallen"||e.status==="fehlstunde")return false;
  if(e.ohne_schueler)return false;
  try{ if(typeof istBlocker==="function"&&istBlocker(e))return false; }catch(x){}
  return true;
}
function kalAufteilen(t){
  const alt=(t||[]).filter(kalIstAlt);
  return {
    offenAlt: alt.filter(kalOffen),
    restAlt:  alt.filter(e=>!kalOffen(e)),
    abHeute:  (t||[]).filter(e=>!kalIstAlt(e)),
  };
}
function kalFrueherAuf(btn){
  const box=document.getElementById("kalFrueher");
  if(box){box.style.display="block";}
  if(btn){btn.style.display="none";}
}

function zeichneFuchsTermine(t){
  const liste=document.getElementById("kalliste");if(!liste)return;
  FUCHS_TERMINE={};
  if(!t.length){liste.innerHTML='<div class="leer">Keine Termine im Zeitraum gefunden.<br>Sobald in FUCHS Fahrstunden eingetragen sind, erscheinen sie hier.</div>';return;}
  let h="",letzterTag="";
  // Oben ein roter Banner, falls gefahrene Prüfungen ohne Ergebnis offen sind (Zwang)
  const offen=t.filter(e=>e.art==="praktische_pruefung"&&(e.signiert||e.status==="durchgefuehrt")&&!pruefErg(e));
  if(offen.length){
    h+=`<div style="background:#FDE8E8;border:1.5px solid #E9A6A6;border-radius:14px;padding:12px 14px;margin-bottom:12px">
      <div style="font-weight:800;color:#B02B2B">🎓 Prüfungsergebnis fehlt</div>
      <div style="font-size:13px;color:#8A3030;margin:3px 0 9px">Trag das Ergebnis der praktischen Prüfung ein – erst dann ist die Prüfung abgeschlossen.</div>`;
    for(const e of offen){
      h+=`<button onclick="pruefungErgebnis(${e.id})" style="display:block;width:100%;text-align:left;background:#fff;border:1.5px solid #E9A6A6;border-radius:10px;padding:9px 12px;margin-top:6px;font-family:inherit;font-size:13.5px;font-weight:700;color:#B02B2B;cursor:pointer">${esc(e.schueler||"Schüler")} · ${esc(e.datum)} → Ergebnis eintragen</button>`;
    }
    h+=`</div>`;
  }
  const kalZeile=(e)=>{
    let h="";
    FUCHS_TERMINE[e.id]=e;
    if(e.datum!==letzterTag){
      const heute=String(e.datum_iso||"")===kalHeuteIso();
      h+=`<div class="kaltag">${esc(e.datum)}${heute?' <span style="color:#1B7A43">· heute</span>':""}</div>`;
      letzterTag=e.datum;}
    const zeit=e.uhrzeit?(esc(e.uhrzeit)+(e.bis?("–"+esc(e.bis)):"")):"—";
    const fertig=e.signiert||e.status==="durchgefuehrt";
    const aus=e.status==="ausgefallen";
    const istPruef=e.art==="praktische_pruefung";
    const erg=pruefErg(e);
    let badge=`<div class="klbadge">${esc(e.klasse||"›")}</div>`;
    if(fertig)badge='<div class="klbadge" style="background:#E7F5EC;color:#1B7A43">✓ gefahren</div>';
    else if(aus)badge='<div class="klbadge" style="background:#FBECEC;color:#C23">ausgefallen</div>';
    let attr='class="card zeile"', sub=esc(e.art_text), moveBtn='';
    if(istPruef&&!fertig&&!aus)sub='🎓 '+esc(e.art_text);
    if(fertig&&istPruef){
      // Gefahrene Prüfung: Ergebnis hat Vorrang vor der Ausbildungskarte
      if(erg==="bestanden"){
        badge='<div class="klbadge" style="background:#DCF3E4;color:#1B7A43;font-weight:800">🏆 bestanden</div>';
        sub='🎓 '+esc(e.art_text)+' · <b style="color:#1B7A43">bestanden</b>';
        if(e.nummer)attr=`class="card zeile klick" onclick="karteVonStunde(${e.id})"`;
      }else if(erg==="nicht_bestanden"){
        badge='<div class="klbadge" style="background:#FBECEC;color:#C23;font-weight:800">✗ nicht bestanden</div>';
        sub='🎓 '+esc(e.art_text)+' · <b style="color:#C23">nicht bestanden</b>';
        if(e.nummer)attr=`class="card zeile klick" onclick="karteVonStunde(${e.id})"`;
      }else{
        // ZWANG: Ergebnis fehlt -> antippen führt zwingend zur Ergebnis-Eingabe
        badge='<div class="klbadge" style="background:#FDE1E1;color:#B02B2B;font-weight:800">⚠️ Ergebnis!</div>';
        attr=`class="card zeile klick" onclick="pruefungErgebnis(${e.id})"`;
        sub='🎓 '+esc(e.art_text)+' · <b style="color:#B02B2B">Prüfungsergebnis eintragen</b>';
      }
    }else if(fertig){
      if(e.karte_gepflegt){
        // Ausbildungskarte gepflegt -> grüner Haken zur optischen Erkennung
        badge='<div class="klbadge" style="background:#DCF3E4;color:#1B7A43;font-weight:800">✓ Karte gepflegt</div>';
        if(e.nummer)attr=`class="card zeile klick" onclick="karteVonStunde(${e.id})"`;
      }else if(e.nummer){
        // gefahren, Karte noch offen -> zur Ausbildungskarte
        attr=`class="card zeile klick" onclick="karteVonStunde(${e.id})"`;
        sub+=' · <b style="color:var(--orange)">📋 Ausbildungskarte pflegen</b>';
      }
    }else if(istBlocker(e)){
      // Geblockte Zeit: nur ansehen und gegebenenfalls wieder wegnehmen
      attr=`class="card zeile klick" onclick="viewBlocker(${e.id})"`;
      badge='<div class="klbadge" style="background:#EFEFEC;color:#6B6B63">geblockt</div>';
      sub=esc(BLOCKER_NAME[e.art]||e.art_text||"Geblockte Zeit")
        +' · <b style="color:var(--text-2)">antippen zum Ansehen</b>';
    }else if(!aus){
      // geplant -> unterschreiben & buchen, zusätzlich verschiebbar
      attr=`class="card zeile klick" onclick="signStunde(${e.id})"`;
      sub+=' · <b style="color:var(--orange)">antippen zum Unterschreiben</b>';
      moveBtn=`<button onclick="event.stopPropagation();verschiebenPanel(${e.id})" style="margin-top:7px;background:#fff;border:1.5px solid var(--line);border-radius:999px;padding:5px 13px;font-size:12px;font-weight:700;color:var(--text-2);cursor:pointer;font-family:inherit">🕒 Termin ändern</button><button onclick="event.stopPropagation();viewAusfall(${e.id})" style="margin-top:7px;background:#fff;border:1.5px solid var(--line);border-radius:999px;padding:5px 13px;font-size:12px;font-weight:700;color:var(--text-2);cursor:pointer;font-family:inherit">✕ ausgefallen</button><button onclick="event.stopPropagation();terminMenue(${e.id})" style="margin-top:7px;background:#fff;border:1.5px solid var(--line);border-radius:999px;padding:5px 13px;font-size:12px;font-weight:700;color:var(--text-2);cursor:pointer;font-family:inherit">⋯ mehr</button>`;
    }
    h+=`<div ${attr}><div class="zeit">${zeit}</div><div class="info"><div class="titel">${esc(e.schueler||"—")}</div><div class="sub">${sub}${fzKurz(e)}</div>${moveBtn}</div>${badge}</div>`;
    return h;
  };

  // Aufteilen: offene Stunden aus der Vergangenheit nach oben, dann ab heute,
  // ganz unten der Zugang zu den frueheren Terminen.
  const teile=kalAufteilen(t);
  if(teile.offenAlt.length){
    letzterTag="";
    h+=`<div style="background:#FFF6EC;border:1.5px solid #F0C79A;border-radius:14px;padding:11px 12px;margin-bottom:12px">
      <div style="font-weight:800;color:#9A5A12">⏳ Noch nicht gebucht</div>
      <div style="font-size:13px;color:#8A5C2A;margin:3px 0 8px">Diese Fahrstunden liegen schon hinter dir und sind noch nicht unterschrieben.</div>`;
    for(const e of teile.offenAlt) h+=kalZeile(e);
    h+=`</div>`;
  }
  if(teile.restAlt.length){
    letzterTag="";
    let alt="";
    for(const e of teile.restAlt) alt+=kalZeile(e);
    h+=`<button class="btn-ghost" style="width:100%;margin-bottom:8px" onclick="kalFrueherAuf(this)">↑ Frühere Termine anzeigen (${teile.restAlt.length})</button>
      <div id="kalFrueher" style="display:none">${alt}</div>`;
  }
  letzterTag="";
  if(teile.abHeute.length){ for(const e of teile.abHeute) h+=kalZeile(e); }
  else h+=`<div class="leer">Ab heute sind keine Fahrstunden eingetragen.</div>`;
  liste.innerHTML=h;
}
// Geblockte Zeit ansehen - mit der Moeglichkeit, sie wieder wegzunehmen.

    <div class="meta" id="sFehler" style="color:#D64545;min-height:16px"></div>`;
  sigInit(document.getElementById("bSig"));
  // Steht am Termin schon eine Klasse, bleibt sie unberuehrt - sie wurde beim
  // Einplanen gewaehlt. Nur wenn keine da ist (Termine von vor dem 11.09.2026)
  // und die Kartei mehrere Klassen hat, wird hier nachgefragt.
  SK_WAHL["sKlasse"]=String(s.klasse_gesetzt||"").trim();
  if(!SK_WAHL["sKlasse"]){
    skZeichnen("sKlasse",{name:s.schueler||"",klasse:s.schueler_klasse||"",
      weitere_klassen:s.schueler_weitere_klassen||""});
  }
  const sPreisNeu=preisLader("s",()=>({schueler_id:s.schueler_id,
    art:document.getElementById("sArt").value,
    dauer:document.getElementById("sDauer").value,
    // Das Auto des Termins entscheidet ueber das Getriebe und damit
    // ueber den Preis - nicht das Stammfahrzeug des Fahrlehrers.
    fahrzeug_id:s.fahrzeug_id||null}));
  // Wird die Fahrtart hier noch geaendert, zieht die Dauer nach - die
  // Testfahrt Schaltkompetenz dauert zum Beispiel immer 15 Minuten.
  // Sobald der Fahrlehrer die Dauer selbst antippt, bleibt sie stehen.
  let sDauerBeruehrt=false;
  const sDauerFeld=document.getElementById("sDauer"), sArtFeld=document.getElementById("sArt");
  // Hier haengt der Preis an der Dauer. Eine Zahl, die sich beim Wechsel der
  // Fahrtart still aendert, waere hier besonders teuer.
  const sZeigen=(grund)=>dauerZeigen("sDauerInfo",s.uhrzeit||"",sDauerFeld.value,grund);
  sDauerFeld.addEventListener("input",()=>{sDauerBeruehrt=true;sZeigen("");});
  sArtFeld.addEventListener("change",e=>{
    if(sDauerBeruehrt){sZeigen("");return;}
    const neu=dauerVorgabe(e.target.value,s.klasse);
    const anders=String(sDauerFeld.value)!==String(neu);
    sDauerFeld.value=neu;
    if(anders)dauerBlinken("sDauer");
    sZeigen(anders?("Vorgabe für "+dArtText(sArtFeld)):"");
  });
  sZeigen("");
  document.getElementById("sArt").addEventListener("change",sPreisNeu);
  document.getElementById("sDauer").addEventListener("input",sPreisNeu);
  sPreisNeu();
  document.getElementById("sSpeichern").onclick=stundeBestaetigen;
}

// ---------------------------------------------------------------------------
// Dauer beim Verschieben: Schnellwahl-Knoepfe und Zahlenfeld. Damit laesst sich
// eine Fahrstunde beim Verschieben auch kuerzen oder verlaengern - zum Beispiel
// von 135 auf 80 Minuten, wenn es sonst eine Ueberschneidung gaebe.
// ---------------------------------------------------------------------------
const VDAUER_WAHL = [40, 45, 80, 90, 135, 180, 225];

function vDauerFeld(dauer) {
  const d = Number(dauer) || 45;
  const knoepfe = VDAUER_WAHL.map(m => `<button type="button" class="vdchip" data-min="${m}"
      style="border:1.5px solid ${m === d ? "var(--gruen,#2e5e3f)" : "#ddd6cf"};
      background:${m === d ? "var(--gruen,#2e5e3f)" : "#fff"};color:${m === d ? "#fff" : "#6b6b63"};
      border-radius:999px;padding:7px 13px;font-size:13.5px;font-weight:700;cursor:pointer;
      font-family:inherit">${m}</button>`).join("");
  return `<div style="font-weight:700;font-size:14px;margin:12px 0 4px">Dauer in Minuten</div>
    <div id="vDauerChips" style="display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px">${knoepfe}</div>
    <input id="vDauer" type="number" inputmode="numeric" min="5" max="600" step="5" value="${d}"
      class="app-input app-select" style="width:100%;box-sizing:border-box;text-align:left">
    <div class="meta" id="vDauerInfo" style="margin-top:4px">Bisher ${d} Minuten.</div>
    <div class="meta" style="margin-top:2px">Kürzen oder verlängern ist möglich –
      der Preis richtet sich später nach der tatsächlichen Dauer.</div>`;
}

function vDauerBinden() {
  const feld = document.getElementById("vDauer");
  const chips = document.querySelectorAll("#vDauerChips .vdchip");
  const malen = () => {
    const w = Number(feld && feld.value) || 0;
    chips.forEach(c => {
      const an = Number(c.dataset.min) === w;
      c.style.background = an ? "var(--gruen,#2e5e3f)" : "#fff";
      c.style.color = an ? "#fff" : "#6b6b63";
      c.style.borderColor = an ? "var(--gruen,#2e5e3f)" : "#ddd6cf";
    });
  };
  const zeit = document.getElementById("vDatum") ? document.getElementById("vZeit") : null;
  const zeigen = () => dauerZeigen("vDauerInfo", zeit ? zeit.value : "", feld ? feld.value : 0, "");
  chips.forEach(c => c.onclick = () => { if (feld) feld.value = c.dataset.min; malen(); zeigen(); });
  if (feld) feld.oninput = () => { malen(); zeigen(); };
  if (zeit) zeit.addEventListener("input", zeigen);
  malen();
  zeigen();
}

function vDauerWert(standard) {
  const feld = document.getElementById("vDauer");
  const n = Math.round(Number(feld && feld.value));
  if (!Number.isFinite(n) || n <= 0) return Number(standard) || 45;
  return Math.max(5, Math.min(600, n));
}

// Fahrschueler an einem geplanten Termin wechseln (Benjamin, 02.09.2026).
// Der Fahrlehrer bekommt eine Absage und vergibt die Zeit an jemand anderen -
// bisher musste er dafuer loeschen und neu planen. Serverseitig konnte der
// Fahrschulmanager den Wechsel laengst, es fehlte nur die Auswahl hier.
// V_WECHSEL haelt fest, ob die Auswahl ueberhaupt aufgeklappt ist: nur dann
// wird eine geaenderte schueler_id mitgeschickt.
let V_WECHSEL=false;

async function vWechselZeigen(){
  const feld=document.getElementById("vSchuelerWahl"); if(!feld)return;
  const knopf=document.getElementById("vWechseln");
  if(knopf){knopf.disabled=true;knopf.textContent="Lädt …";}
  if(!W_SCHUELER.length){
    const d=await jpost("fahrlehrer/fuchs-schueler",{fl:FL});
    if(d&&d.schueler)W_SCHUELER=d.schueler;
  }
  if(knopf)knopf.style.display="none";
  if(!W_SCHUELER.length){
    feld.style.display="block";
    feld.innerHTML=`<div class="hint">Die Schülerliste konnte nicht geladen werden.
      Bitte die App neu laden und es noch einmal versuchen.</div>`;
    return;
  }
  V_WECHSEL=true;
  const s=AKT_STUNDE||{};
  const sub=document.getElementById("vJetztSub");
  if(sub)sub.textContent="bisher an diesem Termin";
  feld.style.display="block";
  feld.innerHTML=`
    <input id="vSuche" class="app-input" style="text-align:left" placeholder="🔍 Schüler suchen">
    <select id="vSchueler" class="app-select" style="margin-top:9px"></select>
    <div id="vKlasse" style="margin-top:10px"></div>`;
  // Ganz oben steht IMMER der bisherige Schueler - und zwar mit seiner eigenen
  // id. Damit passiert nichts, solange der Fahrlehrer die Liste nur aufklappt
  // und wieder in Ruhe laesst. Auch dann nicht, wenn der bisherige Schueler in
  // der Auswahlliste gar nicht mehr auftaucht (nicht mehr aktiv).
  const fuellen=(q)=>{
    const l=(q?W_SCHUELER.filter(x=>String(x.name||"").toLowerCase().includes(q.toLowerCase())):W_SCHUELER)
      .filter(x=>String(x.id)!==String(s.schueler_id||""));
    document.getElementById("vSchueler").innerHTML=
      `<option value="${esc(String(s.schueler_id||""))}">— ${esc(s.schueler||"bisheriger Schüler")} bleibt —</option>`+
      l.slice(0,300).map(x=>`<option value="${x.id}">${esc(x.name)}${x.geb?" · "+esc(x.geb):""}</option>`).join("");
    vKlasseNeu();
  };
  const vKlasseNeu=()=>skZeichnen("vKlasse",
    skSchueler(W_SCHUELER,document.getElementById("vSchueler").value)||{},null);
  fuellen("");
  document.getElementById("vSuche").oninput=e=>fuellen(e.target.value.trim());
  document.getElementById("vSchueler").addEventListener("change",vKlasseNeu);
}

async function verschiebenSpeichern(trotzdem){
  const err=document.getElementById("vFehler");if(err)err.innerHTML="";
  if(!AKT_STUNDE){if(err)err.textContent="Kein Termin gewählt.";return;}
  const neues_datum=document.getElementById("vDatum").value;
  const neue_zeit=document.getElementById("vZeit").value;
  if(!neues_datum||!neue_zeit){if(err)err.textContent="Bitte Datum und Uhrzeit angeben.";return;}
  const btn=document.getElementById("vSpeichern");const alt=btn.textContent;btn.textContent="Speichert …";btn.disabled=true;
  const s=AKT_STUNDE;
  // Wurde die Schuelerauswahl aufgeklappt und ein anderer Name gewaehlt, geht
  // die neue schueler_id mit - und dann AUCH die Klasse, sonst bliebe im
  // Fahrschulmanager die Klasse des alten Schuelers an der Stunde stehen.
  const sel=document.getElementById("vSchueler");
  let schuelerId=s.schueler_id, schuelerName=s.schueler||"", gewechselt=false;
  if(V_WECHSEL&&sel&&sel.value&&String(sel.value)!==String(s.schueler_id||"")){
    schuelerId=Number(sel.value);
    schuelerName=((skSchueler(W_SCHUELER,sel.value)||{}).name)||"";
    gewechselt=true;
  }
  // Das Fahrzeug aus der Maske hat Vorrang - genau dafuer steht das Feld da.
  const fzSel=document.getElementById("vFz");
  const fahrzeugId=fzSel?(fzSel.value||null):s.fahrzeug_id;
  const koffer={fl:FL,stunde_id:s.id,schueler_id:schuelerId,
    dauer:vDauerWert(s.dauer),art:s.art,fahrzeug_id:fahrzeugId,bemerkung:s.bemerkung,
    neues_datum,neue_zeit,nummer:s.nummer,schueler:schuelerName,trotzdem};
  if(gewechselt)koffer.klasse=SK_WAHL["vKlasse"]||"";
  const d=await jpost("fahrlehrer/stunde-verschieben",koffer);
  btn.textContent=alt;btn.disabled=false;
  if(d&&d.ok){
    let msg=gewechselt?("Termin geändert ✓ · jetzt für "+schuelerName):"Termin verschoben ✓";
    if(!gewechselt&&String(fahrzeugId||"")!==String(s.fahrzeug_id||""))msg="Termin geändert ✓ · neues Fahrzeug";
    toast(msg);AKT_STUNDE=null;V_WECHSEL=false;wZurueckGehen();
  }else if(d&&d.konflikt&&!trotzdem){
    if(err)err.innerHTML=esc((d&&d.fehler)||"Zeitlicher Konflikt.")+`<br><button class="btn-ghost" style="margin-top:8px" onclick="verschiebenSpeichern(true)">Trotzdem speichern</button>`;
  }else{
    if(err)err.textContent=(d&&d.fehler)||FEHLERTEXT||"Verschieben fehlgeschlagen.";
  }
}

    <div class="meta" id="pFehler" style="color:#D64545;min-height:16px"></div>
    <button class="btn-ghost" onclick="wZurueckGehen()" style="margin-top:2px">später (Termin bleibt rot markiert)</button>`;
  document.getElementById("pBest").onclick=()=>pruefungSpeichern(id,"bestanden");
  document.getElementById("pNicht").onclick=()=>pruefungSpeichern(id,"nicht_bestanden");
}
async function pruefungSpeichern(id,ergebnis){
  const s=FUCHS_TERMINE[id];if(!s)return;
  const err=document.getElementById("pFehler");if(err)err.textContent="";
  const bB=document.getElementById("pBest"),bN=document.getElementById("pNicht");
  if(bB)bB.disabled=true;if(bN)bN.disabled=true;
  const d=await jpost("fahrlehrer/pruefung-ergebnis",{fl:FL,stunde_id:s.id,schueler_id:s.schueler_id,datum:s.datum_iso,ergebnis});

    s.pruefung_ergebnis=ergebnis;

    if(bB)bB.disabled=false;if(bN)bN.disabled=false;

}

async function viewKalenderMaster(){
  // Fahrlehrer-Liste holen (Master selbst rausfiltern)
  let opts="";
  try{const d=await jget("ausbildung/fahrlehrer");
    opts=((d&&d.fahrlehrer)||[]).filter(f=>!f.master&&f.fl!==FL)
      .map(f=>`<option value="${esc(f.fl)}">${esc(f.name)}</option>`).join("");}catch(e){}
  main().innerHTML=`

async function ladeFLKalender(zielFl){
  const liste=document.getElementById("kalliste");if(!liste)return;
  if(!zielFl){liste.innerHTML="";return;}
  liste.innerHTML='<div class="meta">Lädt …</div>';
  const d=await jpost("fahrlehrer/kalender",{fl:FL,ziel_fl:zielFl});
  zeichneTermine((d&&d.termine)||[]);
}
function zeichneTermine(t){
  const liste=document.getElementById("kalliste");if(!liste)return;
  if(!t.length){liste.innerHTML='<div class="leer">Keine kommenden Fahrstunden gefunden.<br>Sobald im Fahrschulmanager Termine eingetragen sind, erscheinen sie hier.</div>';return;}
  let h="",letzterTag="";
  const zeile=(e)=>{
    let s="";
    if(e.datum!==letzterTag){
      const heute=String(e.datum_iso||"")===kalHeuteIso();
      s+=`<div class="kaltag">${esc(e.datum)}${heute?' <span style="color:#1B7A43">· heute</span>':""}</div>`;
      letzterTag=e.datum;}
    const zeit=e.uhrzeit?(esc(e.uhrzeit)+(e.bis?("–"+esc(e.bis)):"")):"—";
    const fl=e.fahrlehrer?`<div class="flname">${esc(e.fahrlehrer)}</div>`:"";
    s+=`<div class="card zeile"><div class="zeit">${zeit}</div><div class="info"><div class="titel">${esc(e.schueler)}</div><div class="sub">${esc(e.art_text)}</div>${fl}</div>${e.klasse?`<div class="klbadge">${esc(e.klasse)}</div>`:""}</div>`;
    return s;
  };
  const teile=kalAufteilen(t);
  const alteAlle=teile.offenAlt.concat(teile.restAlt)
    .sort((a,b)=>String(a.datum_iso||"").localeCompare(String(b.datum_iso||"")));
  if(alteAlle.length){
    letzterTag="";
    let alt="";
    for(const e of alteAlle) alt+=zeile(e);
    h+=`<button class="btn-ghost" style="width:100%;margin-bottom:8px" onclick="kalFrueherAuf(this)">↑ Frühere Termine anzeigen (${alteAlle.length})</button>
      <div id="kalFrueher" style="display:none">${alt}</div>`;
  }
  letzterTag="";
  if(teile.abHeute.length){ for(const e of teile.abHeute) h+=zeile(e); }
  else h+=`<div class="leer">Ab heute sind keine Fahrstunden eingetragen.</div>`;
  liste.innerHTML=h;
}

(function () {
  var VAPID = "BJYc8H02c4QqwL883jsXq-LMmnP6zr30rNoepYqtxEMBTmHK2pa6kBdxoq5iowdETozJHXmim487uj7o4m8_7YQ";
  var support = ('serviceWorker' in navigator) && ('PushManager' in window) && ('Notification' in window);
  var reg = null;
  function b64u(s){var pad="=".repeat((4-s.length%4)%4);var b=(s+pad).replace(/-/g,"+").replace(/_/g,"/");var raw=atob(b),arr=new Uint8Array(raw.length);for(var i=0;i<raw.length;i++)arr[i]=raw.charCodeAt(i);return arr;}
  function angemeldet(){ try { return (typeof FL!=='undefined'&&FL)?{fl:FL,token:(typeof TOKEN!=='undefined'?TOKEN:null)}:null; } catch(e){ return null; } }
  function istStandalone(){ try{return (window.matchMedia&&window.matchMedia('(display-mode: standalone)').matches)||window.navigator.standalone===true;}catch(e){return false;} }
  async function initSW(){ if(!support||reg)return reg; try{reg=await navigator.serviceWorker.register('sw.js');}catch(e){} return reg; }
  async function abo(){ try{return reg?await reg.pushManager.getSubscription():null;}catch(e){return null;} }
  function entferne(id){var e=document.getElementById(id);if(e)e.remove();}
  async function anmelden(interaktiv){
    var a=angemeldet();
    if(!a){ if(interaktiv)alert("Bitte zuerst in der App anmelden."); return false; }
    if(!support){ if(interaktiv)alert("Für Benachrichtigungen die App über das Home-Symbol öffnen."); return false; }
    await initSW();
    if(interaktiv && Notification.permission!=="granted"){ var p=await Notification.requestPermission(); if(p!=="granted"){alert("Benachrichtigungen nicht erlaubt.");return false;} }
    if(Notification.permission!=="granted")return false;
    try{
      var s=await abo();
      if(!s)s=await reg.pushManager.subscribe({userVisibleOnly:true,applicationServerKey:b64u(VAPID)});
      await fetch("/app/fl/push/subscribe",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({fl:a.fl,token:a.token,subscription:s})});
      return true;
    }catch(e){ if(interaktiv)alert("Konnte Benachrichtigungen nicht aktivieren."); return false; }
  }
  function knopf(){
    entferne("flPushHint");
    if(document.getElementById("flPushBtn"))return;
    var b=document.createElement("button");
    b.id="flPushBtn"; b.textContent="🔔 Benachrichtigungen aktivieren";
    b.style.cssText="position:fixed;left:12px;right:12px;bottom:14px;max-width:520px;margin:0 auto;z-index:9999;padding:12px 16px;border:none;border-radius:14px;background:#E8600B;color:#fff;font-size:15px;font-weight:600;box-shadow:0 6px 18px rgba(0,0,0,.22);cursor:pointer;display:block;";
    b.onclick=function(){anmelden(true).then(function(ok){if(ok)b.remove();});};
    document.body.appendChild(b);
  }
  function hinweisStumm(){
    try { return Number(localStorage.getItem("fuchs_fl_push_weg")||0) > Date.now(); }
    catch(e){ return false; }
  }
  function istIphone(){
    return /iPhone|iPad|iPod/i.test(navigator.userAgent)
      || (navigator.platform==="MacIntel" && navigator.maxTouchPoints>1);
  }
  function hinweis(t){
    entferne("flPushBtn");
    if(hinweisStumm()){ entferne("flPushHint"); return; }
    var h=document.getElementById("flPushHint");
    if(!h){h=document.createElement("div");h.id="flPushHint";h.style.cssText="position:fixed;left:12px;right:12px;bottom:14px;max-width:520px;margin:0 auto;z-index:9999;padding:10px 14px;border-radius:12px;background:#FFF3E9;border:1px solid #F3C79E;color:#8A4B10;font-size:13px;text-align:center;box-shadow:0 4px 14px rgba(0,0,0,.12);";document.body.appendChild(h);}
    h.style.paddingRight="34px"; h.style.textAlign="left"; h.style.position="fixed";
    var wie = istIphone()
      ? "Teilen-Symbol unten antippen, dann &bdquo;Zum Home-Bildschirm&ldquo;. Danach die App &uuml;ber das Fuchs-Symbol &ouml;ffnen."
      : "Oben rechts die drei Punkte, dann &bdquo;Zum Startbildschirm hinzuf&uuml;gen&ldquo;. Danach die App &uuml;ber das Fuchs-Symbol &ouml;ffnen.";
    h.innerHTML = "<div style=\"font-weight:700;margin-bottom:2px\">"+t+"</div>"
      + "<div style=\"font-size:12.5px\">"+wie+"</div>"
      + "<button id=\"flPushZu\" style=\"position:absolute;top:6px;right:8px;border:none;"
      + "background:transparent;color:inherit;font-size:19px;line-height:1;padding:4px 6px;cursor:pointer\">&times;</button>";
    var zu=document.getElementById("flPushZu");
    if(zu)zu.onclick=function(){
      try{localStorage.setItem("fuchs_fl_push_weg", String(Date.now()+14*86400000));}catch(e){}
      entferne("flPushHint");
    };
  }
  async function pruefe(){
    var a=angemeldet();
    if(!a){ entferne("flPushBtn"); entferne("flPushHint"); return; }
    if(!support){ hinweis(istStandalone()?"🔔 Dein System unterstützt keine Web-Benachrichtigungen.":"🔔 Für Benachrichtigungen: App über das Fuchs-Symbol auf dem Home-Bildschirm öffnen."); return; }
    await initSW();
    var hat=!!(await abo());
    if(Notification.permission==="granted"&&hat){ entferne("flPushBtn"); entferne("flPushHint"); return; }
    if(Notification.permission==="granted"&&!hat){ if(await anmelden(false)){ entferne("flPushBtn"); entferne("flPushHint"); return; } }
    knopf();
  }
  window.addEventListener("load",function(){ initSW().then(pruefe); setInterval(pruefe,4000); });
})();
</script>


<script>
// ── Neue Fassung selbst holen ────────────────────────────────────────
// "__APP_STAND__" ersetzt der Server beim Ausliefern durch die Aenderungszeit
// dieser Datei. Stimmt sie nicht mehr mit dem ueberein, was auf dem Server
// liegt, laedt sich die App einmal unter neuer Adresse - denn eine zum
// Home-Bildschirm hinzugefuegte App gibt sonst wochenlang die alte Seite aus.
(function () {
  var MEIN_STAND = "__APP_STAND__";
  function neuLaden(stand) {
    // Nur einmal je Sitzung, damit daraus niemals eine Schleife wird.
    try {
      if (sessionStorage.getItem("fuchs_neuladen") === String(stand)) return;
      sessionStorage.setItem("fuchs_neuladen", String(stand));
    } catch (e) { return; }
    location.replace(location.pathname + "?v=" + encodeURIComponent(stand));
  }
  function pruefen() {
    if (!MEIN_STAND || MEIN_STAND.indexOf("APP_STAND") >= 0) return;
    fetch("/app/version?t=" + Date.now(), { cache: "no-store" })
      .then(function (r) { return r.ok ? r.json() : null; })
      .then(function (d) {
        var stand = d && d.stand_fl;
        if (stand && String(stand) !== String(MEIN_STAND)) neuLaden(stand);
      })
      .catch(function () { /* offline - dann eben beim naechsten Mal */ });
  }
  window.addEventListener("load", pruefen);
  // Auch beim Zurueckholen aus dem Hintergrund nachsehen: Eine App auf dem
  // Home-Bildschirm wird oft wochenlang nicht wirklich neu gestartet.
  document.addEventListener("visibilitychange", function () {
    if (!document.hidden) pruefen();
  });
})();
</script>
