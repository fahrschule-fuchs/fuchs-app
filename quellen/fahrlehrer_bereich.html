 .kbtn{flex:1; display:flex; align-items:center; justify-content:center; gap:8px;

 .wknopf{flex:1; background:#fff; color:var(--dark,#1A1A1A); border:1.5px solid var(--line,#E7DED6);

 .wtag{flex:1; min-width:48px; text-align:center; padding:5px 2px; font-size:10.5px; color:#7A6C61; line-height:1.2;}

 .wtag.heute b, .wtag.heute span, .wtag.heute i{color:#fff;}
 .wkoerper{display:flex;}
 .wleiste{width:34px; flex:none; border-right:1px solid var(--line,#E7DED6); background:#fcfaf8; position:sticky; left:0; z-index:2;}
 .wstd{font-size:9.5px; color:#7A6C61; text-align:center; border-bottom:1px solid var(--line,#E7DED6); padding-top:1px;}
 .wspalte{flex:1; min-width:48px; position:relative; border-right:1px solid var(--line,#E7DED6); cursor:pointer;}

 .pruefbox{border:1.5px solid #C0392B;border-radius:12px;padding:9px 11px;margin:0 0 11px;
  background:#FDF1EF}
.pruefh{font-weight:800;font-size:13px;color:#A5271B;margin-bottom:6px}
.pruefz{display:flex;gap:9px;align-items:flex-start;padding:6px 0;cursor:pointer;
  border-top:1px solid rgba(192,57,43,.18)}
.pruefz:first-of-type{border-top:0}
.pruefk{font-weight:800;font-size:12.5px;white-space:nowrap;color:#A5271B;flex:0 0 auto}
.pruefi{font-size:13px;line-height:1.35;min-width:0;flex:1 1 auto}
.pruefo{font-size:12.5px;color:#5b4a47;margin-top:1px}
.wpruef{-webkit-line-clamp:2;font-size:10.5px;font-weight:800;opacity:1;
  background:rgba(255,255,255,.22);border-radius:4px;padding:1px 3px;margin-top:3px}
.wbem{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;
  overflow:hidden;margin-top:2px;font-size:9.5px;line-height:1.2;
  opacity:.92;word-break:break-word}
.wblock{position:absolute; left:2px; right:2px; border-radius:7px; padding:3px 4px; font-size:9px;
   line-height:1.15; overflow:hidden; color:#fff; cursor:pointer; word-break:break-word;
   hyphens:auto; -webkit-hyphens:auto;}
 .wblock b{display:block; font-size:9.5px; font-weight:800;}
 /* Zweite Zeile: Endzeit und Ausbildungsklasse. Die Spalte ist rund 43 px
    breit - "08:00-08:45" passt dort in EINER Zeile nicht (gemessen: 65 px),
    deshalb Beginn oben, Ende unten. */
 .wbis{display:block; font-size:8.4px; font-weight:700; opacity:.95;
   letter-spacing:-.1px; white-space:nowrap; margin-bottom:0;}
 .wkl{font-style:normal; font-weight:800; font-size:8px; background:rgba(255,255,255,.28);
   border-radius:3px; padding:0 3px; margin-right:3px; white-space:nowrap;}
 .wlegende{display:flex; flex-wrap:wrap; gap:4px 12px; font-size:11px; color:#7A6C61; margin:2px 0 4px;}
 .wlegende span{display:inline-flex; align-items:center; gap:5px;}
 .wlegende i{width:11px; height:11px; border-radius:3px; display:inline-block;}
</style></head>
<body>
<div class="phone">
  <div class="topbar"></div>
  <header>
    <img src="/app/fuchs-logo-komplett.png" alt="FUCHS – Deine Fahrschule">
    <div class="kopfrechts" id="kopfrechts"></div>
  </header>
  <main id="main"></main>
</div>
<div class="status" id="status"></div>
<script>
let aktKlasseEcht="";
let FL=null, PIN=null, TOKEN=null, FLNAME="", FEHLERTEXT="", katalog=null, kataloge={}, stand={}, aktNummer="", aktKlasse="B", schuelerListe=[], eigeneListe=false, IS_MASTER=false, aktFahrstunden=null, offeneSekt=new Set(), aktZuletzt=null;
const main=()=>document.getElementById("main");

function toast(t){const s=document.getElementById("status");s.textContent=t;s.style.opacity=1;clearTimeout(s._t);s._t=setTimeout(()=>s.style.opacity=0,1500);}
function esc(s){const d=document.createElement("div");d.textContent=s==null?"":s;return d.innerHTML;}

/* ── Uhrzeit ohne nativen Picker (11.09.2026) ─────────────────────────
   Samsung Internet schneidet den eingebauten Uhr-Picker unten ab: die
   Zeile mit OK/Abbrechen ist nicht erreichbar, die Aenderung laesst sich
   nicht abschliessen (Meldung einer Buerokraft, Samsung-Handy). Ein
   <input type="time"> haengt immer am Picker des Geraets - deshalb hier
   ueberall zwei Auswahlfelder: Stunde (05-22) und Minute (00,05,...,55).

   WICHTIG fuer alles, was schon da war: Der Wert bleibt ein verborgenes
   Eingabefeld mit derselben Kennung und demselben Inhalt "HH:MM". Jede
   Stelle, die vorher .value gelesen hat, liest unveraendert weiter; am
   Server und an der Schnittstelle aendert sich nichts.

   Es startet mit der URSPRUENGLICHEN Zeit und wird erst ueberschrieben,
   wenn wirklich etwas gewaehlt wird. Eine krumme Bestandszeit (08:03)
   bleibt also 08:03, solange sie niemand anfasst - vorbelegt ist dabei
   die naechstliegende Fuenferstufe (08:05). */
var ZEIT_STUNDE_VON = 5, ZEIT_STUNDE_BIS = 22;

function zeitOption(n, gewaehlt){
  var v = ("0" + n).slice(-2);
  return '<option value="' + v + '"' + (n === gewaehlt ? " selected" : "") + ">" + v + "</option>";
}

function zeitFeld(id, wert){
  var roh = String(wert == null ? "" : wert);
  var t = roh.match(/^(\d{1,2}):(\d{2})/);
  var hh = t ? Math.max(0, Math.min(23, Number(t[1]))) : 9;
  var mm = t ? Math.round(Number(t[2]) / 5) * 5 : 0;
  if (mm >= 60) { mm = 0; hh = (hh + 1) % 24; }   // 08:58 -> vorbelegt 09:00
  var std = "", min = "";
  for (var h = ZEIT_STUNDE_VON; h <= ZEIT_STUNDE_BIS; h++) std += zeitOption(h, hh);
  // Eine Bestandszeit ausserhalb 05-22 darf nicht unter den Tisch fallen.
  if (t && (hh < ZEIT_STUNDE_VON || hh > ZEIT_STUNDE_BIS)) std = zeitOption(hh, hh) + std;
  for (var m = 0; m < 60; m += 5) min += zeitOption(m, mm);
  var attr = 'class="app-select" style="width:100%;box-sizing:border-box;text-align:left"'
    + ' onchange="zeitUebernehmen(\'' + id + '\')"';
  return '<input type="hidden" id="' + id + '" value="' + esc(roh) + '">'
    + '<div style="display:flex;gap:9px">'
    +   '<div style="flex:1"><div class="meta" style="margin-bottom:3px">Stunde</div>'
    +     '<select id="' + id + 'Std" ' + attr + '>' + std + '</select></div>'
    +   '<div style="flex:1"><div class="meta" style="margin-bottom:3px">Minute</div>'
    +     '<select id="' + id + 'Min" ' + attr + '>' + min + '</select></div>'
    + '</div>';
}

// Erst eine echte Auswahl schreibt die Zeit fort. Das "input"-Ereignis geht
// mit, damit die Dauer-Hinweise (dauerZeigen) weiter mitlaufen wie bisher.
function zeitUebernehmen(id){
  var h = document.getElementById(id + "Std"), m = document.getElementById(id + "Min"),
      z = document.getElementById(id);
  if (!h || !m || !z) return;
  z.value = h.value + ":" + m.value;
  try { z.dispatchEvent(new Event("input", { bubbles: true })); } catch (e) {}
}
// Betrag in deutscher Schreibweise - 62.75 -> "62,75 €"
function eurTxt(n){return (Number(n)||0).toFixed(2).replace(".",",")+" €";}
// Preisvorschau wie im Manager: aendert sich Fahrtart oder Dauer, wird neu
// gerechnet. Die zuletzt gestartete Abfrage gewinnt - sonst ueberholt eine
// langsame Antwort die neue Eingabe.
function preisLader(prefix, werte){
  let lauf=0;
  return async function(){
    const feld=document.getElementById(prefix+"Preis");
    const hin=document.getElementById(prefix+"PreisHinweis");
    if(!feld)return;
    const w=werte()||{};
    if(!w.schueler_id){feld.textContent="–";if(hin)hin.textContent="";return;}
    const nr=++lauf;
    feld.textContent="…";
    // fahrzeug_id nur mitschicken, wenn die Maske eines nennt - sonst nimmt
    // der Server wie bisher das Stammfahrzeug des Fahrlehrers.
    const anfrage={fl:FL,schueler_id:w.schueler_id,art:w.art,dauer:w.dauer};
    if(w.fahrzeug_id!==undefined)anfrage.fahrzeug_id=w.fahrzeug_id;
    const d=await jpost("fahrlehrer/stunde-preis",anfrage);
    if(nr!==lauf)return;
    const box=document.getElementById(prefix+"Berechnen");
    const bez=document.getElementById(prefix+"PreisLabel");
    if(!d){feld.textContent="–";if(hin)hin.textContent="Preis gerade nicht abrufbar.";return;}
    if(d.enthalten){
      // Mofa, B96: die Fahrstunde steckt im Kurspreis. Kein Haken, keine Warnung.
      if(box){ if(box.dataset.aus!=="1"){box.dataset.aus="1";box.dataset.vorher=box.checked?"1":"0";}
               box.checked=false; box.style.display="none"; }
      if(bez)bez.textContent="💶 Diese Fahrstunde ist ";
      feld.textContent="im Kurspreis enthalten";
      if(hin)hin.textContent="";
      return;
    }
    if(box&&box.dataset.aus==="1"){ box.style.display=""; box.checked=box.dataset.vorher!=="0"; box.dataset.aus="0"; }
    if(bez)bez.textContent="Fahrstunde jetzt berechnen: ";
    feld.textContent=d.betrag_text||"–";
    if(hin)hin.textContent=d.hinweis||"";
  };
}
function normNr(n){let z=(n||"").replace(/\D/g,"");if(z.startsWith("00"))z=z.slice(2);else if(z.startsWith("0"))z="49"+z.slice(1);return z;}
// API immer absolut unter /app/ ansprechen – damit die App unter /fl (eigener
// PWA-Pfad) genauso läuft wie unter /app/fl.
const API="/app/";
// Zentrale Stelle fuer alle Server-Anfragen. Wichtig: ein Fehler wird hier
// NICHT verschluckt - er landet in FEHLERTEXT, damit jede Ansicht ihn zeigen
// kann. Vorher gab es bei jedem Problem still ein "null", und die App sah aus,
// als haette der Schueler einfach keine Daten.
const SPEICHER="fuchs_fl_sitzung";
function fehlerText(status){
  if(status===403)return "Die Anmeldung ist abgelaufen. Bitte neu anmelden.";
  if(status===429)return "Zu viele Versuche. Bitte einen Moment warten.";
  if(status===0)return "Keine Verbindung zum Server. Bitte Empfang prüfen.";
  if(status>=500)return "Der Server meldet einen Fehler ("+status+"). Bitte im Büro melden.";
  return "Der Server hat die Anfrage abgelehnt ("+status+").";
}
async function jget(u){
  FEHLERTEXT="";
  try{
    const r=await fetch(API+u);
    if(r.status===403&&TOKEN){sitzungAbgelaufen();return null;}
    if(!r.ok){FEHLERTEXT=fehlerText(r.status);return null;}
    return await r.json();
  }catch(e){FEHLERTEXT=fehlerText(0);return null;}
}
async function jpost(u,b){
  FEHLERTEXT="";
  try{
    const koerper=Object.assign({},b||{});
    if(TOKEN&&!koerper.token)koerper.token=TOKEN;
    const r=await fetch(API+u,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(koerper)});
    if(r.status===403&&TOKEN&&u!=="fahrlehrer/anmelden"){sitzungAbgelaufen();return null;}
    if(!r.ok){
      let d=null;try{d=await r.json();}catch(e){}
      FEHLERTEXT=(d&&d.fehler)||fehlerText(r.status);
      return d&&typeof d==="object"?Object.assign({ok:false},d):null;
    }
    return await r.json();
  }catch(e){FEHLERTEXT=fehlerText(0);return null;}
}
// Ein Fehlerkasten, den jede Ansicht benutzen kann - immer mit Grund.
function fehlerKasten(zusatz){
  return `<div class="card" style="border-left:5px solid #C0392B">
    <div style="font-weight:800;margin-bottom:3px">Das hat nicht geklappt</div>
    <div style="font-size:13.5px">${esc(FEHLERTEXT||zusatz||"Unbekannter Fehler.")}</div>
    <div class="meta" style="font-size:12px;margin-top:6px">Es wurde nichts gespeichert. Bitte noch einmal versuchen.</div>
  </div>`;
}
function sitzungAbgelaufen(){
  try{localStorage.removeItem(SPEICHER);}catch(e){}
  FL=null;TOKEN=null;PIN=null;FLNAME="";IS_MASTER=false;
  FEHLERTEXT="Die Anmeldung ist abgelaufen. Bitte neu anmelden.";
  try{init();}catch(e){}
}
function sitzungMerken(){
  try{localStorage.setItem(SPEICHER,JSON.stringify({fl:FL,token:TOKEN,name:FLNAME,master:IS_MASTER}));}catch(e){}
}
function sitzungLesen(){
  try{const r=JSON.parse(localStorage.getItem(SPEICHER)||"null");return (r&&r.token&&r.fl)?r:null;}catch(e){return null;}
}
function setKopf(){
  const k=document.getElementById("kopfrechts");
  if(!FL){k.innerHTML="";return;}
  k.innerHTML=`<div class="eb">${IS_MASTER?"Masterzugang":"Fahrlehrer"}</div><b>${esc(FLNAME)}</b><br><a href="#" class="abmeldebtn" onclick="abmelden();return false">Abmelden</a>`;
}

// ---------------- Login ----------------
async function init(){
  setKopf();
  let opts="";
  const dl=await jget("ausbildung/fahrlehrer");
  if(dl&&dl.fahrlehrer)opts=dl.fahrlehrer.map(f=>`<option value="${esc(f.fl)}">${esc(f.name)}</option>`).join("");
  // Ohne Liste kann sich niemand anmelden - dann muss der Grund auf dem
  // Bildschirm stehen und nicht nur eine leere Auswahl.
  else if(!FEHLERTEXT)FEHLERTEXT="Die Namensliste konnte nicht geladen werden. Bitte Internet prüfen.";
  main().innerHTML=`
   <div class="login">
     <img src="/app/fuchs-icon.png" alt="Fuchs">
     <div class="eyebrow">Fahrlehrer-Bereich</div>

async function sitzungWiederherstellen(){

  FL=g.fl;TOKEN=g.token;FLNAME=g.name||"";IS_MASTER=!!g.master;

async function login(){

  if(!fl){err.textContent="Bitte Fahrlehrer wählen.";return;}

  err.textContent="";btn.disabled=true;btn.textContent="Meldet an …";
  const d=await jpost("fahrlehrer/anmelden",{fl,passwort:pw});
  btn.disabled=false;btn.textContent="Anmelden";
  if(!d||!d.ok||!d.token){err.textContent=FEHLERTEXT||"Name oder Passwort stimmt nicht.";return;}
  FL=fl;TOKEN=d.token;PIN=null;FLNAME=d.name||"";IS_MASTER=!!d.master;schuelerListe=[];aktNummer="";katalog=null;stand={};

let LISTE_FEHLER="";
async function ladeSchuelerListe(){
  const d=await jpost("ausbildung/schueler",{fl:FL});
  // Ohne Antwort NICHT so tun, als hätte der Fahrlehrer keine Schüler -
  // genau daran ist früher niemandem aufgefallen, dass der Server weg war.
  if(!d){LISTE_FEHLER=FEHLERTEXT||"Die Schülerliste konnte nicht geladen werden.";return;}
  LISTE_FEHLER="";
  schuelerListe=(d.schueler)||[];
  eigeneListe=!!d.eigene;
}
function matchSchueler(s,q){
  q=(q||"").trim().toLowerCase();if(!q)return true;
  // Gesucht wird in beiden Schreibweisen: "anna" findet "Mustermann, Anna"
  // genauso wie "mustermann".
  if((s.name||"").toLowerCase().includes(q))return true;
  if((s.anzeige||"").toLowerCase().includes(q))return true;
  const geb=(s.geb||"");
  if(geb.toLowerCase().includes(q))return true;
  const qd=q.replace(/\D/g,""),gd=geb.replace(/\D/g,"");
  if(qd&&gd&&gd.includes(qd))return true;
  return false;
}
function schuelerOptions(q){
  const qq=(q||"").trim();
  // Bei vielen Schülern (Leitungszugang) erst ab 2 Zeichen filtern/anzeigen –
  // sonst würden Tausende Einträge auf einmal gerendert.
  if(schuelerListe.length>500 && qq.length<2){
    return `<option value="">— zum Suchen Name oder Geburtstag tippen (${schuelerListe.length} Schüler) —</option>`;
  }
  // Sortiert wird auch hier noch einmal - der Server tut es zwar, aber die
  // Liste kann aus mehreren Quellen kommen, und eine Auswahl, die nicht
  // alphabetisch ist, sucht man sich krumm.
  const liste=schuelerListe.filter(s=>matchSchueler(s,qq))
    .sort((a,b)=>String(a.anzeige||a.name||"").localeCompare(String(b.anzeige||b.name||""),"de"));
  const kopf=`<option value="">${liste.length?("— Schüler wählen ("+liste.length+") —"):"— kein Treffer —"}</option>`;
  // Angezeigt wird "Nachname, Vorname" - dann passt die Reihenfolge der
  // Liste zu dem, was man liest.
  return kopf+liste.slice(0,300).map(s=>`<option value="${esc(s.nummer)}">${esc(s.anzeige||s.name)}${s.geb?" · "+esc(s.geb):" ("+esc((s.nummer||"").slice(-4))+")"}</option>`).join("");
}

async function ladeStand(nummer){
  aktNummer=nummer;aktFahrstunden=null;
  const k=document.getElementById("karte");if(k)k.innerHTML='<div class="meta">Lädt …</div>';
  // Nur noch der Ausbildungsstand - Konto, Infos und Fahrstunden liegen im
  // Schuelerkonto und muessen hier nicht mehr geholt werden.
  const [d0,fs]=[await jpost("ausbildung/stand",{fl:FL,nummer}), null];
  // Kein Stand vom Server = Fehler, NICHT "alles auf Anfang". Sonst sieht
  // die Karte aus wie bei einem Schüler ohne jede Bewertung.
  if(!d0){ if(k)k.innerHTML=fehlerKasten("Der Ausbildungsstand konnte nicht geladen werden.");
    stand={};katalog=null;return; }
  const d=d0;
  aktFahrstunden=(fs&&fs.fahrstunden)||null;
  aktKlasse=d.klasse||"B";aktKlasseEcht=d.klasse_echt||aktKlasse;stand=d.stand||{};
  aktZuletzt=(d.zuletzt_von)?{von:d.zuletzt_von,text:d.zuletzt_text||""}:null;
  offeneSekt=new Set();   // neue Schülerkarte startet zugeklappt
  katalog=await ladeKatalog(aktKlasse);
  if(!katalog){
    if(k)k.innerHTML=(KATALOG_FEHLER
      ? fehlerKasten("Die Ausbildungskarte konnte nicht geladen werden.")
      : '<div class="card">Für diesen Schüler gilt Klasse <b>'+esc(aktKlasse)+'</b> – dafür ist noch keine Ausbildungskarte hinterlegt.</div>');
    return;}
  zeichne();
}
function toggleSekt(i){if(offeneSekt.has(i))offeneSekt.delete(i);else offeneSekt.add(i);zeichne();}
function alleSekt(auf){offeneSekt=new Set();if(auf&&katalog){katalog.sektionen.forEach((s,i)=>offeneSekt.add(i));}zeichne();}
function fahrstundenHtml(){
  const f=aktFahrstunden;
  if(!f||!f.gefunden)return"";
  const arten=(f.nach_art||[]).map(a=>`${esc(a.art)} <b>${a.anzahl}</b>`).join(" · ");
  const letzte=(f.letzte&&f.letzte.length)?f.letzte[f.letzte.length-1]:"";
  const fehl=f.fehlstunden?`<span style="color:#D64545"> · ${f.fehlstunden} Fehlstunde${f.fehlstunden>1?"n":""}</span>`:"";
  return `<div class="card" style="margin-bottom:12px">
    <div class="zeile">
      <div class="nr done">🚗</div>
      <div class="info"><div class="titel">Gefahrene Fahrstunden</div><div class="sub">insgesamt <b>${f.gesamt}</b> Stunde${f.gesamt===1?"":"n"}${fehl}</div></div>
    </div>
    ${arten?`<div style="margin-top:11px;font-size:13px;line-height:1.7">${arten}</div>`:""}
    ${letzte?`<div class="meta" style="margin-top:6px;font-size:12px">zuletzt: ${esc(letzte)}</div>`:""}
  </div>`;
}
async function setWert(key,wert){
  const vorher=stand[key];   // fuer den Fall, dass das Speichern scheitert
  stand[key]=wert>0?wert:undefined;if(wert<=0)delete stand[key];zeichne();
  const r=await jpost("ausbildung/set",{fl:FL,nummer:aktNummer,klasse:aktKlasse,key,wert});
  if(!r||!r.ok){
    // Zurueck auf den alten Stand - die App darf nichts anzeigen, was nicht
    // wirklich gespeichert ist.
    if(vorher===undefined)delete stand[key];else stand[key]=vorher;
    zeichne();
    toast(FEHLERTEXT||"Nicht gespeichert – bitte noch einmal antippen");
    return;
  }
  toast("gespeichert ✓");
  // Erste Bewertung zu einer Fahrstunde -> Stunde als "Karte gepflegt" markieren (grüner Haken)
  if(r&&r.ok&&AKT_KARTE_STUNDE&&!KARTE_MARKIERT){
    KARTE_MARKIERT=true;
    jpost("fahrlehrer/karte-gepflegt",{fl:FL,stunde_id:AKT_KARTE_STUNDE});
  }
}
function zeichne(){
  const el=document.getElementById("karte");if(!el)return;
  if(!katalog||!aktNummer){el.innerHTML="";return;}
  const stufen=katalog.stufen;
  // Infos vom Buero und die gefahrenen Stunden stehen seit dem 01.09.2026 im
  // Schuelerkonto - hier bleibt allein die Diagrammkarte.
  let h=`<div class="hint" style="margin-bottom:10px">Kontostand, Infos vom Büro, kommende Termine
    und alle gefahrenen Stunden findest du unter <b>💶 Schülerkonto &amp; Termine</b>.</div>`;
  const titelEcht=(aktKlasseEcht&&katalog.klasse&&aktKlasseEcht!==katalog.klasse&&katalog.titel)
    ? katalog.titel.replace('Klasse '+katalog.klasse,'Klasse '+aktKlasseEcht)
    : (katalog.titel||('Klasse '+(aktKlasseEcht||aktKlasse)));
  h+=`<div class="secttitel" style="font-size:16px;margin-top:8px">${esc(titelEcht)}</div>`;
  if(aktZuletzt)h+=`<div class="meta" style="margin:2px 0 6px">zuletzt bewertet von ${esc(aktZuletzt.von)}${aktZuletzt.text?(" · "+esc(aktZuletzt.text)):""}</div>`;
  if(katalog.hinweis_fahrlehrer)h+=`<div class="kompf" style="margin-bottom:8px">⚠️ ${esc(katalog.hinweis_fahrlehrer)}</div>`;
  const anzAuf=offeneSekt.size, anzGes=katalog.sektionen.length;
  h+=`<div style="display:flex;justify-content:flex-end;margin-bottom:2px"><button class="btn-ghost" style="padding:6px 12px;font-size:12px" onclick="alleSekt(${anzAuf<anzGes?'true':'false'})">${anzAuf<anzGes?"Alle aufklappen":"Alle zuklappen"}</button></div>`;
  katalog.sektionen.forEach((s,i)=>{
    const total=s.items.length;
    const bewertet=s.items.filter(it=>(stand[it.key]||0)>0).length;
    const offen=offeneSekt.has(i);
    const badge=`<span class="sektzahl">${bewertet}/${total}</span>`;
    h+=`<div class="sekt">
      <button class="sekthead" style="background:${s.farbe}" onclick="toggleSekt(${i})">
        <span class="sekttitel-t">${esc(s.titel)}</span>
        <span class="sekthead-r">${badge}<span class="chev">${offen?"▾":"▸"}</span></span>
      </button>`;
    if(offen){
      for(const it of s.items){
        const cur=stand[it.key]||0;
        h+=`<div class="item"><div class="lab">${esc(it.label)}</div>`+(it.detail?`<div class="det">${esc(it.detail)}</div>`:"")+`<div class="stufen">`;
        for(const st of stufen){const an=cur===st.wert;h+=`<button class="${an?'an':''}" style="${an?'background:'+st.farbe:''}" onclick="setWert('${it.key}',${st.wert})">${esc(st.name)}</button>`;}
        h+=`</div></div>`;
      }
    }
    h+=`</div>`;
  });
  el.innerHTML=h;
}

// ---------------- Autos: wann ist welches frei? ----------------
// Der Schaltwagen wird geteilt. Damit man das nicht erst an der Fehlermeldung
// beim Einplanen merkt, kann man hier vorher nachsehen.
let FZ_LISTE=[], FZ_WAHL=null, FZ_VON=null, FZ_SUCHE="";

function fzMontag(iso){
  const d=iso?new Date(iso+"T12:00:00"):new Date();
  const tag=(d.getDay()+6)%7;
  d.setDate(d.getDate()-tag);
  return d.toISOString().slice(0,10);
}
function fzPlusTage(iso,n){
  const d=new Date(iso+"T12:00:00"); d.setDate(d.getDate()+n);
  return d.toISOString().slice(0,10);
}

      Angezeigt wird der ganze Betrieb, nicht nur deine eigenen Fahrstunden.</div>

    +`${esc(f.bezeichnung)}${f.kennzeichen?" · "+esc(f.kennzeichen):""}`
    +`${f.getriebe?" · "+(f.getriebe==="automatik"?"Automatik":"Schalter"):""}</option>`).join("");
  main().innerHTML=`
    <button class="btn-ghost" onclick="history.back()">← Zurück</button>
    <div><div class="eyebrow">Fahrlehrer-Bereich</div><h1>🚗 Autos</h1></div>
    <input id="fzSuche" class="app-input" placeholder="🔍 Auto suchen (Name oder Kennzeichen)" value="${esc(FZ_SUCHE)}">
    <select id="fzSel" class="app-select" style="margin-top:8px">${opts||'<option value="">— kein Treffer —</option>'}</select>
    <div style="display:flex;align-items:center;gap:8px;margin-top:10px">
      <button class="btn-ghost" style="margin:0;padding:8px 16px" id="fzZurueck">‹</button>
      <div style="flex:1;text-align:center;font-weight:700" id="fzWoche">…</div>
      <button class="btn-ghost" style="margin:0;padding:8px 16px" id="fzVor">›</button>
    </div>
    <div id="fzPlan"><div class="meta">Lädt …</div></div>`;
  const s=document.getElementById("fzSuche");
  s.addEventListener("input",()=>{FZ_SUCHE=s.value;const stand=s.selectionStart;fahrzeugMaske();
    const n=document.getElementById("fzSuche");if(n){n.focus();try{n.setSelectionRange(stand,stand);}catch(e){}}});
  document.getElementById("fzSel").onchange=e=>{FZ_WAHL=Number(e.target.value);fahrzeugPlanLaden();};
  document.getElementById("fzZurueck").onclick=()=>{FZ_VON=fzPlusTage(FZ_VON,-7);fahrzeugPlanLaden();};
  document.getElementById("fzVor").onclick=()=>{FZ_VON=fzPlusTage(FZ_VON,7);fahrzeugPlanLaden();};
  if(treffer.length&&!treffer.some(f=>Number(f.id)===Number(FZ_WAHL)))FZ_WAHL=treffer[0].id;
  fahrzeugPlanLaden();
}

async function fahrzeugPlanLaden(){
  const ziel=document.getElementById("fzPlan");
  if(!ziel||!FZ_WAHL)return;
  ziel.innerHTML=`<div class="meta">Lädt …</div>`;
  const d=await jpost("fahrlehrer/fahrzeug-plan",{fl:FL,fahrzeug_id:FZ_WAHL,von:FZ_VON,tage:7});
  if(!d||!d.ok){ziel.innerHTML=`<div class="fehler">${esc((d&&d.fehler)||"Belegung gerade nicht abrufbar.")}</div>`;return;}
  const w=document.getElementById("fzWoche");
  if(w)w.textContent=`${d.tage[0].datum_text} – ${d.tage[d.tage.length-1].datum_text}`;
  let html="";
  for(const t of d.tage){
    const leer=t.belegt.length===0&&t.gesperrt.length===0;
    html+=`<div class="card" style="margin-top:10px">
      <div style="display:flex;justify-content:space-between;align-items:baseline">
        <div style="font-weight:800">${esc(t.wochentag)} ${esc(t.datum_text)}</div>
        <div class="meta">${leer?"ganzer Tag frei":(t.frei.length?Math.round(t.belegt_minuten/60*10)/10+" Std. belegt":"nichts mehr frei")}</div>
      </div>`;
    for(const s of t.gesperrt)
      html+=`<div class="sub" style="color:#8A4B10;margin-top:6px">🔧 ${esc(s.von)}–${esc(s.bis)} · ${esc(s.grund)}</div>`;
    for(const b of t.belegt)
      html+=`<div class="sub" style="margin-top:6px"><b>${esc(b.von)}–${esc(b.bis)}</b> · ${esc(b.fahrlehrer)}`
        +`${b.eigene?' <span style="color:#2f6b3a">(du)</span>':""}`
        +`<span class="meta"> · ${esc(b.art_text)}${b.gebucht?" ✓":""}</span></div>`;
    if(t.frei.length){
      html+=`<div style="margin-top:8px;display:flex;flex-wrap:wrap;gap:6px">`
        +t.frei.map(f=>`<span style="background:#e9f3ea;color:#2f6b3a;border-radius:999px;padding:4px 10px;font-size:12px;font-weight:700">`
          +`frei ${esc(f.von)}–${esc(f.bis)}</span>`).join("")+`</div>`;
    }else{
      html+=`<div class="meta" style="margin-top:8px">Kein freies Fenster von mindestens 45 Minuten.</div>`;
    }
    html+=`</div>`;
  }
  ziel.innerHTML=html;
}

// ---------------- Meine Stunden (Stundenaufstellung) ----------------
// Was der Fahrlehrer in einem Monat geleistet hat - dieselben Zahlen wie das
// Blatt, mit dem das Buero abrechnet. Gerechnet wird im Manager, hier wird nur
// gezeigt: zwei Rechnungen zu derselben Frage sind eine Fehlerquelle.
const ST_MONATE=["","Januar","Februar","März","April","Mai","Juni","Juli",
                 "August","September","Oktober","November","Dezember"];
let ST_MONAT="", ST_DATEN=null, ST_ALLE=false;

function stMonatText(m){
  const j=String(m||"").slice(0,4), n=Number(String(m||"").slice(5,7));
  return (ST_MONATE[n]||"")+" "+j;
}
function stMonatPlus(m,n){
  let j=Number(String(m).slice(0,4)), mo=Number(String(m).slice(5,7))+n;
  while(mo<1){mo+=12;j--;} while(mo>12){mo-=12;j++;}
  return j+"-"+String(mo).padStart(2,"0");
}
function stStd(min){return ((Number(min)||0)/60).toLocaleString("de-DE",{minimumFractionDigits:2,maximumFractionDigits:2});}
function stEinh(min){return ((Number(min)||0)/45).toLocaleString("de-DE",{minimumFractionDigits:1,maximumFractionDigits:1});}

async function viewStunden(){
  if(!ST_MONAT){const d=new Date();ST_MONAT=d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0");}
  stMaske();
  await stLaden();
}

function stMaske(){
  main().innerHTML=`
    <button class="btn-ghost" onclick="history.back()">← Zurück</button>
    <div><div class="eyebrow">Fahrlehrer-Bereich</div><h1>📋 Meine Stunden</h1></div>
    <div class="hint">Was in diesem Monat auf dich gebucht ist – dieselbe Aufstellung, mit der das Büro abrechnet.</div>
    <div style="display:flex;align-items:center;gap:8px;margin-top:10px">
      <button class="btn-ghost" style="margin:0;padding:8px 16px" onclick="stBlaettern(-1)">‹</button>
      <div style="flex:1;text-align:center;font-weight:800">${esc(stMonatText(ST_MONAT))}</div>
      <button class="btn-ghost" style="margin:0;padding:8px 16px" onclick="stBlaettern(1)">›</button>
    </div>
    <div id="stInhalt"><div class="meta" style="margin-top:10px">Lädt …</div></div>`;
}

function stBlaettern(n){ST_MONAT=stMonatPlus(ST_MONAT,n);ST_ALLE=false;stMaske();stLaden();}
function stAlle(){ST_ALLE=!ST_ALLE;stZeichnen();}

async function stLaden(){
  ST_DATEN=null;
  const d=await jpost("fahrlehrer/stundenaufstellung",{fl:FL,ziel_fl:(typeof W_FL!=="undefined"?W_FL:"")||undefined,monat:ST_MONAT});
  const ziel=document.getElementById("stInhalt");if(!ziel)return;
  if(!d||!d.ok){ziel.innerHTML=fehlerKasten((d&&d.fehler)||"Die Stundenaufstellung konnte nicht geladen werden.");return;}
  if(!d.daten){
    ziel.innerHTML=`<div class="card" style="cursor:default"><div class="sub">Für den Leitungs-Zugang gibt es keine eigene Aufstellung.
      Wähle im Wochenplan zuerst eine Fahrlehrerin oder einen Fahrlehrer.</div></div>`;
    return;
  }
  ST_DATEN=d.daten;
  stZeichnen();
}

function stZeichnen(){
  const ziel=document.getElementById("stInhalt");if(!ziel||!ST_DATEN)return;
  const d=ST_DATEN, g=d.gesamt||{}, ab=d.abwesenheit||{};
  const mitWert=(d.summe||[]).filter(s=>s.anzahl>0);
  const tage=(d.tage||[]);
  const zeigen=ST_ALLE?tage:tage.slice(0,12);
  const rest=tage.length-zeigen.length;
  const titel=Object.fromEntries((d.summe||[]).map(s=>[s.schluessel,s.titel]));
  ziel.innerHTML=`
    <div class="card" style="cursor:default;display:block;margin-top:10px">
      <div class="eyebrow">${esc((d.fahrlehrer&&d.fahrlehrer.name)||"")}${
        d.fahrlehrer&&d.fahrlehrer.filiale?" · "+esc(d.fahrlehrer.filiale):""}</div>
      <div style="display:flex;gap:10px;margin-top:8px;text-align:center">
        <div style="flex:1"><div style="font-size:24px;font-weight:800">${g.anzahl||0}</div>
          <div class="meta" style="font-size:11.5px">Termine</div></div>
        <div style="flex:1;border-left:1px solid var(--line);border-right:1px solid var(--line)">
          <div style="font-size:24px;font-weight:800">${stStd(g.minuten)}</div>
          <div class="meta" style="font-size:11.5px">Stunden</div></div>
        <div style="flex:1"><div style="font-size:24px;font-weight:800">${stStd(g.minuten_ohne_fehl)}</div>
          <div class="meta" style="font-size:11.5px">ohne Fehlstunden</div></div>
      </div>
    </div>
    ${mitWert.length?`<div class="card" style="cursor:default;display:block">
      <div class="eyebrow">Aufgeteilt</div>
      ${mitWert.map(s=>`<div style="display:flex;justify-content:space-between;align-items:baseline;
          border-top:1px solid var(--line);padding:7px 0;font-size:13.5px">
        <span>${esc(s.titel)}</span>
        <span><b>${s.anzahl}</b> <span class="meta" style="font-size:12px">· ${s.minuten} Min. · ${stEinh(s.minuten)} EH</span></span>
      </div>`).join("")}
    </div>`:`<div class="card" style="cursor:default"><div class="sub">In diesem Monat ist noch nichts gebucht.</div></div>`}
    ${(ab.urlaub||ab.krank||ab.feiertage)?`<div class="card" style="cursor:default;display:block">
      <div class="eyebrow">Abwesenheit</div>
      <div style="font-size:13.5px;margin-top:4px">Urlaub <b>${ab.urlaub||0}</b> ·
        Krank <b>${ab.krank||0}</b> · Feiertage <b>${ab.feiertage||0}</b></div></div>`:""}
    ${zeigen.length?`<div class="card" style="cursor:default;display:block">
      <div class="eyebrow">Tag für Tag</div>
      ${zeigen.map(t=>`<div style="border-top:1px solid var(--line);padding:7px 0">
        <div style="display:flex;justify-content:space-between;font-size:13.5px">
          <span><b>${esc(t.wochentag)} ${Number(String(t.datum).slice(8))}.</b></span>
          <span>${t.anzahl?`<b>${t.anzahl}</b> <span class="meta" style="font-size:12px">· ${t.minuten} Min.</span>`:""}</span></div>
        <div class="meta" style="font-size:12px">${
          Object.keys(t.werte||{}).map(k=>`${esc(titel[k]||k)} ${t.werte[k].anzahl}`).join(" · ")}${
          (t.marken&&t.marken.length)?(Object.keys(t.werte||{}).length?" · ":"")+t.marken.map(esc).join(" · "):""}</div>
      </div>`).join("")}
      ${(rest>0||ST_ALLE)?`<button class="btn-ghost" style="width:100%;margin-top:8px;padding:8px;font-size:12.5px"
        onclick="stAlle()">${ST_ALLE?"weniger anzeigen":"alle "+tage.length+" Tage anzeigen"}</button>`:""}
    </div>`:""}
    <div class="meta" style="font-size:11.5px;margin-top:8px">Live aus dem Fahrschulmanager · nur zur Ansicht.
      Stimmt etwas nicht, bitte im Büro melden – hier lässt sich nichts ändern.</div>`;
}

let AKTE=null, AKTE_ALLE=false;

async function ladeKonto(nummer){
  const el=document.getElementById("kontoKarte");if(el)el.innerHTML='<div class="meta">Lädt …</div>';
  AKTE=null; AKTE_ALLE=false;
  const d=await jpost("fahrlehrer/schueler-akte",{fl:FL,pin:PIN,nummer});
  if(!el)return;
  if(!d||!d.ok){el.innerHTML=fehlerKasten(FEHLERTEXT||"Die Schülerdaten konnten nicht geladen werden.");return;}
  AKTE=d; AKTE.nummer=AKTE.nummer||nummer;
  zeichneAkte();
}
function akteAlle(){AKTE_ALLE=!AKTE_ALLE;zeichneAkte();}

// Kontostand als Karte - unveraendert im Aufbau, nur jetzt Teil der Uebersicht.
function akteKontoHtml(k){
  if(!k||!k.gefunden){
    return '<div class="leer">'+(k&&k.mehrdeutig

  }

      <div style="display:flex;justify-content:space-between;font-size:13.5px;margin-top:5px"><span class="meta">Bereits gezahlt</span><b>${esc(k.gezahlt_text)}</b></div>
    </div>`;
}

// Eine Terminzeile - gleich aufgebaut fuer kommende und gefahrene Stunden.
function akteZeile(t, kommend){
  const zeit=String(t.uhrzeit||"").slice(0,5);
  const bis=kommend&&t.bis?"–"+esc(String(t.bis).slice(0,5)):"";
  const fl=String(t.fahrlehrer||"").trim();
  const eigen=fl&&FLNAME&&fl===FLNAME;
  // Wer zwei Fahrerlaubnisklassen macht, hat zwei Karteien und ein Konto.
  // Dann gehoert an jeden Termin, zu welcher Klasse er zaehlt.
  const kl=(AKTE&&AKTE.karteien>1&&String(t.klasse||"").trim())?
    ` · <span style="opacity:.75">${esc(String(t.klasse).trim())}</span>`:"";
  return `<div class="zeile" style="cursor:default;padding:7px 0;border-top:1px solid var(--line)">
      <div class="zeit" style="min-width:74px;font-size:13px">${esc(zeit)}${bis}</div>
      <div class="info"><div class="titel" style="font-size:13.5px">${esc(t.datum||"")}</div>
      <div class="sub" style="font-size:12.5px">${esc(t.art_text||"Fahrstunde")}${
        fl?` · ${eigen?"<b>du</b>":esc(fl.split(" ")[0])}`:""}${kl}</div></div>
    </div>`;
}

function akteKommendHtml(liste){
  if(!liste||!liste.length){
    return `<div class="card" style="cursor:default"><div class="eyebrow">Kommende Termine</div>
      <div class="sub" style="margin-top:4px">Es steht noch kein Termin an.</div></div>`;
  }
  return `<div class="card" style="cursor:default;display:block">
      <div class="eyebrow">Kommende Termine</div>
      <div class="titel" style="font-size:15px;margin-bottom:2px">${liste.length} anstehend</div>
      ${liste.map(t=>akteZeile(t,true)).join("")}
    </div>`;
}

function akteGefahrenHtml(liste, z){
  const arten=(z&&z.nach_art||[]).map(a=>`${esc(a.art)} <b>${a.anzahl}</b>`).join(" · ");
  const fehl=(z&&z.fehlstunden)?`<span style="color:#D64545"> · ${z.fehlstunden} Fehlstunde${z.fehlstunden>1?"n":""}</span>`:"";
  const gesamt=(z&&z.gesamt)||((liste&&liste.length)||0);
  if(!liste||!liste.length){
    return `<div class="card" style="cursor:default"><div class="eyebrow">Gefahrene Fahrstunden</div>
      <div class="sub" style="margin-top:4px">Noch keine Fahrstunde gefahren.</div></div>`;
  }
  // Die juengsten zuerst - beim Planen interessiert das Letzte, nicht das Erste.
  const umgekehrt=liste.slice().reverse();
  const zeigen=AKTE_ALLE?umgekehrt:umgekehrt.slice(0,10);
  const rest=umgekehrt.length-zeigen.length;
  return `<div class="card" style="cursor:default;display:block">
      <div class="eyebrow">Gefahrene Fahrstunden</div>
      <div class="titel" style="font-size:15px">insgesamt ${gesamt} Stunde${gesamt===1?"":"n"}${fehl}</div>
      ${arten?`<div style="margin-top:7px;font-size:13px;line-height:1.7">${arten}</div>`:""}
      <div style="margin-top:9px">${zeigen.map(t=>akteZeile(t,false)).join("")}</div>
      ${(rest>0||AKTE_ALLE)?`<button class="btn-ghost" style="width:100%;margin-top:8px;padding:8px;font-size:12.5px"
        onclick="akteAlle()">${AKTE_ALLE?"weniger anzeigen":"alle "+umgekehrt.length+" Stunden anzeigen"}</button>`:""}
    </div>`;
}

// Theorie-Lernstand aus dem Lernbereich der Fahrschueler-App. Gerechnet wird
// im Bot (theorie_lernen.py), hier wird nur gezeigt. Fehlt der Wert - alte
// Server-Fassung, Lernbereich aus oder noch nie benutzt - faellt die Karte
// einfach weg; die Akte muss auch ohne sie vollstaendig sein.
function akteTheorieHtml(l){
  if(!l||!l.verfuegbar)return "";
  if(!l.begonnen){
    return `<div class="card" style="cursor:default;display:block">
      <div class="eyebrow">Theorie lernen</div>
      <div class="sub" style="margin-top:4px">Der Lernbereich in der Schüler-App wurde noch nicht benutzt.</div></div>`;
  }
  const p=Math.max(0,Math.min(100,Number(l.prozent)||0));
  const farbe=p>=80?"var(--green,#2E9E5B)":(p>=40?"#D8A11A":"#D64545");
  const balken=(wert,f)=>`<div style="background:var(--line,#e6ded7);border-radius:6px;height:8px;overflow:hidden">
      <div style="width:${Math.max(0,Math.min(100,wert))}%;height:100%;background:${f}"></div></div>`;
  const schwach=(l.gebiete||[]).filter(g=>g.gesamt>0)
    .map(g=>({...g,quote:Math.round(g.sicher*100/g.gesamt)}))
    .sort((a,b)=>a.quote-b.quote).slice(0,3);
  const pr=l.letzte_pruefung;
  return `<div class="card" style="cursor:default;display:block">
    <div class="eyebrow">Theorie lernen</div>
    <div style="display:flex;align-items:center;gap:12px;margin-top:4px">
      <div style="font-size:28px;font-weight:800;color:${farbe};min-width:66px">${p} %</div>
      <div style="flex:1">${balken(p,farbe)}
        <div class="meta" style="font-size:11.5px;margin-top:4px">${l.sicher} von ${l.gesamt} Fragen sitzen sicher</div></div>
    </div>
    <div class="meta" style="font-size:12px;margin-top:6px">${l.zu_ueben} noch zu üben · ${l.offen} noch nie beantwortet${
      l.zuletzt_text?" · zuletzt am "+esc(l.zuletzt_text):""}</div>
    <div style="border-top:1px solid var(--line);margin-top:8px;padding-top:7px;font-size:13px">
      <b>${l.pruefungen_gesamt}</b> Prüfungssimulation${l.pruefungen_gesamt===1?"":"en"} · <b>${l.pruefungen_bestanden}</b> bestanden${
      pr?`<div class="meta" style="font-size:11.5px;margin-top:2px">zuletzt ${esc(pr.wann_text)} · ${pr.punkte} Fehlerpunkte · ${
        pr.bestanden?"bestanden":"nicht bestanden"}</div>`:""}</div>
    ${schwach.length?`<div style="border-top:1px solid var(--line);margin-top:8px;padding-top:7px">
      <div class="meta" style="font-size:11.5px;margin-bottom:5px">Wo es noch hakt</div>
      ${schwach.map(g=>`<div style="margin-bottom:6px">
        <div style="display:flex;justify-content:space-between;font-size:12.5px"><span>${esc(g.titel)}</span>
          <span class="meta">${g.quote} %</span></div>
        ${balken(g.quote,g.quote<50?"#D64545":"#D8A11A")}</div>`).join("")}</div>`:""}
    <div class="meta" style="font-size:11px;margin-top:6px">„Sicher“ = zweimal hintereinander richtig. Aus dem Lernbereich der Schüler-App.</div>
  </div>`;
}

// Ausbildungsstand: Soll und Ist nebeneinander, mit schmalem Balken - dieselben
// Zahlen wie im Fahrschulmanager. Gerechnet wird dort, hier wird gezeigt.
function standBalken(wert, soll){
  const fertig=soll&&wert>=soll;
  const anteil=soll?Math.min(100,Math.round(wert*100/soll)):0;
  return `<div style="flex:0 0 62px;background:var(--line,#e6ded7);border-radius:6px;height:6px;overflow:hidden">
      <div style="width:${anteil}%;height:100%;background:${fertig?"var(--green,#2E9E5B)":"var(--orange,#E8600B)"}"></div></div>`;
}
function standZeile(name, wert, soll){
  const fertig=soll&&wert>=soll;
  return `<div style="display:flex;align-items:center;gap:9px;padding:3px 0;font-size:13px">
      <div style="flex:1;color:var(--gray,#6A6A6A)">${esc(name)}</div>
      <div style="font-weight:700;white-space:nowrap${fertig?";color:var(--green,#2E9E5B)":""}">${wert}${
        soll?`<span style="font-weight:400;color:var(--gray,#6A6A6A)"> / ${soll}</span>`:""}${fertig?" ✓":""}</div>
      ${soll?standBalken(wert,soll):'<div style="flex:0 0 62px"></div>'}
    </div>`;
}
// Die Zeilen EINER Klasse einer Mehrklassen-Kartei. Gerechnet hat das der
// Fahrschulmanager (stand.je_klasse) - hier wird nur gezeigt.
function standKlasseZeilen(e){
  const sf=e.sonderfahrten_soll||{};
  const sfZ=(name,ist,soll)=>(soll||ist)?standZeile(name,ist,soll||0):"";
  let z=standZeile("Übungsstunden",e.uebung,0)

// Eine nackte Minutenzahl in einem schmalen Feld liest niemand nach. Die
// Endzeit dagegen faellt sofort auf, wenn sie nicht stimmt.
function dEnde(beginn, dauer){
  const teile=String(beginn||"").split(":");
  if(teile.length<2)return "";
  const h=Number(teile[0]), m=Number(teile[1]), d=Number(dauer)||0;
  if(!Number.isFinite(h)||!Number.isFinite(m))return "";
  let ges=((h*60+m+d)%1440+1440)%1440;
  return String(Math.floor(ges/60)).padStart(2,"0")+":"+String(ges%60).padStart(2,"0");
}
function dauerZeigen(infoId, beginn, dauer, grund){
  const el=document.getElementById(infoId); if(!el)return;
  const bis=dEnde(beginn,dauer), min=Number(dauer)||0;
  el.innerHTML=(bis?`<b>${esc(String(beginn).slice(0,5))}–${esc(bis)} Uhr</b> · `:"")
    +`${min} Minuten`
    +(grund?` · <span style="color:#B26A00;font-weight:700">${esc(grund)}</span>`:"");
}

// Mehrere Fahrerlaubnisklassen in einer Kartei (z. B. A und BE): An der
// Fahrstunde muss stehen, um WELCHE es geht - davon haengt der Preis ab.
// Bei nur einer Klasse erscheint hier gar nichts.
let SK_WAHL={};                 // feldId -> gewaehlte Klasse
function skKlassen(s){
  const haupt=String((s&&s.klasse)||"").trim();
  const w=String((s&&s.weitere_klassen)||"").split(",").map(x=>x.trim()).filter(Boolean);
  return [...new Set([haupt,...w].filter(Boolean))];
}
function skZeichnen(feldId,s,nachWahl){

  // KEINE Vorauswahl mehr. Vorher stand die Hauptklasse vorgewaehlt da; wer
  // nichts antippte, buchte still auf sie - die Motorradstunde eines B+A-
  // Schuelers landete so bei B (11.09.2026). Jetzt muss getippt werden.
  if(!alle.includes(SK_WAHL[feldId]))SK_WAHL[feldId]="";
  const jetzt=SK_WAHL[feldId];
  el.innerHTML=`<div class="card" style="cursor:default;display:block${jetzt?"":";border-color:var(--gold)"}">

        `<button type="button" class="${k===jetzt?"btn-primary":"btn-ghost"}" data-sk="${esc(k)}"
           style="padding:7px 14px;width:auto;margin:0">${esc(k)}</button>`).join("")}</div>
      <div class="sub">${esc(s.name||"")} macht ${esc(alle.join(" + "))}. Der Preis richtet sich nach der gewählten Klasse.</div>
    </div>`;
  el.querySelectorAll("[data-sk]").forEach(b=>b.onclick=()=>{

  });

function skSchueler(liste,id){return (liste||[]).find(x=>String(x.id)===String(id))||null;}
// Bei mehreren Klassen ist die Wahl Pflicht - sonst laesst sich spaeter nicht
// mehr sagen, zu welcher Ausbildung die Stunde gehoert. Liefert den Fehlertext
// oder "" (dann ist alles in Ordnung).
function skFehlt(feldId,s){
  const alle=skKlassen(s);

// Zeitvorgaben je Fahrtart und Klasse - identisch mit dem Fahrschulmanager.
function dauerVorgabe(art,klasse){
  const k=klasse||"B", istA=/^A/.test(k)||k==="MO", istBE=k==="BE";
  if(art==="uebung")return istA?120:80;
  if(art==="pruefungsvorbereitung")return 40;
  if(art==="ueberland")return istBE?135:225;
  if(art==="autobahn")return istBE?45:180;
  if(art==="nacht")return istBE?45:135;
  if(art==="praktische_pruefung")return 55;
  if(art==="theorie")return 90;
  if(art==="testfahrt")return 15;
  if(["urlaub","krank","feiertag"].includes(art))return 480;
  if(["taetigkeit","privat"].includes(art))return 60;
  return 45;
}
function sigInit(c){
  sigCanvas=c; sigLeer=true;
  // Zeichenflaeche auf die tatsaechlich angezeigte Groesse bringen: nichts wird
  // gestaucht, die Unterschrift bleibt so, wie sie geschrieben wurde.
  const rr=c.getBoundingClientRect(), sf=Math.min(2,window.devicePixelRatio||1);
  if(rr.width>0&&rr.height>0){ c.width=Math.round(rr.width*sf); c.height=Math.round(rr.height*sf); }
  sigCtx=c.getContext("2d");
  sigCtx.lineWidth=1.7*sf; sigCtx.lineCap="round"; sigCtx.lineJoin="round"; sigCtx.strokeStyle="#1A1A1A";
  let malt=false;
  const pos=e=>{const r=c.getBoundingClientRect();const t=e.touches&&e.touches[0]?e.touches[0]:e;
    return {x:(t.clientX-r.left)*(c.width/r.width), y:(t.clientY-r.top)*(c.height/r.height)};};
  const start=e=>{e.preventDefault();malt=true;const p=pos(e);sigCtx.beginPath();sigCtx.moveTo(p.x,p.y);};
  const move=e=>{if(!malt)return;e.preventDefault();const p=pos(e);sigCtx.lineTo(p.x,p.y);sigCtx.stroke();sigLeer=false;};
  const end=()=>{malt=false;};
  c.addEventListener("mousedown",start);c.addEventListener("mousemove",move);window.addEventListener("mouseup",end);
  c.addEventListener("touchstart",start,{passive:false});c.addEventListener("touchmove",move,{passive:false});c.addEventListener("touchend",end);
}

function wPlus(iso,n){const d=new Date(iso+"T12:00:00");d.setDate(d.getDate()+n);return wIso(d);}
function wMontag(iso){const d=new Date(iso+"T12:00:00");d.setDate(d.getDate()-((d.getDay()+6)%7));return wIso(d);}
function wKurz(iso){const d=new Date(iso+"T12:00:00");return String(d.getDate()).padStart(2,"0")+"."+String(d.getMonth()+1).padStart(2,"0")+".";}
function wKW(iso){const d=new Date(iso+"T12:00:00");const t=new Date(d);t.setDate(d.getDate()+3-((d.getDay()+6)%7));
  const j=new Date(t.getFullYear(),0,4);return 1+Math.round(((t-j)/86400000-3+((j.getDay()+6)%7))/7);}

        liste.push({id:null, datum_iso:t.datum, uhrzeit:s.von, dauer:Math.max(30,m(s.bis)-m(s.von)),
          art:"werkstatt", status:"gesperrt", signiert:false,
          schueler:"🔧 "+(s.grund||"Werkstatt"), art_text:s.grund||"Werkstatt", fremd:true});
      }

    WOCHE_DATEN=liste;
    wFreiKnopfZeigen(false);          // in der Auto-Ansicht wird nichts freigegeben
    if(hinweis)hinweis.textContent=`Belegung von ${fzName()} im ganzen Betrieb.`;
    zeichneWoche();

  const d=await jpost("fahrlehrer/fuchs-kalender",
    {fl:FL, ziel_fl:W_FL||undefined, von:WOCHE_START, bis:wPlus(WOCHE_START,6)});
  if(!d||!d.ok){el.innerHTML=`<div class="leer">${esc((d&&d.fehler)||FEHLERTEXT||"FUCHS ist gerade nicht verbunden.")}</div>`;return;}
  let liste=(d.termine)||[];
  if(W_FZ) liste=liste.filter(x=>String(x.fahrzeug_id||"")===String(W_FZ));

  // Freigeben nur im EIGENEN Plan - und nur, wenn die Filiale mitmacht.
  // Im 7-Tage-Fuchs stehen die Fahrstunden fest, dort gibt es das nicht.
  wFreiKnopfZeigen(!!d.frei_moeglich && !W_FL);
  // Urlaub, Theorie, Pruefungen, Buerodienst: die stehen in FUCHS neben den
  // Fahrstunden in einer eigenen Liste. Ohne sie sah eine Urlaubswoche aus wie
  // ein leerer Plan. Sie sind nur zum Ansehen - kein Antippen, kein Loeschen.
  // Bei der Auto-Ansicht bleiben sie weg, dort geht es nur um das Fahrzeug.
  if(!W_FZ) for(const t of (d.taetigkeiten||[])){
    t.fremd=true; t.taetigkeit=true; t.id=null; WOCHE_DATEN.push(t);
  }
  // Theorieunterricht, den DIESER Fahrlehrer haelt. Stand vorher nirgends im
  // Plan - niemand sah, wann er Theorie zu geben hat (Benjamin, 01.09.2026).
  if(!W_FZ) for(const t of (d.theorie||[])){

      fremd:true, taetigkeit:true, id:null, status:"geplant"});

  if(hinweis){

    hinweis.textContent=W_FL

        :(W_FZ?`Deine Fahrstunden mit ${fzName()}.`
              :"Auf eine freie Stelle tippen, um eine Fahrstunde einzuplanen. Urlaub, Theorie und Termine aus dem Büro stehen mit im Plan."));
  }
  zeichneWoche();
}


// ---------------------------------------------------------------------------
// Arbeitszeit im Wochenplan (Angabe in Minuten).
//   praktischer Unterricht ....... hoechstens 495 Minuten am Tag
//   Gesamtarbeitszeit ............ hoechstens 600 Minuten am Tag
// Zur Gesamtarbeitszeit zaehlen zusaetzlich Theorieunterricht und
// Taetigkeiten fuer die Firma. Privat, Urlaub, Krankheit und Feiertage
// sind keine Arbeitszeit; ausgefallene Stunden und Fehlstunden ebenfalls nicht.
// ---------------------------------------------------------------------------
const AZ_PRAXIS_MAX = 495;
const AZ_GESAMT_MAX = 600;
const AZ_PRAXIS_ARTEN = ["uebung", "ueberland", "autobahn", "nacht",
  "pruefungsvorbereitung", "praktische_pruefung", "testfahrt", "sonstiges"];
const AZ_WEITERE_ARBEIT = ["theorie", "taetigkeit"];

function azMinuten(liste) {
  let praxis = 0, weitere = 0;
  for (const e of (liste || [])) {
    // Ein freigegebener, ungebuchter Block ist weder Arbeitszeit noch
    // Leistung - er ist nur ein Angebot (Benjamin, 08.09.2026).
    if (["ausgefallen", "fehlstunde", "frei"].includes(e.status)) continue;
    // Aus dem Buero uebernommene Kalendereintraege bleiben aussen vor - siehe
    // Kommentar oben. Selbst eingetragene Zeiten zaehlen weiterhin mit.
    if (e.taetigkeit) continue;
    const dauer = Number(e.dauer) || 0;
    if (!dauer) continue;
    const art = String(e.art || "");
    if (AZ_PRAXIS_ARTEN.includes(art)) praxis += dauer;
    else if (AZ_WEITERE_ARBEIT.includes(art)) weitere += dauer;
  }
  return { praxis: praxis, gesamt: praxis + weitere };
}

function azKopf(liste) {
  const m = azMinuten(liste);
  if (!m.gesamt) return "";
  const rot = "#b3261e";
  const pStil = m.praxis > AZ_PRAXIS_MAX ? ` style="color:${rot};font-weight:800"` : "";
  const gStil = m.gesamt > AZ_GESAMT_MAX ? ` style="color:${rot};font-weight:800"` : "";
  const hinweis = `Praktischer Unterricht ${m.praxis} von höchstens ${AZ_PRAXIS_MAX} Minuten`
    + ` · Gesamtarbeitszeit ${m.gesamt} von höchstens ${AZ_GESAMT_MAX} Minuten`
    + (m.praxis > AZ_PRAXIS_MAX || m.gesamt > AZ_GESAMT_MAX ? " · Grenze überschritten!" : "");
  return `<i title="${hinweis}"><span${pStil}>${m.praxis}</span>`
    + `<span style="opacity:.55">/</span><span${gStil}>${m.gesamt}</span>`
    + `<span style="opacity:.55"> min</span></i>`;
}

// Gibt es in dieser Woche ueberhaupt gleichzeitige Termine?
function wHatDoppel(){
  const proTag={};
  for(const e of WOCHE_DATEN){
    const t=String(e.uhrzeit||"").split(":"); if(t.length<2)continue;
    const von=Number(t[0])*60+Number(t[1]), bis=von+(Number(e.dauer)||45);
    (proTag[e.datum_iso]=proTag[e.datum_iso]||[]).push([von,bis]);
  }
  for(const tag of Object.values(proTag)){
    tag.sort((a,b)=>a[0]-b[0]);
    for(let i=1;i<tag.length;i++) if(tag[i][0]<tag[i-1][1]) return true;
  }
  return false;
}

// Gleichzeitige Termine nebeneinander legen (wie im Fahrschulmanager).
// Ohne das lagen zwei Termine zur selben Zeit exakt uebereinander und der
// zweite war unsichtbar - bei der B96-Anhaengerausbildung faehrt Thomas
// Krentz aber zulaessigerweise mit zwei Schuelern gleichzeitig.
//
// Verfahren wie in jedem Kalender: nach Beginn sortieren, sich beruehrende
// Termine zu einer Gruppe zusammenfassen, innerhalb der Gruppe jedem Termin
// die erste Spalte geben, die zu seiner Startzeit wieder frei ist. Die
// Gruppe teilt sich die Tagesspalte zu gleichen Teilen.
function wNebeneinander(eintraege){
  const liste=eintraege.filter(x=>x && x.von!=null).sort((a,b)=>(a.von-b.von)||(a.bis-b.bis));
  let gruppe=[], gruppenEnde=-1;
  const abschliessen=()=>{
    if(!gruppe.length)return;
    const spaltenEnde=[];                       // je Spalte: Ende des letzten Termins
    for(const x of gruppe){
      let i=0;
      while(i<spaltenEnde.length && spaltenEnde[i]>x.von) i++;
      if(i===spaltenEnde.length) spaltenEnde.push(x.bis); else spaltenEnde[i]=x.bis;
      x.spalte=i;
    }
    for(const x of gruppe) x.spalten=spaltenEnde.length;
    gruppe=[]; gruppenEnde=-1;
  };
  for(const x of liste){
    if(gruppe.length && x.von>=gruppenEnde) abschliessen();
    gruppe.push(x); gruppenEnde=Math.max(gruppenEnde,x.bis);
  }
  abschliessen();
  return liste;
}

// Endzeit aus Beginn und Dauer. Bewusst hier und nicht beim Server geholt:
// der Wochenplan zeigt drei verschiedene Quellen an, und nur eine davon
// liefert eine Endzeit mit.
function wEnde(beginn, dauer){
  const t=String(beginn||"").split(":");
  if(t.length<2)return "";
  const h=Number(t[0]), m=Number(t[1]);
  if(!Number.isFinite(h)||!Number.isFinite(m))return "";
  const g=h*60+m+(Number(dauer)||45);
  return String(Math.floor(g/60)%24).padStart(2,"0")+":"+String(g%60).padStart(2,"0");
}

function zeichneWoche(){
  const el=document.getElementById("wGitter"); if(!el)return;
  const heute=wHeute();
  let kopf=`<div class="wkopf"><div class="wecke"></div>`;
  for(let i=0;i<7;i++){const iso=wPlus(WOCHE_START,i);
    const summe=azKopf(WOCHE_DATEN.filter(x=>x.datum_iso===iso));
    kopf+=`<div class="wtag${iso===heute?" heute":""}"><b>${WTAGE[i]}</b><span>${wKurz(iso)}</span>${summe}</div>`;}
  kopf+=`</div>`;
  let leiste=`<div class="wleiste">`;
  for(let s=WVON;s<WBIS;s++) leiste+=`<div class="wstd" style="height:${WPX}px">${String(s).padStart(2,"0")}</div>`;
  leiste+=`</div>`;
  let raster="";
  for(let s=WVON+1;s<WBIS;s++) raster+=`<div class="wlinie" style="top:${(s-WVON)*WPX}px"></div>`;
  let spalten="";
  for(let i=0;i<7;i++){
    const iso=wPlus(WOCHE_START,i);
    let blocks="";
    // Erst Zeiten rechnen, dann das Nebeneinander bestimmen.
    const desTages=[];
    // Eine B96-Gruppenschulung (Anlage 7a FeV) steht als eine Zeile JE TEILNEHMER
    // in FUCHS, ist im Plan aber EIN Termin: ein Fahrlehrer, ein Fahrzeug, eine
    // Zeit. Sie wird deshalb zu einem Block zusammengefasst - sonst stuenden vier
    // schmale Saeulen nebeneinander und der Plan saehe aus wie eine Doppelbuchung.
    const gKoepfe={};
    for(const e of WOCHE_DATEN.filter(x=>x.datum_iso===iso)){
      const t=String(e.uhrzeit||"").split(":");
      if(t.length<2)continue;
      const gid=String(e.gruppe_id||"");
      if(gid){
        if(gKoepfe[gid]){ gKoepfe[gid].e.gruppe_mit.push(e); continue; }
        GRUPPEN[gid]=gKoepfe[gid]={e:{...e, gruppe_mit:[e]}};
      }
      const kopf=gid?gKoepfe[gid].e:e;
      const von=(Number(t[0])-WVON)*60+Number(t[1]);
      desTages.push({e:kopf, von, bis:von+(Number(e.dauer)||45), spalte:0, spalten:1});
    }
    for(const platz of wNebeneinander(desTages)){
      const e=platz.e;
      const min=platz.von;
      const oben=Math.max(min/60*WPX,0);
      let hoehe=Math.max((Number(e.dauer)||45)/60*WPX-3,20);
      // Pruefungstermin mit Pruefort: Mindesthoehe, damit der Ort hineinpasst.
      if(String(e.art||"")==="praktische_pruefung"&&String(e.bemerkung||"").trim())
        hoehe=Math.max(hoehe,84);
      // Teilen sich mehrere Termine die Zeit, teilen sie sich auch die Breite.
      const breit=platz.spalten>1
        ? `left:calc(2px + ${platz.spalte} * (100% - 4px) / ${platz.spalten});`
          + `width:calc((100% - 4px) / ${platz.spalten} - 2px);right:auto;font-size:8px;`
        : "";
      const fertig=e.signiert||e.status==="durchgefuehrt";
      // Freigegebener Block: hell und gestrichelt, damit er nie mit einer
      // echten Fahrstunde verwechselt wird.
      const istFrei=e.status==="frei";
      const farbe=ART_FARBE[e.art]||"#667";
      let grund=farbe, schrift="#fff";
      if(istFrei){grund=FREI_MUSTER;schrift="#7a4a2b";}
      else if(e.status==="fehlstunde"){grund=FEHL_MUSTER;}
      else if(e.status==="ausgefallen"){grund=AUS_MUSTER;schrift="#2b3033";}
      else if(farbe==="#f2c200"){schrift="#332800";}
      // Frueher stand hier nur der Vorname. Bei zwei Annas in derselben Woche
      // half das nicht weiter - jetzt steht der ganze Name da.
      const inGruppe=Array.isArray(e.gruppe_mit)&&e.gruppe_mit.length>1;
      const blocker=istBlocker(e);
      // Bei geblockten Zeiten steht kein Name im Termin - dort gehoert die
      // Bemerkung in den Block, sonst heisst jeder Block nur "Taetigkeit".
      const wer=istFrei
        ? ("🔓 frei"+(e.frei_klassen?" · "+String(e.frei_klassen).split(",").join(" · "):""))
        : inGruppe
        ? ("\u{1F465} B96-Gruppe ("+e.gruppe_mit.length+")")
        : (blocker
          ? (()=>{
              const n=BLOCKER_NAME[e.art]||e.art_text||"Geblockte Zeit";
              const bm=String(e.bemerkung||"").trim();
              // "Urlaub: Urlaub" liest sich albern - der Zusatz nur, wenn er
              // wirklich etwas Neues sagt.
              return (bm && bm.toLowerCase()!==n.toLowerCase()) ? n+": "+bm : n;
            })()
          : (String(e.schueler||e.art_text||"Termin").trim()||"Termin"));
      // Fremde Termine (Auto-Ansicht oder Plan einer Kollegin) sind nur zum
      // Ansehen - antippen laesst sich nur der eigene Termin.
      const tippbar=e.id&&!e.fremd;
      const titel=inGruppe
        ? (e.gruppe_mit.map(m=>String(m.schueler||"")).join(", ")+" · "+String((e.uhrzeit||"").slice(0,5))+" · Gruppenschulung B96")
        : (String(wer)+" · "+String((e.uhrzeit||"").slice(0,5))+" · "+String(e.art_text||""));
      const ruf=istFrei?`wFrei(${e.id})`
        :(inGruppe?`wGruppe('${e.gruppe_id}')`:`wBlock(${e.id})`);
      // Bemerkung aus der Planung direkt im Block - der Fahrlehrer soll
      // "Schaltwagen mitbringen" oder "Treffpunkt Bahnhof" sehen, ohne den
      // Termin erst anzutippen. Sie steht auch im Tooltip, falls der Block
      // zu flach ist. Bei geblockten Zeiten ist die Bemerkung schon der Text.
      const bem=(!blocker&&!e.taetigkeit)?String(e.bemerkung||"").trim():"";
      // Bei PRUEFUNGEN steht in der Bemerkung der Pruefort. Der muss immer
      // lesbar sein - da wird nicht gekuerzt und nicht auf die Blockhoehe
      // geschaut. Der Block waechst notfalls ueber seine Zeit hinaus.
      const istPruefung=String(e.art||"")==="praktische_pruefung";
      const bemZeile=bem
        ?(istPruefung
          ?`<span class="wbem wpruef">\u{1F4CD} ${esc(bem)}</span>`
          :(hoehe>=64
            ?`<span class="wbem">\u{1F4DD} ${esc(bem)}</span>`
            :`<span class="wbem" title="${esc(bem)}">\u{1F4DD}</span>`))
        :"";
      // Anfang UND Ende: "wann bin ich wieder frei" ist beim Planen die
      // haeufigste Frage. Gerechnet wird es hier aus Beginn + Dauer und nicht
      // aus e.bis - nicht jede Quelle (Fahrzeugplan, Taetigkeiten) liefert das.
      const bisText=wEnde(e.uhrzeit, e.dauer);
      // Ausbildungsklasse gleich mit im Block: daran sieht der Fahrlehrer auf
      // einen Blick, welches Fahrzeug er braucht (Benjamin, 01.09.2026).
      const kl=(!blocker&&!e.taetigkeit)?String(e.klasse||"").trim():"";
      const klBadge=kl?`<i class="wkl">${esc(kl)}</i>`:"";
      blocks+=`<div class="wblock" title="${esc(titel)}${bisText?" \u2013 "+esc(bisText):""}${kl?" \u00b7 Klasse "+esc(kl):""}${bem?" \u00b7 \u{1F4DD} "+esc(bem):""}"
        style="${breit}top:${oben}px;height:${hoehe}px;background:${grund};color:${schrift}${e.fremd?";opacity:.85":""}${istFrei?";border:1.5px dashed #f67b32;box-shadow:none":""}"
        ${tippbar?`onclick="event.stopPropagation();${ruf}"`:'onclick="event.stopPropagation()"'}
        ><b>${esc((e.uhrzeit||"").slice(0,5))}${bisText?"\u2013":""}</b>${
          bisText?`<span class="wbis">${esc(bisText)}</span>`:""
        }${klBadge}${fertig?"🔑 ":""}${esc(wer)}${bemZeile}</div>`;
    }
    spalten+=`<div class="wspalte" data-tag="${iso}" style="height:${(WBIS-WVON)*WPX}px">${raster}${blocks}</div>`;
  }
  const arten=[...new Set(WOCHE_DATEN.map(x=>x.art))].filter(a=>ART_NAME[a]);
  const gesehen=new Set(); let leg="";
  for(const a of arten){const n=ART_NAME[a]; if(gesehen.has(n))continue; gesehen.add(n);
    leg+=`<span><i style="background:${ART_FARBE[a]}"></i>${esc(n)}</span>`;}
  if(WOCHE_DATEN.some(x=>x.status==="fehlstunde")) leg+=`<span><i style="background:${FEHL_MUSTER}"></i>Fehlstunde</span>`;
  if(WOCHE_DATEN.some(x=>x.status==="ausgefallen")) leg+=`<span><i style="background:${AUS_MUSTER}"></i>ausgefallen</span>`;
  if(WOCHE_DATEN.some(x=>x.status==="frei")) leg+=`<span><i style="background:${FREI_MUSTER};border:1px dashed #f67b32"></i>🔓 zur Selbstbuchung frei</span>`;
  if(WOCHE_DATEN.some(x=>x.signiert||x.status==="durchgefuehrt")) leg+=`<span>🔑 gebucht</span>`;
  // Bei B96 und Co. faehrt ein Fahrlehrer zulaessig mit zwei Schuelern
  // gleichzeitig - dann stehen die Termine nebeneinander wie im Manager.
  if(wHatDoppel()) leg+=`<span title="Zwei Schüler zur selben Zeit – z. B. B96-Anhängerausbildung">⇉ gleichzeitig</span>`;
  leg+=`<span class="wzeit">Minuten je Tag: <b>Praxis</b>/<b>gesamt</b> · erlaubt ${AZ_PRAXIS_MAX}/${AZ_GESAMT_MAX}</span>`;
  el.innerHTML=`${pruefKasten()}${leg?`<div class="wlegende">${leg}</div>`:""}<div class="wrahmen"><div style="min-width:100%">${kopf}<div class="wkoerper">${leiste}${spalten}</div></div></div>`;
  el.querySelectorAll(".wspalte").forEach(sp=>{
    sp.onclick=(ev)=>{
      const r=sp.getBoundingClientRect();
      const y=(ev.touches&&ev.touches[0]?ev.touches[0].clientY:ev.clientY)-r.top;
      let m=Math.round((y/WPX*60)/15)*15;
      m=Math.max(0,Math.min(m,(WBIS-WVON)*60-15));
      viewPlanen(sp.dataset.tag,String(WVON+Math.floor(m/60)).padStart(2,"0")+":"+String(m%60).padStart(2,"0"));
    };
  });
  const rahmen=el.querySelector(".wrahmen");
  let frueh=8*60;
  for(const e of WOCHE_DATEN){const t=String(e.uhrzeit||"").split(":");
    if(t.length>1) frueh=Math.min(frueh,Number(t[0])*60+Number(t[1]));}
  if(rahmen) rahmen.scrollTop=Math.max(0,(frueh-WVON*60)/60*WPX-30);
}

// Geblockte Zeiten sind keine Fahrstunden. Sie lassen sich ansehen und
// wieder wegnehmen - aber niemals unterschreiben.
const BLOCKER_ARTEN=["theorie","taetigkeit","privat","krank","urlaub","feiertag"];
const BLOCKER_NAME={theorie:"Theorieunterricht",taetigkeit:"Tätigkeit (Firma)",
  privat:"Privat",krank:"Krankheit",urlaub:"Urlaub",feiertag:"Feiertag"};
function istBlocker(e){return !!e&&BLOCKER_ARTEN.indexOf(String(e.art||""))>=0
  &&!e.schueler_id&&!String(e.schueler||"").trim();}


// ── Fahrschueler erreichen ───────────────────────────────────
// Die Handynummer haengt am Termin. Sie hier anzubieten spart den Umweg ueber
// das Telefonbuch - und der haeufigste Fall ist eine kurze Nachricht kurz vor
// der Fahrstunde.

// Nur Ziffern mit Landesvorwahl - so versteht WhatsApp die Nummer. Der Server
// liefert sie meistens schon so; von Hand eingetragene Nummern nicht.
function telZiffern(roh) {
  let z = String(roh || "").trim().replace(/[^\d+]/g, "");
  if (z.startsWith("+")) z = z.slice(1);
  else if (z.startsWith("00")) z = z.slice(2);
  else if (z.startsWith("0")) z = "49" + z.slice(1);
  z = z.replace(/\D/g, "");
  return z.length >= 10 ? z : "";
}

// Ist das ein Handy? Nur dann fuehrt WhatsApp irgendwohin. Deutsche
// Mobilfunknummern beginnen nach der Landesvorwahl mit 15, 16 oder 17.
function istHandy(roh) {
  const z = telZiffern(roh);
  return !!z && /^49(15|16|17)/.test(z);
}

// "491701234567" liest sich niemand durch. Fuer die Anzeige wieder aufbrechen.
function telSchoen(roh) {
  const z = telZiffern(roh);
  if (!z) return "";
  if (/^49(15|16|17)/.test(z)) return "+49 " + z.slice(2, 5) + " " + z.slice(5);
  if (z.startsWith("49")) return "+49 " + z.slice(2);
  return "+" + z;
}

// ── Termin per WhatsApp schicken ─────────────────────────────
// Der Fahrlehrer schickt von seinem eigenen WhatsApp. Wir nehmen ihm nur das
// Tippen ab: Datum, Wochentag, Uhrzeit, Dauer und Art stehen fertig da.

// Aus "2026-08-28" wird "Donnerstag, 28.08.2026". Das ISO-Datum ist
// eindeutig - die Anzeigefassung sieht je nach Ansicht anders aus.
const WOCHENTAGE = ["Sonntag", "Montag", "Dienstag", "Mittwoch",
                    "Donnerstag", "Freitag", "Samstag"];
function terminDatumLang(iso, rueckfall) {
  const m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(String(iso || "").trim());
  if (!m) return String(rueckfall || "").split(" · ")[0].trim();
  const d = new Date(Number(m[1]), Number(m[2]) - 1, Number(m[3]));
  return WOCHENTAGE[d.getDay()] + ", " + m[3] + "." + m[2] + "." + m[1];
}

// "15:00" + 90 Minuten -> "16:30"
function terminEnde(zeit, dauer) {
  const m = /^(\d{1,2}):(\d{2})/.exec(String(zeit || "").trim());
  const min = Number(dauer || 0);
  if (!m || !min) return "";
  const g = Number(m[1]) * 60 + Number(m[2]) + min;
  return String(Math.floor(g / 60) % 24).padStart(2, "0") + ":" + String(g % 60).padStart(2, "0");
}

// Die fertige Nachricht. Sie soll allein stehen koennen - der Schueler liest
// sie vielleicht Tage spaeter wieder.
function terminNachricht(t) {
  const vorname = String(t.schueler || "").trim().split(" ")[0];
  const ich = (typeof FLNAME === "string" ? FLNAME.trim() : "");
  const wann = terminDatumLang(t.datum_iso, t.datum);
  const von = String(t.uhrzeit || "").slice(0, 5);
  const bis = String(t.bis || "").slice(0, 5) || terminEnde(von, t.dauer);
  const art = String(t.art_text || "Fahrstunde").trim();

  let z = "";
  if (von && bis) z = "von " + von + " bis " + bis + " Uhr";
  else if (von) z = "um " + von + " Uhr";
  if (t.dauer) z += (z ? " · " : "") + String(t.dauer) + " Minuten";

  let s = "Hallo" + (vorname ? " " + vorname : "") + "! 🚗\n\n";
  s += "Dein Termin steht:\n";
  s += art + "\n" + wann + (z ? "\n" + z : "") + "\n";
  if (t.bemerkung) s += "\n" + String(t.bemerkung).trim() + "\n";
  s += "\nFalls es nicht passt, sag mir bitte rechtzeitig Bescheid.\n\n";
  s += (ich ? ich : "Deine Fahrschule") + " · Fahrschule Fuchs 🦊";
  return s;
}

// Oeffnet WhatsApp mit der fertigen Nachricht. Ohne Handynummer gibt es den
// Knopf gar nicht erst - deshalb hier nur der Notnagel.
function terminSchicken(t) {
  const z = telZiffern(t && t.nummer);
  if (!z) { toast("Keine Handynummer hinterlegt"); return; }
  window.open("https://wa.me/" + z + "?text=" + encodeURIComponent(terminNachricht(t)),
              "_blank", "noopener");
}

// ALLE anstehenden Termine eines Schuelers auf einmal schicken. Der Server
// baut die Nachricht (er kennt auch die Termine bei Kollegen), verschickt wird
// sie aus dem eigenen WhatsApp des Fahrlehrers - kostenlos und ohne Vorlage.
async function alleTermineSchicken(nummer) {
  const z = telZiffern(nummer);
  if (!z) { toast("Keine Handynummer hinterlegt"); return; }
  toast("Termine werden geholt …");
  let d = null;
  try { d = await jpost("fahrlehrer/termine-text", { fl: FL, pin: PIN, nummer }); } catch (e) { }
  if (!d || !d.ok) { toast((d && d.fehler) || "Termine gerade nicht abrufbar"); return; }
  window.open("https://wa.me/" + z + "?text=" + encodeURIComponent(d.text),
              "_blank", "noopener");
}
// Der Sammelknopf. Ohne Handynummer gibt es ihn nicht.
function alleTermineKnopfHTML(nummer) {
  if (!istHandy(nummer)) return "";
  return `<button class="btn-primary" style="background:#25D366;margin-top:8px"
    onclick="alleTermineSchicken('${esc(String(nummer || ""))}')">📤 Alle Termine per WhatsApp senden</button>`;
}

// Die vorbereitete Nachricht. Der Fahrlehrer kann sie vor dem Abschicken

function kontaktText(name, anlass) {

// Antippen im Wochenplan oeffnet das Terminmenue. Frueher fuehrte jeder Tipp
// sofort zur Unterschrift - Verschieben und Loeschen waren von hier aus gar
// nicht erreichbar.
// Pruefungen der Woche mit PRUEFORT, ueber dem Plan.
// Im Raster ist eine Spalte auf dem Handy rund 40 Pixel breit - dort passt
// keine Adresse hinein, egal wie hoch der Block ist. Der Pruefort steht im
// Buero aber in der Bemerkung, und der Fahrlehrer muss ihn VORHER lesen
// koennen. Deshalb hier eine eigene Zeile je Pruefung, voll ausgeschrieben.
const WTAG_KURZ=["So","Mo","Di","Mi","Do","Fr","Sa"];
function pruefKasten(){
  const p=(WOCHE_DATEN||[])
    .filter(e=>String(e.art||"")==="praktische_pruefung"&&e.status!=="ausgefallen")
    .sort((a,b)=>String(a.datum_iso+a.uhrzeit).localeCompare(String(b.datum_iso+b.uhrzeit)));
  if(!p.length)return "";
  const zeile=(e)=>{
    const d=new Date(String(e.datum_iso)+"T12:00:00");
    const wt=isNaN(d)?"":WTAG_KURZ[d.getDay()]+" ";
    const dat=String(e.datum_iso||"").slice(8,10)+"."+String(e.datum_iso||"").slice(5,7)+".";
    const ort=String(e.bemerkung||"").trim();
    const fertig=e.signiert||e.status==="durchgefuehrt";
    return `<div class="pruefz"${e.id?` onclick="wBlock(${e.id})"`:""}>
        <div class="pruefk">${fertig?"\u{1F511} ":""}${esc(wt+dat)} ${esc((e.uhrzeit||"").slice(0,5))}</div>
        <div class="pruefi"><b>${esc(e.schueler||"Prüfung")}</b>${e.klasse?" \u00b7 "+esc(e.klasse):""}
          <div class="pruefo">${ort?"\u{1F4CD} "+esc(ort):"<i>kein Prüfort eingetragen \u2013 bitte im Büro nachfragen</i>"}</div>
        </div></div>`;
  };
  return `<div class="pruefbox">
      <div class="pruefh">\u{1F4CD} ${p.length===1?"Prüfung":"Prüfungen"} diese Woche</div>
      ${p.map(zeile).join("")}</div>`;
}

// ── Zur Selbstbuchung freigeben ──────────────────────────────
// Ein freigegebener Block ist ein ANGEBOT, kein Termin: keine Arbeitszeit,
// keine Leistung, kein blockiertes Fahrzeug. Erst wenn ein Fahrschueler ihn
// in seiner App bucht, wird eine echte Fahrstunde daraus.
//
// Benjamin, 08.09.2026:
//   - 80 Minuten sind Standard UND Untergrenze, laenger geht (bis 240)
//   - KEIN Fahrzeug: Jeder faehrt sein festes Auto; ob der Automatikwagen
//     frei ist, entscheidet sich erst im Moment der Buchung
let FREI_MOEGLICH=false;
const FREI_KLASSEN_FL=["B","B197","BA"];
let FREI_WAHL={B:true,B197:true,BA:true};

function wFreiKnopfZeigen(an){
  FREI_MOEGLICH=!!an;
  const b=document.getElementById("wFreiKnopf");
  if(b)b.style.display=an?"":"none";
}

// Antippen eines freigegebenen Blocks. Kein Terminmenue - hier gibt es nichts
// zu unterschreiben und nichts abzusagen, nur zurueckzunehmen.
function wFrei(id){
  const zurueck=WOCHE_START||wMontag(wHeute());
  const e=(WOCHE_DATEN||[]).find(x=>String(x.id)===String(id));
  if(!e){toast("Block nicht gefunden");return;}
  const kl=String(e.frei_klassen||"").split(",").map(x=>x.trim()).filter(Boolean).join(" · ");
  main().innerHTML=`
    <button class="btn-ghost" onclick="viewWoche('${zurueck}')">← Zurück zum Wochenplan</button>
    <div><div class="eyebrow">Selbstbuchung</div><h1>🔓 Freigegebener Block</h1></div>
    <div class="card zeile" style="cursor:default">
      <div class="zeit">${esc((e.uhrzeit||"").slice(0,5))}${e.bis?"–"+esc(e.bis):""}</div>
      <div class="info"><div class="titel">${esc(e.datum||"")}</div>
        <div class="sub">${esc(String(e.dauer||""))} Min.${kl?" · für "+esc(kl):""}</div></div>
    </div>
    <div class="hint">Dieser Block steht in der Fahrschüler-App zur Buchung bereit.
      <b>Gebucht hat ihn noch niemand.</b> Bis dahin zählt er weder als Arbeitszeit noch als
      geleistete Fahrstunde, und er blockiert kein Fahrzeug – das Auto wird erst bei der
      Buchung bestimmt.</div>
    <button class="btn-ghost" id="fWeg">Freigabe zurücknehmen</button>
    <div class="meta" id="fErr" style="color:#D64545;min-height:16px"></div>`;

async function freigebenSpeichern(trotzdem){
  const err=document.getElementById("fErr"); if(err)err.innerHTML="";
  const klassen=FREI_KLASSEN_FL.filter(k=>FREI_WAHL[k]);
  if(!klassen.length){err.textContent="Bitte mindestens eine Ausbildung auswählen.";return;}
  const dauer=Number(document.getElementById("fDauer").value||0);
  if(dauer<80){err.textContent="Ein freigegebener Block ist mindestens 80 Minuten lang.";return;}
  const datum=document.getElementById("fDatum").value;
  const beginn=document.getElementById("fZeit").value;
  if(!datum||!beginn){err.textContent="Bitte Datum und Uhrzeit angeben.";return;}
  const btn=document.getElementById("fSpeichern");
  btn.disabled=true; btn.textContent="Gibt frei …";
  const d=await jpost("fahrlehrer/frei-anlegen",{fl:FL,datum,beginn,dauer,klassen,trotzdem});
  btn.disabled=false; btn.textContent="🔓 Zeit freigeben";
  if(d&&d.ok){toast("Zeit freigegeben ✓");viewWoche(wMontag(datum));return;}
  // Die Arbeitszeitgrenze ist beim Freigeben eine WARNUNG, keine Sperre:
  // geplante Stunden koennen schliesslich noch ausfallen.
  if(d&&d.konflikt&&!trotzdem){
    err.innerHTML=esc(d.fehler||"Das passt zeitlich nicht.")
      +`<br><button class="btn-ghost" style="margin-top:8px"
          onclick="freigebenSpeichern(true)">Trotzdem freigeben</button>`;
    return;
  }
  err.textContent=(d&&d.fehler)||FEHLERTEXT||"Freigeben hat nicht geklappt.";
}

// Liegt der Termin noch in der Zukunft? Nur dann darf eine Fahrstunde als
// Planungsfehler geloescht werden. Was vorbei ist, wird abgesagt oder als
// Fehlstunde gebucht - sonst verschwindet eine kurzfristige Absage spurlos.
function terminKuenftig(e){
  const iso=String((e&&e.datum_iso)||"");
  if(!iso)return false;
  const heute=wHeute();
  if(iso>heute)return true;
  if(iso<heute)return false;
  const t=String(e.uhrzeit||"00:00").split(":");
  const jetzt=new Date();
  return (Number(t[0])*60+Number(t[1])) > (jetzt.getHours()*60+jetzt.getMinutes());
}

// Darf dieser Termin noch geloescht werden? Bis TAGESENDE - nicht nur bis zur
// Startzeit (Benjamin, 02.09.2026). Der Fall ist der Alltag: der Schueler kommt
// um 14:00 nicht, es ist 14:05, der Fahrlehrer vergibt die Zeit an einen
// anderen Schueler. Dann soll die alte Stunde weg. Was vor heute liegt, wird
// weiterhin abgesagt oder als Fehlstunde gebucht - sonst verschwindet eine
// kurzfristige Absage spurlos aus dem Buero.
function terminLoeschbar(e){
  const iso=String((e&&e.datum_iso)||"");
  if(!iso)return false;
  return iso>=wHeute();
}

// Fahrzeug zu einem Termin. Der Fahrschulmanager schickt es fertig als
// fahrzeug_text ("B-FX 1771 - VW Tiguan - Schaltung"); aeltere Antworten ohne
// dieses Feld werden hier notduerftig zusammengesetzt.
function fzText(e){
  if(!e)return "";
  if(e.fahrzeug_text)return String(e.fahrzeug_text);
  const teile=[e.fahrzeug_kennzeichen,e.fahrzeug].map(x=>String(x||"").trim()).filter(Boolean);
  return teile.join(" · ");
}
// Kurzform fuer die Wochenliste: Kennzeichen, sonst der Fahrzeugname.
function fzKurz(e){
  if(!e||istBlocker(e))return "";
  const t=String(e.fahrzeug_kennzeichen||"").trim()||String(e.fahrzeug||"").trim();
  return t?' · 🚗 '+esc(t):"";
}
function fzKarteHTML(e){
  const t=fzText(e);
  if(t) return `<div class="card" style="cursor:default">
      <div class="eyebrow">Fahrzeug</div>
      <div class="titel" style="font-size:16px">🚗 ${esc(t)}</div></div>`;
  return `<div class="card" style="cursor:default">
      <div class="eyebrow">Fahrzeug</div>
      <div class="sub">Für diesen Termin ist kein Fahrzeug eingetragen – bitte im Büro nachfragen.</div></div>`;
}

function tmKnopf(text, ruf, stil){
  return `<button class="btn-${stil||"ghost"}" style="width:100%;text-align:left;margin-top:8px"
    onclick="${ruf}">${text}</button>`;
}

function terminMenue(id){
  const e=FUCHS_TERMINE[id]; if(!e){toast("Termin nicht gefunden");return;}
  const fertig=e.signiert||e.status==="durchgefuehrt";
  const abgesagt=e.status==="ausgefallen"||e.status==="fehlstunde";
  const blocker=istBlocker(e);
  const name=blocker?(BLOCKER_NAME[e.art]||e.art_text||"Geblockte Zeit"):(e.schueler||"Fahrstunde");
  let stand="";
  if(e.status==="fehlstunde")stand=`<div class="klbadge" style="background:#FBECEC;color:#C23">Fehlstunde</div>`;
  else if(e.status==="ausgefallen")stand=`<div class="klbadge" style="background:#FBECEC;color:#C23">ausgefallen</div>`;
  else if(fertig)stand=`<div class="klbadge" style="background:#E7F5EC;color:#1B7A43">✓ gebucht</div>`;
  else if(e.klasse)stand=`<div class="klbadge">${esc(e.klasse)}</div>`;

  let knoepfe="";
  if(!fertig&&!abgesagt&&!blocker){
    knoepfe+=tmKnopf("✍️ Unterschreiben & buchen","signStunde("+id+")","primary");
  }
  if(fertig&&e.art==="praktische_pruefung"&&!pruefErg(e)){
    knoepfe+=tmKnopf("🎓 Prüfungsergebnis eintragen","pruefungErgebnis("+id+")","primary");
  }
  if(!fertig&&!abgesagt){
    knoepfe+=tmKnopf("🕒 Termin ändern – Zeit oder Schüler","verschiebenPanel("+id+")");
  }
  if(!fertig&&!abgesagt&&!blocker){
    knoepfe+=tmKnopf("✕ Termin absagen / ausgefallen","viewAusfall("+id+")");
  }
  if(fertig&&e.nummer){
    knoepfe+=tmKnopf("📋 Ausbildungskarte pflegen","karteVonStunde("+id+")");
  }
  // Fehlstunde streichen: Konnte die Zeit neu vergeben werden, hat der
  // Fahrlehrer keinen Ausfall - dann soll der Fahrschueler sie auch nicht
  // bezahlen (Benjamin, 01.09.2026). Bewusst ein eigener Knopf mit eigenem
  // Text: "loeschen" waere hier zu harmlos formuliert, es geht um Geld.
  if(e.status==="fehlstunde"){
    knoepfe+=`<button class="btn-primary" style="width:100%;text-align:left;margin-top:8px;background:#C23"
      onclick="fehlstundeStreichen(${id})">\u{1F5D1} Fehlstunde streichen \u2013 wird nicht berechnet</button>`;
  }
  // Loeschen: geblockte Zeiten immer, Fahrstunden nur, solange sie noch
  // bevorstehen und niemand unterschrieben hat.
  if(!fertig&&(blocker||(!abgesagt&&terminLoeschbar(e)))){
    knoepfe+=`<button class="btn-primary" style="width:100%;text-align:left;margin-top:8px;background:#C23"
      onclick="terminLoeschen(${id})">🗑 Termin löschen</button>`;
  }
  if(!knoepfe){
    knoepfe=`<div class="hint">Für diesen Termin gibt es hier nichts mehr zu tun.</div>`;
  }

  main().innerHTML=`
    <button class="btn-ghost" onclick="wZurueckGehen()">← Zurück</button>
    <div><div class="eyebrow">${blocker?"Geblockte Zeit":"Termin"}</div><h1>${esc(name)}</h1></div>
    <div class="card zeile" style="cursor:default">
      <div class="zeit">${esc((e.uhrzeit||"").slice(0,5))}${e.bis?"–"+esc(e.bis):""}</div>
      <div class="info"><div class="titel">${esc(e.datum||"")}</div>
      <div class="sub">${esc(blocker?(BLOCKER_NAME[e.art]||e.art_text||""):(e.art_text||""))}${e.dauer?" · "+esc(String(e.dauer))+" Min.":""}</div></div>
      ${stand}
    </div>
    ${blocker?"":fzKarteHTML(e)}
    ${e.bemerkung?`<div class="card" style="cursor:default"><div class="sub">${esc(e.bemerkung)}</div></div>`:""}
    ${blocker?`<div class="hint">Hier ist keine Fahrstunde eingetragen – die Zeit ist nur geblockt.
       Das Büro sieht den Eintrag genauso in deinem Plan.</div>`:""}
    ${(!blocker && !fertig && !abgesagt) ? alleTermineKnopfHTML(e.nummer) : ""}
    ${blocker?"":kontaktKarteHTML(e.schueler, e.nummer,
        "Es geht um deine Fahrstunde am " + String(e.datum||"")
        + (e.uhrzeit?(" um " + String(e.uhrzeit).slice(0,5) + " Uhr"):"") + ".")}
    ${knoepfe}
    <div class="meta" id="tmFehler" style="color:#D64545;min-height:16px"></div>`;
  main().scrollTop=0;
}

// Fehlstunde streichen - Termin UND Forderung verschwinden zusammen.
// Der Manager protokolliert, wer es war; das Buero sieht es im Protokoll.
async function fehlstundeStreichen(id){
  const e=FUCHS_TERMINE[id]; if(!e)return;
  const wen=String(e.schueler||"").trim()||"der Fahrschüler";
  if(!confirm("Fehlstunde streichen?\n\n"+wen+" bekommt sie dann NICHT berechnet – "
    + "gedacht für den Fall, dass du die Zeit neu vergeben konntest.\n\n"
    + "Der Termin verschwindet aus dem Plan. Rückgängig macht das nur das Büro."))return;
  const err=document.getElementById("tmFehler"); if(err)err.textContent="";
  const d=await jpost("fahrlehrer/fehlstunde-streichen",{fl:FL,stunde_id:id});
  if(d&&d.ok){
    toast(d.betrag_text?("Gestrichen \u2713 \u2013 "+d.betrag_text+" nicht berechnet"):"Fehlstunde gestrichen \u2713");
    delete FUCHS_TERMINE[id]; wZurueckGehen(); return;
  }
  if(err)err.textContent=(d&&d.fehler)||FEHLERTEXT||"Streichen fehlgeschlagen.";
}

async function terminLoeschen(id){
  const e=FUCHS_TERMINE[id]; if(!e)return;
  const mitSchueler=!!(e.schueler_id||String(e.schueler||"").trim());
  // Eine Stunde, die heute schon begonnen hat, darf weg - aber nur, wenn die
  // Zeit wirklich neu vergeben wird. Sonst gehoert sie als Fehlstunde gebucht,
  // damit der Ausfall im Buero und auf dem Schuelerkonto sichtbar bleibt.
  const begonnen=mitSchueler&&!terminKuenftig(e)&&terminLoeschbar(e);
  const frage=!mitSchueler
    ? "Diesen Eintrag wirklich löschen?"
    : begonnen
      ? "Diese Fahrstunde hat bereits begonnen.\n\nLöschen ist richtig, wenn du die Zeit "
        + "neu vergibst – dann wird sie dem Schüler nicht berechnet.\n\nIst der Schüler ohne "
        + "Absage nicht erschienen und die Zeit bleibt leer, trag sie bitte stattdessen als "
        + "Fehlstunde ein.\n\nWirklich löschen?"
      : "Diesen Termin wirklich löschen?\n\nNur für einen Planungsfehler gedacht. Hat der Schüler abgesagt, "
        + "trag ihn bitte stattdessen als „ausgefallen“ oder als Fehlstunde ein – sonst fehlt der Vorgang im Büro.";
  if(!confirm(frage))return;
  const err=document.getElementById("tmFehler"); if(err)err.textContent="";
  const d=await jpost("fahrlehrer/termin-loeschen",{fl:FL,stunde_id:id});
  if(d&&d.ok){toast("Termin gelöscht ✓"); delete FUCHS_TERMINE[id]; wZurueckGehen(); return;}
  if(err)err.textContent=(d&&d.fehler)||FEHLERTEXT||"Löschen fehlgeschlagen.";
}
